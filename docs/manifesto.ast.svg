(:scene
  :id "lumina-architecture-manifesto"
  :type "Slide"
  :title "Lumina: Sovereign Architectural Manifesto"
  :stage "FOUNDATIONAL SYSTEM ARCHITECTURE"
  :duration 1.0

  ;; -------------------------------------------------------------
  ;; 1. DOCUMENT STATE REGISTERS
  ;; -------------------------------------------------------------
  (:vars (
    (:var :name "page" :val 0 :min 0 :max 3 :step 1 :label "Chapter")
    (:var :name "wasmByteOffset" :val 128 :min 0 :max 448 :step 1 :label "Linear Memory Pointer (KB)")
    (:var :name "diagramZoom" :val 1.0 :min 0.8 :max 2.0 :step 0.1 :label "Vector Inspection Zoom")
  ))

  ;; -------------------------------------------------------------
  ;; 2. INTERFACE BINDINGS (Page turners & live interactive inputs)
  ;; -------------------------------------------------------------
  (:inputs (
    (:slider :var "page" :label "Turn Chapter" :min 0 :max 3 :step 1)
    (:slider :var "wasmByteOffset" :label "Inspect WASM Ring Buffer" :min 0 :max 448 :step 1)
  ))

  ;; -------------------------------------------------------------
  ;; 3. COMPUTED INTERMEDIATE MATRICES
  ;; -------------------------------------------------------------
  (:computed (
    ;; Translates the viewport 800 units per page: (0 -> 0, 1 -> -800, 2 -> -1600, 3 -> -2400)
    (:name "spineTranslationX" :expr "-(vars.page || 0) * 800")
    ;; Computes memory ring pointer for Page 2's live memory map
    (:name "memoryPointerAngle" :expr "((vars.wasmByteOffset || 0) / 448) * 360")
  ))

  ;; -------------------------------------------------------------
  ;; 4. PEDAGOGICAL STAGE MARKERS (The Index / Table of Contents)
  ;; -------------------------------------------------------------
  (:keyframes (
    (:t 0.00 :title "I. The Anti-Enclosure Axiom" :rule "Zero Telemetry, Zero Cloud Compute, Universal Destination of Goods")
    (:t 0.33 :title "II. WASM 7-Page Linear Memory" :rule "Fixed 448 KB Virtual ISA. Zero Allocation in Hot Animation Loops")
    (:t 0.66 :title "III. The AST Tuple Pipeline" :rule "Declarative S-Expressions Compiling Directly into Pure SVG Nodes")
    (:t 1.00 :title "IV. The Sovereign Offline Covenant" :rule "Air-Gapped P2P Mesh, Static Integrity, AGPLv3 Dual Licensing")
  ))

  ;; -------------------------------------------------------------
  ;; 5. 60 FPS VECTOR BINDINGS
  ;; -------------------------------------------------------------
  (:bindings (
    ;; Camera/Spine Translation: moves the stage smoothly across chapters
    (:target "#document-spine" :attr "transform" :expr "translate(computed.spineTranslationX, 0)")

    ;; Chapter Counter Badges
    (:target "#chapter-indicator" :attr "textContent" :expr "'CHAPTER ' + ((vars.page || 0) + 1) + ' OF 4'")

    ;; Page 2 Live Diagram: Interactive WASM 448KB Memory Radial Dial
    (:target "#wasm-dial-pointer" :attr "transform" :expr "rotate(computed.memoryPointerAngle, 1200, 250)")
    (:target "#wasm-addr-readout" :attr "textContent" :expr "'0x' + (vars.wasmByteOffset * 1024).toString(16).toUpperCase().padStart(6, '0') + ' / 0x070000'")

    ;; Page 3 Live Diagram: Interactive AST -> SVG Vector Pipeline Demonstration
    (:target "#live-vector-rect" :attr "width" :expr "60 + ((vars.wasmByteOffset || 0) / 448) * 120")
    (:target "#live-ast-token-readout" :attr "textContent" :expr "'(:target \"#rect\" :width ' + (60 + ((vars.wasmByteOffset || 0) / 448) * 120).toFixed(0) + ')'")
  ))

  ;; -------------------------------------------------------------
  ;; 6. DIRECT TOUCH / CLICK MANIPULATION
  ;; -------------------------------------------------------------
  (:gestures (
    ;; Allow dragging the dial on Page 2 directly on touchscreens
    (:draggable :target "#wasm-dial-handle" :axis "x" :min 1050 :max 1350)
  ))
)
