<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#090d16; font-family:system-ui, sans-serif;">
  <defs>
    <!-- Dark slate document cards -->
    <linearGradient id="pageCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Blueprint grid background -->
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Persistent Background Grid -->
  <rect width="800" height="500" fill="url(#blueprintGrid)" />

  <!-- Global Header HUD -->
  <g id="hud-header">
    <text x="30" y="38" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">LUMINA ARCHITECTURAL DISSERTATION</text>
    <text id="chapter-indicator" x="770" y="38" text-anchor="end" fill="#94a3b8" font-size="11" font-family="monospace">CHAPTER 1 OF 4</text>
    <line x1="30" y1="50" x2="770" y2="50" stroke="#334155" stroke-width="1" />
  </g>

  <!-- ============================================================= -->
  <!-- THE HORIZONTAL DOCUMENT SPINE (Moves via translate(x, 0))    -->
  <!-- ============================================================= -->
  <g id="document-spine">

    <!-- --------------------------------------------------------- -->
    <!-- PAGE 1: CHAPTER I — THE ANTI-ENCLOSURE AXIOM (0 to 800)   -->
    <!-- --------------------------------------------------------- -->
    <g id="page-1" transform="translate(0, 0)">
      <rect x="40" y="70" width="720" height="390" rx="12" fill="url(#pageCardGrad)" stroke="#334155" stroke-width="1.5" />
      
      <text x="70" y="115" fill="#f8fafc" font-size="20" font-weight="700">I. The Anti-Enclosure Axiom</text>
      <text x="70" y="145" fill="#94a3b8" font-size="13">A rejection of telemetry-driven, surveillance-capitalist educational software.</text>

      <text x="70" y="190" fill="#cbd5e1" font-size="13" font-family="monospace">01. ZERO NETWORK EGRESS:</text>
      <text x="70" y="210" fill="#64748b" font-size="12">No tracking pixels. No Google Analytics. No central cloud auth telemetry.</text>

      <text x="70" y="245" fill="#cbd5e1" font-size="13" font-family="monospace">02. CLIENT-SIDE SOVEREIGNTY:</text>
      <text x="70" y="265" fill="#64748b" font-size="12">Execution runs entirely inside client registers. The classroom operates offline.</text>

      <text x="70" y="300" fill="#cbd5e1" font-size="13" font-family="monospace">03. HUMANITARIAN COMMONS (AGPLv3):</text>
      <text x="70" y="320" fill="#64748b" font-size="12">Perpetually free for state schools, Catholic dioceses, and emerging nations.</text>
      
      <!-- Seal badge -->
      <circle cx="680" cy="380" r="45" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
      <text x="680" y="384" text-anchor="middle" fill="#38bdf8" font-size="10" font-family="monospace">AIR-GAPPED</text>
    </g>

    <!-- --------------------------------------------------------- -->
    <!-- PAGE 2: CHAPTER II — WASM LINEAR MEMORY SUBSTRATE (800)    -->
    <!-- --------------------------------------------------------- -->
    <g id="page-2" transform="translate(800, 0)">
      <rect x="40" y="70" width="720" height="390" rx="12" fill="url(#pageCardGrad)" stroke="#334155" stroke-width="1.5" />

      <text x="70" y="115" fill="#f8fafc" font-size="20" font-weight="700">II. 7-Page (448 KB) WASM Memory Contract</text>
      <text x="70" y="145" fill="#94a3b8" font-size="13">Zero dynamic heap allocation during the active 60 FPS animation loop.</text>

      <!-- Live Interactive Diagram: Linear Memory Ring & Address Pointer -->
      <g id="wasm-memory-viz" transform="translate(400, 0)">
        <circle cx="200" cy="250" r="90" fill="#090d16" stroke="#334155" stroke-width="14" />
        <circle cx="200" cy="250" r="90" fill="none" stroke="#38bdf8" stroke-width="14" stroke-dasharray="140 425" />
        
        <!-- Rotating needle driven by S-expression -->
        <g id="wasm-dial-pointer">
          <line x1="200" y1="250" x2="200" y2="175" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
          <circle cx="200" cy="250" r="6" fill="#f43f5e" />
        </g>
      </g>

      <text x="70" y="210" fill="#94a3b8" font-size="12">Interactive Memory Inspection:</text>
      <text id="wasm-addr-readout" x="70" y="235" fill="#38bdf8" font-size="14" font-family="monospace">0x020000 / 0x070000</text>
      <text x="70" y="270" fill="#64748b" font-size="12">Structure of Arrays (SoA) layout guarantees</text>
      <text x="70" y="288" fill="#64748b" font-size="12">cache locality across low-spec Celeron/ARM CPUs.</text>
    </g>

    <!-- --------------------------------------------------------- -->
    <!-- PAGE 3: CHAPTER III — S-EXPR TO VECTOR PIPELINE (1600)    -->
    <!-- --------------------------------------------------------- -->
    <g id="page-3" transform="translate(1600, 0)">
      <rect x="40" y="70" width="720" height="390" rx="12" fill="url(#pageCardGrad)" stroke="#334155" stroke-width="1.5" />

      <text x="70" y="115" fill="#f8fafc" font-size="20" font-weight="700">III. Declarative S-Expressions into Pure Vectors</text>
      <text x="70" y="145" fill="#94a3b8" font-size="13">No Virtual DOM diffing. Mathematical evaluation maps directly to SVG attributes.</text>

      <!-- Live Rendering Box -->
      <g transform="translate(480, 190)">
        <rect x="0" y="0" width="220" height="150" fill="#090d16" rx="8" stroke="#334155" />
        <!-- This rectangle is actively scaled by the S-Expression expression -->
        <rect id="live-vector-rect" x="30" y="45" width="100" height="60" fill="#38bdf8" rx="4" />
      </g>

      <text x="70" y="200" fill="#94a3b8" font-size="12">Active Evaluated Tuple Output:</text>
      <rect x="70" y="215" width="380" height="42" fill="#090d16" rx="6" stroke="#1e293b" />
      <text id="live-ast-token-readout" x="85" y="241" fill="#a7f3d0" font-size="11" font-family="monospace">(:target "#rect" :width 100)</text>
    </g>

    <!-- --------------------------------------------------------- -->
    <!-- PAGE 4: CHAPTER IV — THE OFFLINE TRUST COVENANT (2400)    -->
    <!-- --------------------------------------------------------- -->
    <g id="page-4" transform="translate(2400, 0)">
      <rect x="40" y="70" width="720" height="390" rx="12" fill="url(#pageCardGrad)" stroke="#334155" stroke-width="1.5" />

      <text x="70" y="115" fill="#f8fafc" font-size="20" font-weight="700">IV. The Sovereign Offline Covenant</text>
      <text x="70" y="145" fill="#94a3b8" font-size="13">Built for permanence, optical sneakernets, and zero marginal costs.</text>

      <text x="70" y="210" fill="#cbd5e1" font-size="13" font-family="monospace">P2P CLASSROOM BEACONS:</text>
      <text x="70" y="230" fill="#64748b" font-size="12">Local WebRTC data channels and animated QR codes transfer cartridges with 0 B bandwidth.</text>

      <text x="70" y="270" fill="#cbd5e1" font-size="13" font-family="monospace">MECHANICAL SYMPATHY:</text>
      <text x="70" y="290" fill="#64748b" font-size="12">No flash wear. Zero disk writes during live simulation loops.</text>
    </g>

  </g>
</svg>
