<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="theatre-wood-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#1c1917" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="dagger-crimson-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0" />
    </radialGradient>
    <filter id="theatre-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Elizabethan Oak Background -->
  <rect width="800" height="480" fill="url(#theatre-wood-glow)" />

  <!-- 3D 1599 Globe Amphitheatre Tiers -->
  <g id="globe-3d-amphitheatre" stroke="rgba(217, 119, 6, 0.25)" stroke-width="1.5">
    <ellipse id="globe-gallery-ring" cx="400" cy="270" rx="220" ry="60" fill="none" />
    <ellipse id="globe-yard-ring" cx="400" cy="275" rx="160" ry="45" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(217, 119, 6, 0.4)" />
    <!-- Pillars of Hercules Supporting Heavens -->
    <line x1="320" y1="130" x2="320" y2="280" stroke="#78350f" stroke-width="6" />
    <line x1="480" y1="130" x2="480" y2="280" stroke="#78350f" stroke-width="6" />
    <!-- The Heavens Canopy Roof -->
    <polygon id="globe-heavens-roof" points="290,130 510,130 490,100 310,100" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="400" y="120" text-anchor="middle" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif" font-weight="800">
      THE HEAVENS (STARS &amp; CANOPY)
    </text>
  </g>

  <!-- Thrust Stage Platform (Earth) -->
  <g id="globe-thrust-stage">
    <polygon id="globe-stage-platform" points="300,270 500,270 515,325 285,325" fill="#292524" stroke="#d97706" stroke-width="2" />
    
    <!-- Trapdoor to Hell with Sulfur Mist -->
    <ellipse id="hell-trapdoor" cx="400" cy="285" rx="24" ry="11" fill="#0c0a09" stroke="#ef4444" stroke-width="1.5" />
    <ellipse id="hell-sulfur-glow" cx="400" cy="285" rx="36" ry="16" fill="url(#dagger-crimson-glow)" opacity="0.4" pointer-events="none" />
    <text x="400" y="288" text-anchor="middle" fill="#fca5a5" font-size="8" font-weight="700">HELL TRAPDOOR</text>

    <!-- Actor Macbeth on Stage -->
    <g id="actor-macbeth" transform="translate(400, 310)">
      <circle cx="0" cy="-14" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
      <path d="M-8,-6 L8,-6 L10,12 L-10,12 Z" fill="#b91c1c" />
      <text x="0" y="24" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="800">MACBETH</text>
    </g>

    <!-- Floating Hallucinated Dagger (Act II) -->
    <g id="dagger-vision" transform="translate(400, 220)" filter="url(#theatre-shadow)">
      <circle id="dagger-pulse" cx="0" cy="0" r="22" fill="url(#dagger-crimson-glow)" opacity="0.8" />
      <!-- Dagger Blade & Hilt -->
      <path d="M0,-20 L5,-2 L0,3 L-5,-2 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" />
      <line x1="-8" y1="3" x2="8" y2="3" stroke="#d97706" stroke-width="2.5" />
      <line x1="0" y1="3" x2="0" y2="12" stroke="#78350f" stroke-width="2.5" />
      <circle cx="0" cy="13" r="2.5" fill="#d97706" />
      <!-- Blood Drop -->
      <circle cx="0" cy="-8" r="2.5" fill="#dc2626" />
    </g>
  </g>

  <!-- Act Progress Banner -->
  <g transform="translate(400, 48)">
    <rect x="-240" y="-16" width="480" height="32" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(220, 38, 38, 0.5)" stroke-width="1.5" />
    <text id="macbeth-act-status" x="0" y="5" text-anchor="middle" fill="#fca5a5" font-size="12.5" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="0.5">
      ACT I: The Blasted Heath Prophecy
    </text>
  </g>

  <!-- Interactive Control Prompt -->
  <g transform="translate(400, 445)">
    <rect x="-260" y="-14" width="520" height="28" rx="7" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">
      ⚔️ Drag floating dagger &bull; Slider controls iambic heartbeat rhythm on the 1599 Globe stage
    </text>
  </g>
</svg>
