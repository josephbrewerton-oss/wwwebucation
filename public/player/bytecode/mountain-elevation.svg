<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Sky &amp; Atmospheric Gradients -->
    <linearGradient id="mtn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="mtn-rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="mtn-snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="mtn-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Sky Backdrop -->
  <rect x="0" y="0" width="800" height="380" fill="url(#mtn-sky)" />

  <!-- Distant Mountain Ranges -->
  <polygon points="580,180 440,380 720,380" fill="#94a3b8" opacity="0.6" />
  <polygon points="660,150 540,380 780,380" fill="#64748b" opacity="0.5" />

  <!-- Main Alpine Mountain Pyramid -->
  <polygon points="400,140 180,380 680,380" fill="url(#mtn-rock)" stroke="#1e293b" stroke-width="2" />
  <!-- Snow Cap -->
  <polygon points="400,140 365,195 400,205 435,195" fill="url(#mtn-snow)" />

  <!-- Ground Sea Level Baseline -->
  <rect x="0" y="380" width="800" height="100" fill="url(#mtn-ground)" />
  <line x1="0" y1="380" x2="800" y2="380" stroke="#0f172a" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />
  <text x="30" y="410" fill="#ffffff" font-size="13" font-weight="700">Sea Level (0m Altitude)</text>

  <!-- Trigonometry Right-Angle Triangle Construction -->
  <line id="base-line" x1="180" y1="380" x2="180" y2="380" stroke="#0284c7" stroke-width="3" stroke-dasharray="4,4" />
  <line id="vertical-line" x1="180" y1="380" x2="180" y2="380" stroke="#10b981" stroke-width="3.5" />

  <!-- Slope Guide (Hypotenuse) -->
  <line x1="180" y1="380" x2="400" y2="140" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" opacity="0.8" />

  <!-- Active Climber Beacon -->
  <circle id="climber-pulse" cx="180" cy="380" r="14" fill="#ef4444" opacity="0.25" />
  <circle id="climber-marker" cx="180" cy="380" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

  <!-- HUD Telemetry Labels -->
  <g id="telemetry-hud" transform="translate(20, 25)">
    <rect width="250" height="95" rx="8" fill="#0f172a" opacity="0.88" stroke="#334155" stroke-width="1.5" />
    <text id="altitude-text" x="15" y="28" fill="#34d399" font-size="15" font-weight="800" font-family="sans-serif">Altitude: 0 m</text>
    <text id="hypotenuse-text" x="15" y="52" fill="#fbbf24" font-size="13" font-weight="600" font-family="sans-serif">Slope Distance: 0 m</text>
    <text id="temp-text" x="15" y="74" fill="#38bdf8" font-size="13" font-weight="600" font-family="sans-serif">Temp: 20.0 °C</text>
  </g>

  <!-- Elevation Milestones -->
  <text x="390" y="130" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">Summit (3,000m)</text>
  <text x="175" y="398" fill="#1e293b" font-size="12" font-weight="700">Base Camp (0m)</text>
</svg>
