<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Scriptorium Amber Chapel Ambience -->
    <radialGradient id="chapel-sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="45%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>

    <!-- Candle Flame Radial Glow -->
    <radialGradient id="candle-flame-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.95)" />
      <stop offset="40%" stop-color="rgba(245, 158, 11, 0.6)" />
      <stop offset="100%" stop-color="rgba(180, 83, 9, 0)" />
    </radialGradient>

    <!-- Parchment Codex Gradient -->
    <linearGradient id="parchment-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="60%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Gold Foil Initial Gradient -->
    <linearGradient id="gold-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <filter id="flame-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#chapel-sky)" />

  <!-- Scriptorium Stone Arch Frame -->
  <path d="M 50,400 L 50,140 C 50,60 750,60 750,140 L 750,400 Z" fill="none" stroke="#292524" stroke-width="8" opacity="0.4" />

  <!-- LEFT CANDLESTICK -->
  <g id="candle-left" transform="translate(90, 240)">
    <!-- Brass Stand -->
    <path d="M -15,140 L 15,140 L 6,60 L -6,60 Z" fill="#b45309" stroke="#78350f" stroke-width="2" />
    <rect x="-8" y="20" width="16" height="50" fill="#fef3c7" stroke="#e2e8f0" stroke-width="1.5" rx="2" />
    <!-- Candle Flame -->
    <circle id="candle-halo" cx="0" cy="10" r="35" fill="url(#candle-flame-glow)" filter="url(#flame-glow)" />
    <path d="M 0,20 C -6,14 -4,5 0,0 C 4,5 6,14 0,20 Z" fill="#facc15" stroke="#f59e0b" stroke-width="1" />
    <circle cx="0" cy="14" r="2.5" fill="#ffffff" />
  </g>

  <!-- RIGHT CANDLESTICK -->
  <g id="candle-right" transform="translate(710, 240)">
    <!-- Brass Stand -->
    <path d="M -15,140 L 15,140 L 6,60 L -6,60 Z" fill="#b45309" stroke="#78350f" stroke-width="2" />
    <rect x="-8" y="20" width="16" height="50" fill="#fef3c7" stroke="#e2e8f0" stroke-width="1.5" rx="2" />
    <!-- Candle Flame -->
    <circle cx="0" cy="10" r="35" fill="url(#candle-flame-glow)" filter="url(#flame-glow)" />
    <path d="M 0,20 C -6,14 -4,5 0,0 C 4,5 6,14 0,20 Z" fill="#facc15" stroke="#f59e0b" stroke-width="1" />
    <circle cx="0" cy="14" r="2.5" fill="#ffffff" />
  </g>

  <!-- CENTER: Illuminated Manuscript Scriptorium Codex -->
  <g id="manuscript-codex" transform="translate(140, 70)">
    <!-- Codex Wooden Binding & Shadow -->
    <rect x="-10" y="-10" width="540" height="330" rx="16" fill="#292524" stroke="#1c1917" stroke-width="3" />
    
    <!-- Open Parchment Folio (Left and Right Pages) -->
    <rect x="0" y="0" width="520" height="310" rx="12" fill="url(#parchment-grad)" stroke="#d97706" stroke-width="2" />
    <!-- Folio Gutter Spine Line -->
    <line x1="260" y1="0" x2="260" y2="310" stroke="#b45309" stroke-width="2" opacity="0.6" />

    <!-- LEFT FOLIO: Illuminated Initial & Gregorian Chant Staff -->
    <g transform="translate(15, 15)">
      <!-- Ornate Illuminated Initial 'P' (Pater) -->
      <rect x="5" y="10" width="54" height="60" rx="6" fill="#1e3a8a" stroke="#ca8a04" stroke-width="2" />
      <path d="M 20,20 L 36,20 C 44,20 44,38 36,38 L 20,38 Z M 20,15 L 20,60" fill="none" stroke="url(#gold-leaf-grad)" stroke-width="6" stroke-linecap="round" />
      
      <!-- Red 4-Line Gregorian Chant Staff -->
      <g stroke="#b91c1c" stroke-width="1.5">
        <line x1="68" y1="20" x2="235" y2="20" />
        <line x1="68" y1="32" x2="235" y2="32" />
        <line x1="68" y1="44" x2="235" y2="44" />
        <line x1="68" y1="56" x2="235" y2="56" />
      </g>

      <!-- Medieval Do Clef -->
      <path d="M 72,26 L 78,26 L 78,38 L 72,38 M 75,22 L 75,42" fill="none" stroke="#000000" stroke-width="2.5" />

      <!-- Square Neumes (Punctum, Podatus, Clivis) -->
      <rect x="90" y="38" width="8" height="8" fill="#18181b" />
      <rect x="110" y="26" width="8" height="8" fill="#18181b" />
      <line x1="118" y1="26" x2="118" y2="38" stroke="#18181b" stroke-width="2" />
      <rect x="135" y="32" width="8" height="8" fill="#18181b" />
      <rect x="155" y="44" width="8" height="8" fill="#18181b" />
      <rect x="180" y="26" width="8" height="8" fill="#18181b" />
      <rect x="205" y="38" width="8" height="8" fill="#18181b" />

      <!-- Incipit Chant Lyrics -->
      <text x="70" y="74" fill="#1c1917" font-size="11" font-weight="bold" font-family="serif">
        Pa - ter   nos - ter,   qui   es   in
      </text>

      <!-- Second Staff -->
      <g stroke="#b91c1c" stroke-width="1.5" transform="translate(0, 75)">
        <line x1="10" y1="20" x2="235" y2="20" />
        <line x1="10" y1="32" x2="235" y2="32" />
        <line x1="10" y1="44" x2="235" y2="44" />
        <line x1="10" y1="56" x2="235" y2="56" />

        <!-- Neumes -->
        <rect x="30" y="32" width="8" height="8" fill="#18181b" />
        <rect x="55" y="26" width="8" height="8" fill="#18181b" />
        <rect x="85" y="38" width="8" height="8" fill="#18181b" />
        <rect x="115" y="44" width="8" height="8" fill="#18181b" />
        <rect x="145" y="32" width="8" height="8" fill="#18181b" />
        <rect x="175" y="26" width="8" height="8" fill="#18181b" />
        <rect x="205" y="38" width="8" height="8" fill="#18181b" />

        <text x="12" y="74" fill="#1c1917" font-size="11" font-weight="bold" font-family="serif">
          cae - lis:   sanc - ti - fi - cé - tur
        </text>
      </g>

      <!-- Latin Verse Lines -->
      <g transform="translate(10, 185)" fill="#451a03" font-size="10.5" font-family="serif">
        <text x="0" y="0">nómen tuum. Advéniat régnum tuum.</text>
        <text x="0" y="18">Fiat volúntas tua, sicut in caelo et in terra.</text>
        <text x="0" y="36">Panem nostrum cotidiánum da nobis hódie,</text>
        <text x="0" y="54">et dimítte nobis débita nostra...</text>
        <text x="0" y="74" fill="#991b1b" font-weight="bold">Amen.</text>
      </g>
    </g>

    <!-- RIGHT FOLIO: English Translation & Catechetical Illumination -->
    <g transform="translate(275, 20)">
      <text x="10" y="25" fill="#78350f" font-size="14" font-weight="bold" font-family="serif">
        THE LORD'S PRAYER (ENGLISH)
      </text>
      <line x1="10" y1="35" x2="230" y2="35" stroke="#ca8a04" stroke-width="1.5" />

      <g transform="translate(10, 55)" fill="#292524" font-size="11" font-family="serif" line-height="1.5">
        <text x="0" y="0" font-weight="bold">Our Father, who art in heaven,</text>
        <text x="0" y="20">hallowed be thy name;</text>
        <text x="0" y="40">thy kingdom come;</text>
        <text x="0" y="60">thy will be done on earth</text>
        <text x="0" y="80">as it is in heaven.</text>
        <text x="0" y="105">Give us this day our daily bread;</text>
        <text x="0" y="125">and forgive us our trespasses</text>
        <text x="0" y="145">as we forgive those who trespass against us;</text>
        <text x="0" y="165">and lead us not into temptation,</text>
        <text x="0" y="185">but deliver us from evil.</text>
        <text x="0" y="210" fill="#991b1b" font-weight="bold">Amen.</text>
      </g>
    </g>

    <!-- Interactive Neume Scan Highlight Marker -->
    <g id="chant-tracker" transform="translate(0, 0)">
      <polygon points="105,10 115,10 110,20" fill="#dc2626" />
    </g>
  </g>

  <!-- Interactive Prayer Selector at Bottom -->
  <g id="prayer-selector-container" transform="translate(0, 420)">
    <!-- Selector Track -->
    <rect x="130" y="5" width="540" height="24" rx="12" fill="#1c1917" stroke="#44403c" stroke-width="2" />
    
    <!-- Prayer Ticks & Labels -->
    <text x="160" y="21" fill="#fde68a" font-size="11" font-weight="bold" font-family="sans-serif">1. Pater Noster</text>
    <text x="310" y="21" fill="#fde68a" font-size="11" font-weight="bold" font-family="sans-serif">2. Ave Maria</text>
    <text x="460" y="21" fill="#fde68a" font-size="11" font-weight="bold" font-family="sans-serif">3. Sanctus</text>
    <text x="585" y="21" fill="#fde68a" font-size="11" font-weight="bold" font-family="sans-serif">4. Agnus Dei</text>

    <!-- Draggable Knob -->
    <g id="prayer-scroll-slider" cursor="ew-resize" transform="translate(160, 17)">
      <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="2" filter="url(#flame-glow)" />
      <circle cx="0" cy="0" r="6" fill="#451a03" />
    </g>
  </g>
</svg>
