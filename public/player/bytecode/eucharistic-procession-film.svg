<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Translucent Sanctuary Overlay Vignette (allows video to show through clearly) -->
    <radialGradient id="film-overlay-vignette" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.08" />
      <stop offset="65%" stop-color="#020617" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.82" />
    </radialGradient>

    <!-- Divine Golden Halo Glow Filter -->
    <filter id="film-golden-radiance" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Translucent Incense Smoke Gradient -->
    <linearGradient id="film-incense-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#e2e8f0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Tint (Translucent to allow native video decoding beneath) -->
  <rect width="800" height="480" fill="url(#film-overlay-vignette)" />

  <!-- Architectural Gothic Arch Frame Vector HUD -->
  <g id="film-hud-group" opacity="0.95">
    <!-- Top Sanctuary Border Header -->
    <path d="M 40 40 L 760 40 M 40 44 L 760 44" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="8 4" />
    
    <!-- Film Mode Architectural Corner Badges -->
    <g transform="translate(48, 48)">
      <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#fbbf24" stroke-width="2" />
      <text x="28" y="14" fill="#fbbf24" font-size="10" font-weight="800" letter-spacing="1.5">FILM ARCHETYPE • SYNCHRONIZED VECTOR HUD</text>
    </g>

    <g transform="translate(752, 48)">
      <path d="M 0 20 L 0 0 L -20 0" fill="none" stroke="#fbbf24" stroke-width="2" />
      <text x="-28" y="14" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">PROPER FILM + VECTOR OVERLAY</text>
    </g>

    <!-- Center Cross Finial -->
    <g transform="translate(400, 36)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
      <path d="M 0 -8 L 0 8 M -6 -2 L 6 -2" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Translucent Procession Canopy (Ombrellino) Silhouette Outline -->
    <path d="M 280 140 Q 400 90 520 140 L 530 160 Q 400 130 270 160 Z" fill="#b45309" fill-opacity="0.22" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="280" y1="160" x2="280" y2="420" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <line x1="520" y1="160" x2="520" y2="420" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4" />

    <!-- Central Monstrance Vector Focal Point & Divine Halo -->
    <g id="film-monstrance-group" transform="translate(400, 240)">
      <!-- Pulsing Divine Radiance Ring (driven by AST expression) -->
      <circle id="film-monstrance-halo" cx="0" cy="0" r="55" fill="#fef08a" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2" filter="url(#film-golden-radiance)" />
      
      <!-- Monstrance Sunburst Radiance Rays -->
      <g stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.75" stroke-linecap="round">
        <line x1="0" y1="-32" x2="0" y2="-48" />
        <line x1="0" y1="32" x2="0" y2="48" />
        <line x1="-32" y1="0" x2="-48" y2="0" />
        <line x1="32" y1="0" x2="48" y2="0" />
        <line x1="-22" y1="-22" x2="-35" y2="-35" />
        <line x1="22" y1="-22" x2="35" y2="-35" />
        <line x1="-22" y1="22" x2="-35" y2="35" />
        <line x1="22" y1="22" x2="35" y2="35" />
      </g>

      <!-- Sacred Host (Luna) -->
      <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#fef08a" stroke-width="2" />
      <!-- Eucharistic IHS Monogram -->
      <text x="0" y="4" fill="#b45309" font-size="10" font-weight="900" text-anchor="middle" font-family="serif">IHS</text>
    </g>

    <!-- Reactive Incense Smoke Vector Streams (driven by AST expression) -->
    <g id="film-incense-stream-1" transform="translate(320, 360)">
      <path d="M 0 0 Q 30 -60 10 -130 T 40 -220" fill="none" stroke="url(#film-incense-grad)" stroke-width="18" stroke-linecap="round" />
    </g>
    <g id="film-incense-stream-2" transform="translate(480, 360)">
      <path d="M 0 0 Q -30 -60 -10 -130 T -40 -220" fill="none" stroke="url(#film-incense-grad)" stroke-width="22" stroke-linecap="round" />
    </g>

    <!-- Smartboard & Stylus Direct Touch Target -->
    <g id="film-interactive-probe" transform="translate(640, 240)" cursor="grab">
      <circle cx="0" cy="0" r="28" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      <text x="0" y="44" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">STYLUS PROBE</text>
    </g>

    <!-- Bottom Timeline Track Overlay -->
    <g transform="translate(0, 440)">
      <rect x="120" y="0" width="560" height="4" rx="2" fill="#334155" fill-opacity="0.6" />
      <!-- Synchronized Progress Indicator -->
      <circle id="film-progress-cursor" cx="120" cy="2" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>
</svg>
