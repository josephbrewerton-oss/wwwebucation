<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sacred-blue-ambience" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(30, 58, 138, 0.35)" />
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.15)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="brass-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <radialGradient id="smoke-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(241, 245, 249, 0.85)" />
      <stop offset="40%" stop-color="rgba(226, 232, 240, 0.45)" />
      <stop offset="75%" stop-color="rgba(148, 163, 184, 0.15)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="charcoal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cathedral Interior Sanctuary Background -->
  <rect x="0" y="0" width="800" height="480" fill="#0b101b" />
  <circle cx="400" cy="200" r="350" fill="url(#sacred-blue-ambience)" />

  <!-- Stone Cathedral Archways in background -->
  <path d="M 120 480 L 120 180 Q 240 70 360 180 L 360 480" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 440 480 L 440 180 Q 560 70 680 180 L 680 480" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- LEFT: Holy Water Font (Stoup) & Aspergillum Sprinkler -->
  <g id="holy-water-section" transform="translate(130, 230)">
    <!-- Stone Wall Pillar Base -->
    <rect x="-60" y="-30" width="120" height="210" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <polygon points="-60 -30 60 -30 45 -45 -45 -45" fill="#0f172a" stroke="#334155" />

    <!-- Marble Shell Stoup Basin -->
    <path d="M -45 50 Q 0 110 45 50 Q 20 40 0 42 Q -20 40 -45 50 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <!-- Blessed Water Surface with reflections -->
    <ellipse cx="0" cy="52" rx="35" ry="10" fill="#38bdf8" opacity="0.8" />
    <ellipse cx="-10" cy="50" rx="14" ry="4" fill="#bae6fd" opacity="0.6" />

    <!-- Aspergillum (Sprinkler Wand) with perforated sphere -->
    <g transform="translate(25, -20) rotate(25)">
      <rect x="-3" y="0" width="6" height="70" rx="2" fill="url(#brass-gold)" stroke="#854d0e" stroke-width="1" />
      <circle cx="0" cy="-6" r="14" fill="url(#brass-gold)" stroke="#854d0e" stroke-width="1.5" />
      <circle cx="-5" cy="-8" r="1.5" fill="#451a03" />
      <circle cx="0" cy="-12" r="1.5" fill="#451a03" />
      <circle cx="5" cy="-8" r="1.5" fill="#451a03" />
      <circle cx="0" cy="-4" r="1.5" fill="#451a03" />
      <circle cx="-4" cy="-2" r="1.5" fill="#451a03" />
      <circle cx="4" cy="-2" r="1.5" fill="#451a03" />
    </g>

    <!-- Asperges Water Droplet Burst (bound to AST reactive var) -->
    <g id="water-droplet-burst" opacity="0.9" transform="translate(45, -30)">
      <circle cx="10" cy="-15" r="3" fill="#38bdf8" />
      <circle cx="28" cy="-28" r="2.5" fill="#7dd3fc" />
      <circle cx="40" cy="-12" r="2" fill="#bae6fd" />
      <circle cx="22" cy="-4" r="2" fill="#38bdf8" />
      <circle cx="45" cy="-30" r="1.5" fill="#e0f2fe" />
    </g>

    <!-- Labelling -->
    <text x="0" y="140" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">AQUA BENEDICTA</text>
    <text x="0" y="154" fill="#38bdf8" font-size="8" font-weight="semibold" text-anchor="middle">Asperges Me &bull; Stoup</text>
  </g>

  <!-- RIGHT: Incense Boat (Navicula) & Spoon (Cochlear) -->
  <g id="boat-section" transform="translate(670, 260)">
    <!-- Credence Table Base -->
    <rect x="-55" y="40" width="110" height="120" rx="3" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="-60" y="32" width="120" height="12" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />

    <!-- Golden Boat (Navicula) -->
    <path d="M -35 25 Q -42 0 -15 8 L 0 10 L 15 8 Q 42 0 35 25 Z" fill="url(#brass-gold)" stroke="#854d0e" stroke-width="1.5" />
    <path d="M -15 8 Q 0 -6 15 8 Z" fill="#ca8a04" stroke="#713f12" />
    <!-- Pedestal Base -->
    <polygon points="-12 32 12 32 6 25 -6 25" fill="url(#brass-gold)" stroke="#854d0e" stroke-width="1" />
    <rect x="-16" y="32" width="32" height="4" rx="1" fill="#a16207" />

    <!-- Grains of Frankincense & Myrrh inside Boat -->
    <circle cx="-8" cy="14" r="2.5" fill="#fef08a" />
    <circle cx="0" cy="13" r="3" fill="#fde047" />
    <circle cx="8" cy="14" r="2.5" fill="#fef08a" />
    <circle cx="-3" cy="16" r="2" fill="#ca8a04" />
    <circle cx="5" cy="17" r="2" fill="#f59e0b" />

    <!-- Incense Spoon (Cochlear) -->
    <path d="M -12 2 L 18 -18" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="21" cy="-21" rx="4" ry="2.5" fill="url(#brass-gold)" stroke="#854d0e" transform="rotate(-35 21 -21)" />

    <!-- Labelling -->
    <text x="0" y="80" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">NAVICULA (BOAT)</text>
    <text x="0" y="94" fill="#fbbf24" font-size="8" font-weight="semibold" text-anchor="middle">Pure Frankincense &amp; Spoon</text>
  </g>

  <!-- CENTER: The Great Swinging Thurible (Thuribulum) -->
  <g id="thurible-swing-group">
    <!-- Stationary Hand Ring Ring / Suspension Mount -->
    <g id="thurible-censer-handle" transform="translate(400, 60)" style="cursor: grab;">
      <circle cx="0" cy="0" r="14" fill="none" stroke="url(#brass-gold)" stroke-width="3" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#ca8a04" stroke-width="1.5" />
      <rect x="-8" y="14" width="16" height="8" rx="2" fill="url(#brass-gold)" stroke="#854d0e" />
    </g>

    <!-- Triple Golden Hanging Chains -->
    <line x1="394" y1="80" x2="385" y2="280" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="400" y1="80" x2="400" y2="280" stroke="#fde047" stroke-width="2.5" stroke-dasharray="3 3" />
    <line x1="406" y1="80" x2="415" y2="280" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Central Center Chain for Lid Lift -->
    <line x1="400" y1="80" x2="400" y2="245" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- The Censer Basin & Reticulated Cover (Vessel Body) -->
    <g transform="translate(400, 280)">
      <!-- Rising Clouds of Sweet Incense Smoke (bound to AST) -->
      <g id="incense-smoke-cloud" filter="url(#soft-glow)" opacity="0.6">
        <circle cx="0" cy="-60" r="28" fill="url(#smoke-radial)" />
        <circle cx="-18" cy="-90" r="34" fill="url(#smoke-radial)" />
        <circle cx="15" cy="-115" r="42" fill="url(#smoke-radial)" />
        <circle cx="-10" cy="-150" r="50" fill="url(#smoke-radial)" />
        <circle cx="12" cy="-190" r="60" fill="url(#smoke-radial)" />
      </g>

      <!-- Charcoal Glowing Briquette inside -->
      <ellipse cx="0" cy="8" rx="18" ry="7" fill="url(#charcoal-glow)" />
      <circle cx="-4" cy="7" r="2" fill="#fef08a" opacity="0.9" />
      <circle cx="5" cy="8" r="1.5" fill="#fef08a" opacity="0.9" />

      <!-- Ornate Reticulated Dome Lid (Smoke Openings) -->
      <path d="M -26 0 Q 0 -45 26 0 Z" fill="url(#brass-gold)" stroke="#854d0e" stroke-width="1.5" />
      <!-- Gothic Trefoil Smoke Vents -->
      <circle cx="-10" cy="-14" r="3" fill="#0b101b" />
      <circle cx="10" cy="-14" r="3" fill="#0b101b" />
      <circle cx="0" cy="-26" r="3.5" fill="#0b101b" />
      <circle cx="0" cy="-15" r="2.5" fill="#0b101b" />

      <!-- Cross Finial on top of lid -->
      <rect x="-1.5" y="-55" width="3" height="12" fill="url(#brass-gold)" />
      <rect x="-5" y="-51" width="10" height="2.5" fill="url(#brass-gold)" />

      <!-- Lower Crucible Bowl -->
      <path d="M -28 0 Q -28 35 0 35 Q 28 35 28 0 Z" fill="url(#brass-gold)" stroke="#854d0e" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="28" ry="6" fill="#a16207" stroke="#713f12" />

      <!-- Pedestal Foot -->
      <polygon points="-14 42 14 42 8 34 -8 34" fill="url(#brass-gold)" stroke="#854d0e" stroke-width="1.5" />
      <ellipse cx="0" cy="42" rx="16" ry="4" fill="#a16207" />

      <!-- Bottom Bell / Acorn Weight -->
      <circle cx="0" cy="48" r="3" fill="url(#brass-gold)" />
    </g>
  </g>

  <!-- Bottom Liturgical Inscription Banner -->
  <rect x="140" y="440" width="520" height="30" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" stroke-width="1" />
  <text x="400" y="459" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">
    THURIBULUM &bull; "LET MY PRAYER RISE BEFORE THEE LIKE INCENSE" (PS 141:2)
  </text>
</svg>
