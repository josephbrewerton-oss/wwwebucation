(:scene :id "domino-multiplication-video" :type "Video" :oak-id "OAK-KS2-MAT-DOM-VID" :oak-unit "ks2-multiplication-arrays" :title "🎬 Video Explainer: Multiplication as Equal Groups (4 × 6 = 24)" :stage "KS2 MATHS" :duration 12.0
  (:subtitles (
    (:start 0.00 :end 3.00 :en "Look at the track: we have 4 equal groups, and each group holds 6 dominoes." :es "Mira la pista: tenemos 4 grupos iguales y cada grupo tiene 6 fichas de dominó.")
    (:start 3.00 :end 6.00 :en "When the lever drops, Group 1 falls first—giving us 6 tiles." :es "Al bajar la palanca, cae primero el Grupo 1: tenemos 6 fichas.")
    (:start 6.00 :end 9.00 :en "Group 2 makes 12, and Group 3 brings our running total to 18." :es "El Grupo 2 suma 12, y el Grupo 3 lleva el total a 18.")
    (:start 9.00 :end 12.00 :en "Group 4 rings the bell! 4 groups of 6 equals 24: 6 + 6 + 6 + 6 = 24." :es "¡El Grupo 4 toca la campana! 4 grupos de 6 son 24: 6 + 6 + 6 + 6 = 24.")
  ))
  (:keyframes (
    (:t 0.00 :title "1. Equal Groups Setup" :rule "4 groups × 6 tiles = 24")
    (:t 0.25 :title "2. First Group (6)" :rule "1 × 6 = 6")
    (:t 0.50 :title "3. Second Group (12)" :rule "2 × 6 = 12 (6 + 6)")
    (:t 0.72 :title "4. Third Group (18)" :rule "3 × 6 = 18 (6 + 6 + 6)")
    (:t 0.90 :title "5. Fourth Group (24)" :rule "4 × 6 = 24 (6 + 6 + 6 + 6)")
  ))
  (:bindings (
    ;; Lever tilt on release
    (:target "#release-trigger-lever" :attr "transform" :expr "'rotate(' + (t > 0.08 ? Math.min(38, (t - 0.08) * 600) : 0).toFixed(1) + ', 110, 370)'")

    ;; Highlight each cluster sequentially as the wave reaches it
    (:target "#cluster-1" :attr "opacity" :expr "t < 0.08 ? '0.85' : '1'")
    (:target "#cluster-2" :attr "opacity" :expr "t < 0.32 ? '0.55' : '1'")
    (:target "#cluster-3" :attr "opacity" :expr "t < 0.54 ? '0.55' : '1'")
    (:target "#cluster-4" :attr "opacity" :expr "t < 0.76 ? '0.55' : '1'")

    ;; Cluster 1 sequential cascade (tiles 1..6)
    (:target "#domino-1-1" :attr "transform" :expr "'rotate(' + (t > 0.12 ? Math.min(64, (t - 0.12) * 520) : 0).toFixed(1) + ', 6, 70)'")
    (:target "#domino-1-2" :attr "transform" :expr "'rotate(' + (t > 0.15 ? Math.min(64, (t - 0.15) * 520) : 0).toFixed(1) + ', 24, 70)'")
    (:target "#domino-1-3" :attr "transform" :expr "'rotate(' + (t > 0.18 ? Math.min(64, (t - 0.18) * 520) : 0).toFixed(1) + ', 42, 70)'")
    (:target "#domino-1-4" :attr "transform" :expr "'rotate(' + (t > 0.21 ? Math.min(64, (t - 0.21) * 520) : 0).toFixed(1) + ', 60, 70)'")
    (:target "#domino-1-5" :attr "transform" :expr "'rotate(' + (t > 0.24 ? Math.min(64, (t - 0.24) * 520) : 0).toFixed(1) + ', 78, 70)'")
    (:target "#domino-1-6" :attr "transform" :expr "'rotate(' + (t > 0.27 ? Math.min(64, (t - 0.27) * 520) : 0).toFixed(1) + ', 96, 70)'")

    ;; Cluster 2 sequential cascade (tiles 1..6)
    (:target "#domino-2-1" :attr "transform" :expr "'rotate(' + (t > 0.34 ? Math.min(64, (t - 0.34) * 520) : 0).toFixed(1) + ', 6, 70)'")
    (:target "#domino-2-2" :attr "transform" :expr "'rotate(' + (t > 0.37 ? Math.min(64, (t - 0.37) * 520) : 0).toFixed(1) + ', 22, 70)'")
    (:target "#domino-2-3" :attr "transform" :expr "'rotate(' + (t > 0.40 ? Math.min(64, (t - 0.40) * 520) : 0).toFixed(1) + ', 38, 70)'")
    (:target "#domino-2-4" :attr "transform" :expr "'rotate(' + (t > 0.43 ? Math.min(64, (t - 0.43) * 520) : 0).toFixed(1) + ', 54, 70)'")
    (:target "#domino-2-5" :attr "transform" :expr "'rotate(' + (t > 0.46 ? Math.min(64, (t - 0.46) * 520) : 0).toFixed(1) + ', 70, 70)'")
    (:target "#domino-2-6" :attr "transform" :expr "'rotate(' + (t > 0.49 ? Math.min(64, (t - 0.49) * 520) : 0).toFixed(1) + ', 86, 70)'")

    ;; Cluster 3 sequential cascade (tiles 1..6)
    (:target "#domino-3-1" :attr "transform" :expr "'rotate(' + (t > 0.56 ? Math.min(64, (t - 0.56) * 520) : 0).toFixed(1) + ', 6, 70)'")
    (:target "#domino-3-2" :attr "transform" :expr "'rotate(' + (t > 0.59 ? Math.min(64, (t - 0.59) * 520) : 0).toFixed(1) + ', 20, 70)'")
    (:target "#domino-3-3" :attr "transform" :expr "'rotate(' + (t > 0.62 ? Math.min(64, (t - 0.62) * 520) : 0).toFixed(1) + ', 34, 70)'")
    (:target "#domino-3-4" :attr "transform" :expr "'rotate(' + (t > 0.65 ? Math.min(64, (t - 0.65) * 520) : 0).toFixed(1) + ', 48, 70)'")
    (:target "#domino-3-5" :attr "transform" :expr "'rotate(' + (t > 0.68 ? Math.min(64, (t - 0.68) * 520) : 0).toFixed(1) + ', 62, 70)'")
    (:target "#domino-3-6" :attr "transform" :expr "'rotate(' + (t > 0.71 ? Math.min(64, (t - 0.71) * 520) : 0).toFixed(1) + ', 76, 70)'")

    ;; Cluster 4 sequential cascade (tiles 1..6)
    (:target "#domino-4-1" :attr "transform" :expr "'rotate(' + (t > 0.78 ? Math.min(64, (t - 0.78) * 520) : 0).toFixed(1) + ', 6, 70)'")
    (:target "#domino-4-2" :attr "transform" :expr "'rotate(' + (t > 0.81 ? Math.min(64, (t - 0.81) * 520) : 0).toFixed(1) + ', 18, 70)'")
    (:target "#domino-4-3" :attr "transform" :expr "'rotate(' + (t > 0.84 ? Math.min(64, (t - 0.84) * 520) : 0).toFixed(1) + ', 30, 70)'")
    (:target "#domino-4-4" :attr "transform" :expr "'rotate(' + (t > 0.87 ? Math.min(64, (t - 0.87) * 520) : 0).toFixed(1) + ', 42, 70)'")
    (:target "#domino-4-5" :attr "transform" :expr "'rotate(' + (t > 0.90 ? Math.min(64, (t - 0.90) * 520) : 0).toFixed(1) + ', 54, 70)'")
    (:target "#domino-4-6" :attr "transform" :expr "'rotate(' + (t > 0.93 ? Math.min(64, (t - 0.93) * 520) : 0).toFixed(1) + ', 66, 70)'")

    ;; Bell vibration at finale
    (:target "#finish-bell" :attr "transform" :expr "t > 0.94 ? 'translate(640, 160) rotate(' + (Math.sin(t * 90) * 10).toFixed(1) + ', 20, 10)' : 'translate(640, 160)'")

    ;; Live Chapter-Synced HUD Readout
    (:target "#math-display" :attr "textContent" :expr "t < 0.30 ? '1 × 6 = 6' : (t < 0.52 ? '2 × 6 = 12' : (t < 0.75 ? '3 × 6 = 18' : '4 × 6 = 24'))")
    (:target "#cadence-status" :attr "textContent" :expr "t < 0.30 ? 'Group 1: 6' : (t < 0.52 ? 'Repeated Addition: 6 + 6 = 12' : (t < 0.75 ? 'Repeated Addition: 6 + 6 + 6 = 18' : 'Full Product: 6 + 6 + 6 + 6 = 24'))")
  ))
)