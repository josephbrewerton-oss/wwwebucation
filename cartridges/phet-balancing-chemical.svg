<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <defs>
    <radialGradient id="pc-bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#172540"/>
      <stop offset="60%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="pc-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- 3D CPK Specular Atom Spheres (Focal Radial Gradients) -->
    <radialGradient id="pc-atom-h" cx="46%" cy="44%" r="58%" fx="32%" fy="26%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#bae6fd"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="pc-atom-o" cx="46%" cy="44%" r="58%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <linearGradient id="pc-bond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Instanced CPK 3D Molecule Symbols (<use> Reuse) -->
    <g id="pc-mol-h2">
      <rect x="-9" y="-2.5" width="18" height="5" rx="2" fill="url(#pc-bond)"/>
      <circle cx="-11" cy="0" r="9.5" fill="url(#pc-atom-h)" stroke="#0284c7" stroke-width="1"/>
      <circle cx="11" cy="0" r="9.5" fill="url(#pc-atom-h)" stroke="#0284c7" stroke-width="1"/>
      <text x="-11" y="3.2" fill="#082f49" font-size="8.5" font-weight="900" text-anchor="middle">H</text>
      <text x="11" y="3.2" fill="#082f49" font-size="8.5" font-weight="900" text-anchor="middle">H</text>
    </g>
    <g id="pc-mol-o2">
      <rect x="-12" y="-5" width="24" height="3.2" rx="1.5" fill="url(#pc-bond)"/>
      <rect x="-12" y="1.8" width="24" height="3.2" rx="1.5" fill="url(#pc-bond)"/>
      <circle cx="-13" cy="0" r="12" fill="url(#pc-atom-o)" stroke="#7f1d1d" stroke-width="1.1"/>
      <circle cx="13" cy="0" r="12" fill="url(#pc-atom-o)" stroke="#7f1d1d" stroke-width="1.1"/>
      <text x="-13" y="3.8" fill="#ffffff" font-size="9.5" font-weight="900" text-anchor="middle">O</text>
      <text x="13" y="3.8" fill="#ffffff" font-size="9.5" font-weight="900" text-anchor="middle">O</text>
    </g>
    <g id="pc-mol-h2o">
      <!-- Bent 104.5° geometry -->
      <line x1="0" y1="-2" x2="-14" y2="10" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="-2" x2="14" y2="10" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-3" r="12.5" fill="url(#pc-atom-o)" stroke="#7f1d1d" stroke-width="1.1"/>
      <circle cx="-15" cy="10" r="8.8" fill="url(#pc-atom-h)" stroke="#0284c7" stroke-width="1"/>
      <circle cx="15" cy="10" r="8.8" fill="url(#pc-atom-h)" stroke="#0284c7" stroke-width="1"/>
      <text x="0" y="0.8" fill="#ffffff" font-size="9.5" font-weight="900" text-anchor="middle">O</text>
      <text x="-15" y="13" fill="#082f49" font-size="8" font-weight="900" text-anchor="middle">H</text>
      <text x="15" y="13" fill="#082f49" font-size="8" font-weight="900" text-anchor="middle">H</text>
    </g>
  </defs>

  <!-- Chemistry Bench Backdrop -->
  <rect width="800" height="480" fill="url(#pc-bg)" aria-hidden="true"/>
  <rect x="0" y="346" width="800" height="134" fill="#070c18" aria-hidden="true"/>
  <line x1="0" y1="346" x2="800" y2="346" stroke="#1e293b" stroke-width="2" aria-hidden="true"/>

  <!-- Header -->
  <text x="400" y="38" fill="#f8fafc" font-size="20.5" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
    PhET Distilled: Balancing Chemical Equations
  </text>
  <text x="400" y="61" fill="#94a3b8" font-size="12.5" text-anchor="middle" font-family="system-ui, sans-serif">
    Click Cards or Use Sliders/Arrow Keys to Balance Stoichiometric Coefficients
  </text>

  <!-- Subtle Conservation Balance Fulcrum Underneath -->
  <g aria-hidden="true" opacity="0.5">
    <line x1="205" y1="336" x2="595" y2="336" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <polygon points="400,336 384,358 416,358" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
    <circle cx="400" cy="336" r="4" fill="#38bdf8"/>
  </g>

  <!-- Left Pan (Reactants) -->
  <g id="reactants-card" transform="translate(66, 96)" style="cursor: pointer;"
     role="button" tabindex="0" aria-label="Step H2 reactant coefficient"
     data-pedagogical="chem-reactants"
     data-pedagogical-title="Reactant Molecules (Left Side)"
     data-pedagogical-eq="Coefficients multiply whole molecules (e.g. 2 H₂ = 4 H atoms)"
     data-pedagogical-desc="Chemical reactions break covalent bonds in diatomic H₂ and O₂ reactants to rearrange existing atoms without creating or destroying mass.">
    <rect x="4" y="6" width="276" height="226" rx="14" fill="#020617" opacity="0.6" aria-hidden="true"/>
    <rect width="276" height="226" rx="14" fill="url(#pc-card)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="12" y="3" width="252" height="2.5" rx="1.2" fill="#93c5fd" opacity="0.35" aria-hidden="true"/>
    <text x="138" y="28" fill="#93c5fd" font-size="12.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">REACTANTS (CLICK TO STEP H₂)</text>
    <!-- Glass Molecule Tray -->
    <rect x="16" y="40" width="244" height="68" rx="10" fill="#090f1d" stroke="#1e3a8a" stroke-width="1.2" aria-hidden="true"/>
    <g aria-hidden="true">
      <use href="#pc-mol-h2" x="62" y="62"/>
      <use href="#pc-mol-h2" x="62" y="90"/>
      <text x="126" y="80" fill="#64748b" font-size="18" font-weight="900" text-anchor="middle">+</text>
      <use href="#pc-mol-o2" x="196" y="74"/>
    </g>
    <text id="reactant-eq-txt" x="138" y="142" fill="#f8fafc" font-size="25" font-weight="900" text-anchor="middle" font-family="monospace">2 H₂ + 1 O₂</text>
    <text id="reactant-atoms-txt" x="138" y="176" fill="#60a5fa" font-size="13.5" font-weight="800" text-anchor="middle">4 Hydrogen • 2 Oxygen</text>
    <text x="138" y="206" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">↑/↓ Adjust H₂  •  Sliders Step O₂</text>
  </g>

  <!-- Equal / Yield Arrow -->
  <g transform="translate(366, 188)">
    <path d="M 2 14 L 44 14 L 44 4 L 70 19 L 44 34 L 44 24 L 2 24 Z" fill="#020617" opacity="0.55" aria-hidden="true"/>
    <path id="balance-arrow" d="M 0 10 L 42 10 L 42 0 L 68 15 L 42 30 L 42 20 L 0 20 Z" fill="#22c55e" stroke="#dcfce7" stroke-width="1"/>
    <text id="balance-status-txt" x="34" y="54" fill="#4ade80" font-size="11.5" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">BALANCED ✓</text>
  </g>

  <!-- Right Pan (Products) -->
  <g id="products-card" transform="translate(458, 96)" style="cursor: pointer;"
     role="button" tabindex="0" aria-label="Step H2O product coefficient"
     data-pedagogical="chem-products"
     data-pedagogical-title="Product Molecules (Right Side)"
     data-pedagogical-eq="Antoine Lavoisier's Law: Σ m_reactants = Σ m_products"
     data-pedagogical-desc="Never change chemical subscripts (H₂O ≠ H₂O₂); only adjust stoichiometric coefficients in front of formulas!">
    <rect x="4" y="6" width="276" height="226" rx="14" fill="#020617" opacity="0.6" aria-hidden="true"/>
    <rect id="products-border" width="276" height="226" rx="14" fill="url(#pc-card)" stroke="#22c55e" stroke-width="2"/>
    <rect x="12" y="3" width="252" height="2.5" rx="1.2" fill="#86efac" opacity="0.35" aria-hidden="true"/>
    <text x="138" y="28" fill="#86efac" font-size="12.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">PRODUCTS (CLICK TO STEP H₂O)</text>
    <!-- Glass Molecule Tray -->
    <rect x="16" y="40" width="244" height="68" rx="10" fill="#090f1d" stroke="#14532d" stroke-width="1.2" aria-hidden="true"/>
    <g aria-hidden="true">
      <use href="#pc-mol-h2o" x="92" y="72"/>
      <use href="#pc-mol-h2o" x="184" y="72"/>
    </g>
    <text id="product-eq-txt" x="138" y="142" fill="#f8fafc" font-size="25" font-weight="900" text-anchor="middle" font-family="monospace">2 H₂O</text>
    <text id="product-atoms-txt" x="138" y="176" fill="#4ade80" font-size="13.5" font-weight="800" text-anchor="middle">4 Hydrogen • 2 Oxygen</text>
    <text x="138" y="206" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">←/→ Adjust H₂O Coefficient</text>
  </g>

  <!-- Lavoisier Conservation Verification Banner -->
  <rect x="134" y="382" width="532" height="50" rx="10" fill="#020617" opacity="0.55" aria-hidden="true"/>
  <rect id="balance-banner-rect" x="130" y="378" width="540" height="50" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.8"/>
  <text id="balance-banner-txt" x="400" y="409" fill="#4ade80" font-size="14.5" font-weight="800" text-anchor="middle" font-family="monospace">
    Conservation Verified: 4 H &amp; 2 O (Left) = 4 H &amp; 2 O (Right)
  </text>
</svg>