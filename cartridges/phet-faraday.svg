<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <rect width="800" height="480" fill="#090d16"/>
  <text x="400" y="40" fill="#f8fafc" font-size="21" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
    PhET Distilled: Faraday's Law &amp; Electromagnetic Flux Induction
  </text>
  <text x="400" y="64" fill="#94a3b8" font-size="12.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">
    Drag the Permanent Magnet or Use Arrow Keys to Induce Electromotive Force (EMF)
  </text>

  <!-- Copper Solenoid Coil Loops -->
  <g id="solenoid-coil" transform="translate(360, 160)"
     data-pedagogical="faraday-solenoid"
     data-pedagogical-title="Multi-Turn Copper Solenoid"
     data-pedagogical-eq="Φ_B = B · A · cos(θ)"
     data-pedagogical-desc="Each wire turn multiplies the linked magnetic flux; doubling N doubles the peak induced EMF.">
    <path d="M 0 0 C 40 -30, 40 110, 0 80 M 30 0 C 70 -30, 70 110, 30 80 M 60 0 C 100 -30, 100 110, 60 80 M 90 0 C 130 -30, 130 110, 90 80"
          fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <text id="coil-turns-label" x="60" y="126" fill="#fdba74" font-size="13" font-weight="800" text-anchor="middle">4-Turn Solenoid Coil</text>
  </g>

  <!-- Draggable Permanent Bar Magnet -->
  <g id="bar-magnet" transform="translate(180, 175)" style="cursor: grab;"
     data-pedagogical="faraday-magnet"
     data-pedagogical-title="Permanent Alnico Dipole Magnet"
     data-pedagogical-eq="∇ · B = 0 (Closed Flux Lines)"
     data-pedagogical-desc="Magnetic field lines emerge from the North pole (red) and enter the South pole (blue). Stationary magnets induce zero EMF.">
    <rect x="0" y="0" width="80" height="50" rx="4" fill="#ef4444" stroke="#fca5a5" stroke-width="1"/>
    <text x="40" y="32" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">N</text>
    <rect x="80" y="0" width="80" height="50" rx="4" fill="#3b82f6" stroke="#93c5fd" stroke-width="1"/>
    <text x="120" y="32" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">S</text>
    <text x="80" y="68" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">⇄ Drag Magnet Through Coil</text>
  </g>

  <!-- Galvanometer Meter (Negative-Space Bezel) -->
  <g id="galvanometer" transform="translate(590, 235)"
     data-pedagogical="faraday-meter"
     data-pedagogical-title="Center-Zero Galvanometer"
     data-pedagogical-eq="ε = -N × (dΦ_B / dt)"
     data-pedagogical-desc="Deflects right or left according to Lenz's Law depending on whether magnetic flux is increasing or decreasing.">
    <path fill-rule="evenodd" fill="#0f172a" stroke="#64748b" stroke-width="2.5"
          d="M 60 2 A 58 58 0 1 0 60 118 A 58 58 0 1 0 60 2 Z M 60 10 A 50 50 0 1 1 60 110 A 50 50 0 1 1 60 10 Z"/>
    <circle cx="60" cy="60" r="50" fill="#1e293b"/>
    <line x1="60" y1="60" x2="60" y2="22" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" id="meter-needle"/>
    <circle cx="60" cy="60" r="6" fill="#f8fafc"/>
    <text x="60" y="88" fill="#94a3b8" font-size="9.5" font-weight="800" text-anchor="middle">GALVANOMETER</text>
    <text x="60" y="103" fill="#38bdf8" font-size="11.5" font-weight="900" text-anchor="middle" font-family="monospace" id="emf-val">0.0 mV</text>
  </g>

  <!-- Invariant Equation Bar -->
  <g transform="translate(180, 400)">
    <rect width="440" height="52" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
    <text id="faraday-eq-banner" x="220" y="32" fill="#fb923c" font-size="15.5" font-weight="900" text-anchor="middle" font-family="monospace">
      ε = -N × (ΔΦ / Δt)  •  N = 4 Turns
    </text>
  </g>
</svg>