<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <defs>
    <!-- Studio Physics Bench Backdrop -->
    <radialGradient id="pf-bg" cx="46%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#172540"/>
      <stop offset="58%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="pf-bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="18%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Brushed Copper Solenoid Wire -->
    <linearGradient id="pf-copper-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="28%" stop-color="#fb923c"/>
      <stop offset="68%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="pf-copper-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="pf-bobbin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Alnico Bar Magnet Poles (Brushed Enamel + Specular) -->
    <linearGradient id="pf-north" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="20%" stop-color="#ef4444"/>
      <stop offset="76%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="pf-south" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="20%" stop-color="#3b82f6"/>
      <stop offset="76%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Brass Instrument Bezel & Ivory Meter Dial -->
    <linearGradient id="pf-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="32%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="pf-dial" cx="50%" cy="42%" r="58%" fx="38%" fy="28%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="72%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="pf-pivot-cap" cx="45%" cy="40%" r="55%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <!-- Reusable Symbols (<use> Instancing) -->
    <g id="pf-coil-turn">
      <!-- Rear dark arc behind magnet bore -->
      <path d="M 0 0 C -22 -28, -22 108, 0 80" fill="none" stroke="url(#pf-copper-back)" stroke-width="9" stroke-linecap="round"/>
      <!-- Front lit copper arc -->
      <path d="M 0 0 C 32 -28, 32 108, 0 80" fill="none" stroke="url(#pf-copper-front)" stroke-width="9.5" stroke-linecap="round"/>
      <!-- Crisp metallic specular highlight -->
      <path d="M 10 -6 C 24 8, 24 68, 10 82" fill="none" stroke="#ffedd5" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    </g>
    <g id="pf-terminal-post">
      <circle cx="0" cy="0" r="8" fill="url(#pf-brass)" stroke="#451a03" stroke-width="1.5"/>
      <circle cx="-2" cy="-2" r="2.6" fill="#fef9c3" opacity="0.75"/>
    </g>
    <g id="pf-flux-loop">
      <ellipse cx="80" cy="25" rx="112" ry="52" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.28"/>
      <ellipse cx="80" cy="25" rx="136" ry="74" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 7" opacity="0.16"/>
    </g>
  </defs>

  <!-- Studio Backdrop & Calibrated Bench -->
  <rect width="800" height="480" fill="url(#pf-bg)" aria-hidden="true"/>
  <g aria-hidden="true" opacity="0.14" stroke="#38bdf8" stroke-width="0.8">
    <path d="M 0 120 H 800 M 0 200 H 800 M 0 280 H 800 M 160 80 V 350 M 320 80 V 350 M 480 80 V 350 M 640 80 V 350"/>
  </g>
  <rect x="0" y="346" width="800" height="134" fill="url(#pf-bench)" aria-hidden="true"/>
  <line x1="0" y1="346" x2="800" y2="346" stroke="#334155" stroke-width="2" aria-hidden="true"/>

  <!-- Header -->
  <text x="400" y="38" fill="#f8fafc" font-size="20.5" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
    PhET Distilled: Faraday's Law &amp; Electromagnetic Flux Induction
  </text>
  <text x="400" y="61" fill="#94a3b8" font-size="12.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">
    Drag the Permanent Magnet or Use Arrow Keys to Induce Electromotive Force (EMF)
  </text>

  <!-- Copper Lead Wires Connecting Solenoid to Galvanometer -->
  <g aria-hidden="true" fill="none" stroke-linecap="round">
    <path d="M 382 272 C 382 320, 560 326, 616 326" stroke="#020617" stroke-width="7" opacity="0.5"/>
    <path d="M 468 272 C 468 304, 588 310, 684 310" stroke="#020617" stroke-width="7" opacity="0.5"/>
    <path d="M 382 272 C 382 320, 560 326, 616 326" stroke="#ea580c" stroke-width="4"/>
    <path d="M 468 272 C 468 304, 588 310, 684 310" stroke="#f97316" stroke-width="4"/>
    <use href="#pf-terminal-post" x="382" y="272"/>
    <use href="#pf-terminal-post" x="468" y="272"/>
  </g>

  <!-- Copper Solenoid Coil Assembly -->
  <g id="solenoid-coil" transform="translate(360, 160)"
     data-pedagogical="faraday-solenoid"
     data-pedagogical-title="Multi-Turn Copper Solenoid"
     data-pedagogical-eq="Φ_B = B · A · cos(θ)"
     data-pedagogical-desc="Each wire turn multiplies the linked magnetic flux; doubling N doubles the peak induced EMF.">
    <!-- Cel Cast Shadow on Bench -->
    <ellipse cx="64" cy="186" rx="84" ry="9" fill="#020617" opacity="0.55" aria-hidden="true"/>
    <!-- Insulated Acrylic Former & Base Cradle -->
    <rect x="-12" y="4" width="136" height="72" rx="10" fill="url(#pf-bobbin)" stroke="#475569" stroke-width="1.5" opacity="0.72" aria-hidden="true"/>
    <rect x="6" y="100" width="114" height="14" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2" aria-hidden="true"/>
    <!-- 4 Instanced Copper Loops -->
    <use href="#pf-coil-turn" x="10" y="0" aria-hidden="true"/>
    <use href="#pf-coil-turn" x="38" y="0" aria-hidden="true"/>
    <use href="#pf-coil-turn" x="66" y="0" aria-hidden="true"/>
    <use href="#pf-coil-turn" x="94" y="0" aria-hidden="true"/>
    <text id="coil-turns-label" x="60" y="132" fill="#fdba74" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">4-Turn Solenoid Coil</text>
  </g>

  <!-- Draggable Permanent Bar Magnet -->
  <g id="bar-magnet" transform="translate(180, 175)" style="cursor: grab;"
     role="button" tabindex="0" aria-label="Draggable permanent bar magnet"
     data-pedagogical="faraday-magnet"
     data-pedagogical-title="Permanent Alnico Dipole Magnet"
     data-pedagogical-eq="∇ · B = 0 (Closed Flux Lines)"
     data-pedagogical-desc="Magnetic field lines emerge from the North pole (red) and enter the South pole (blue). Stationary magnets induce zero EMF.">
    <!-- Subtle Dipole Flux Lines -->
    <use href="#pf-flux-loop" aria-hidden="true"/>
    <!-- Hard Cel Drop Shadow -->
    <rect x="4" y="8" width="160" height="50" rx="6" fill="#020617" opacity="0.55" aria-hidden="true"/>
    <!-- North Pole -->
    <path d="M 6 0 H 80 V 50 H 6 A 6 6 0 0 1 0 44 V 6 A 6 6 0 0 1 6 0 Z" fill="url(#pf-north)" stroke="#fecaca" stroke-width="1.2"/>
    <!-- South Pole -->
    <path d="M 80 0 H 154 A 6 6 0 0 1 160 6 V 44 A 6 6 0 0 1 154 50 H 80 Z" fill="url(#pf-south)" stroke="#bfdbfe" stroke-width="1.2"/>
    <!-- Machined Specular Bevel Strip -->
    <rect x="4" y="3" width="152" height="7" rx="3" fill="#ffffff" opacity="0.22" aria-hidden="true"/>
    <line x1="80" y1="1" x2="80" y2="49" stroke="#0f172a" stroke-width="1.6" opacity="0.55" aria-hidden="true"/>
    <text x="40" y="33" fill="#ffffff" font-size="21" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">N</text>
    <text x="120" y="33" fill="#ffffff" font-size="21" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">S</text>
    <text x="80" y="70" fill="#cbd5e1" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">⇄ Drag Magnet Through Coil</text>
  </g>

  <!-- Galvanometer Meter (Compound Negative-Space Brass Bezel) -->
  <g id="galvanometer" transform="translate(590, 218)"
     data-pedagogical="faraday-meter"
     data-pedagogical-title="Center-Zero Galvanometer"
     data-pedagogical-eq="ε = -N × (dΦ_B / dt)"
     data-pedagogical-desc="Deflects right or left according to Lenz's Law depending on whether magnetic flux is increasing or decreasing.">
    <!-- Cel Shadow & Stand Foot -->
    <ellipse cx="60" cy="128" rx="54" ry="8" fill="#020617" opacity="0.65" aria-hidden="true"/>
    <rect x="26" y="108" width="68" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2" aria-hidden="true"/>
    <!-- Dial Face -->
    <circle cx="60" cy="60" r="52" fill="url(#pf-dial)"/>
    <!-- Calibrated Scale Arc & Tick Marks -->
    <path d="M 22 44 A 41 41 0 0 1 98 44" fill="none" stroke="#475569" stroke-width="1.6" aria-hidden="true"/>
    <g stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <line x1="60" y1="16" x2="60" y2="24" stroke="#38bdf8" stroke-width="2.2"/>
      <line x1="38" y1="22" x2="42" y2="29"/>
      <line x1="82" y1="22" x2="78" y2="29"/>
      <line x1="23" y1="38" x2="30" y2="42"/>
      <line x1="97" y1="38" x2="90" y2="42"/>
    </g>
    <text x="27" y="54" fill="#f87171" font-size="9" font-weight="900" text-anchor="middle" aria-hidden="true">−</text>
    <text x="60" y="34" fill="#94a3b8" font-size="8" font-weight="800" text-anchor="middle" aria-hidden="true">0</text>
    <text x="93" y="54" fill="#4ade80" font-size="9" font-weight="900" text-anchor="middle" aria-hidden="true">+</text>
    <!-- Compound Negative-Space Brass Bezel -->
    <path fill-rule="evenodd" fill="url(#pf-brass)" stroke="#451a03" stroke-width="1.4"
          d="M 60 0 A 60 60 0 1 0 60 120 A 60 60 0 1 0 60 0 Z M 60 9 A 51 51 0 1 1 60 111 A 51 51 0 1 1 60 9 Z"/>
    <!-- Glass Specular Crescent -->
    <path d="M 24 38 A 46 46 0 0 1 88 26 A 54 54 0 0 0 24 38 Z" fill="#ffffff" opacity="0.14" aria-hidden="true"/>
    <!-- Animated Needle -->
    <line x1="60" y1="60" x2="60" y2="20" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" id="meter-needle"/>
    <circle cx="60" cy="60" r="7" fill="url(#pf-pivot-cap)" stroke="#0f172a" stroke-width="1.4"/>
    <text x="60" y="86" fill="#94a3b8" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.6">GALVANOMETER</text>
    <text x="60" y="102" fill="#38bdf8" font-size="11.5" font-weight="900" text-anchor="middle" font-family="monospace" id="emf-val">0.0 mV</text>
  </g>

  <!-- Invariant Equation Bar -->
  <g transform="translate(170, 398)">
    <rect x="3" y="5" width="460" height="52" rx="10" fill="#020617" opacity="0.6" aria-hidden="true"/>
    <rect width="460" height="52" rx="10" fill="#0f172a" stroke="#f97316" stroke-width="1.6"/>
    <rect x="8" y="3" width="444" height="2" rx="1" fill="#fed7aa" opacity="0.25" aria-hidden="true"/>
    <text id="faraday-eq-banner" x="230" y="32" fill="#fb923c" font-size="15" font-weight="900" text-anchor="middle" font-family="monospace">
      ε = -N × (ΔΦ / Δt)  •  N = 4 Turns
    </text>
  </g>
</svg>