<svg xmlns="http://www.w3.org/2000/svg" viewBox="-240 -160 480 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bsl-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="vowel-a-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Stage Background -->
  <rect x="-240" y="-160" width="480" height="320" fill="url(#bsl-bg-glow)" />

  <!-- 3D Spatial Floor Grid -->
  <g id="spatial-grid" stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <ellipse cx="0" cy="90" rx="190" ry="40" fill="none" stroke-dasharray="4,4" />
    <ellipse cx="0" cy="90" rx="130" ry="26" fill="none" />
    <line x1="-190" y1="90" x2="190" y2="90" />
    <line x1="0" y1="50" x2="0" y2="130" />
  </g>

  <!-- Title & Active Sign Status Bar -->
  <g transform="translate(0, -130)">
    <rect x="-180" y="-14" width="360" height="28" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text id="vowel-indicator-label" x="0" y="4" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="0.5">
      ACTIVE SIGN: Vowel A (Thumb Tap)
    </text>
  </g>

  <!-- Vowel Reference Map Badges (A - E - I - O - U) -->
  <g id="vowel-badges" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
    <!-- A: Thumb -->
    <g transform="translate(-130, -5)">
      <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">A</text>
      <text x="0" y="24" fill="#94a3b8" font-size="8">Thumb</text>
    </g>
    <!-- E: Index -->
    <g transform="translate(-105, -75)">
      <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">E</text>
      <text x="0" y="24" fill="#94a3b8" font-size="8">Index</text>
    </g>
    <!-- I: Middle -->
    <g transform="translate(-50, -95)">
      <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">I</text>
      <text x="0" y="24" fill="#94a3b8" font-size="8">Middle</text>
    </g>
    <!-- O: Ring -->
    <g transform="translate(5, -75)">
      <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">O</text>
      <text x="0" y="24" fill="#94a3b8" font-size="8">Ring</text>
    </g>
    <!-- U: Pinky -->
    <g transform="translate(45, -40)">
      <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">U</text>
      <text x="0" y="24" fill="#94a3b8" font-size="8">Pinky</text>
    </g>
  </g>

  <!-- 3D Hand Skeletal Stage Container -->
  <g id="hand-3d-root">
    <!-- Non-Dominant Base Hand Skeleton (Blue) -->
    <g id="base-hand" stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
      <line id="bone-thumb" x1="-50" y1="30" x2="-95" y2="10" />
      <line id="bone-index" x1="-50" y1="30" x2="-75" y2="-40" />
      <line id="bone-middle" x1="-50" y1="30" x2="-50" y2="-50" />
      <line id="bone-ring" x1="-50" y1="30" x2="-28" y2="-42" />
      <line id="bone-pinky" x1="-50" y1="30" x2="-10" y2="-25" />
      
      <!-- Wrist & Forearm connection -->
      <line x1="-60" y1="80" x2="-50" y2="30" stroke="#0284c7" stroke-width="6" />

      <!-- Nodes -->
      <circle id="base-wrist" cx="-60" cy="80" r="14" fill="#0369a1" />
      <circle id="base-palm" cx="-50" cy="30" r="22" fill="#0284c7" opacity="0.85" />
      <circle id="base-thumb-tip" cx="-95" cy="10" r="10" fill="#38bdf8" />
      <circle id="base-index-tip" cx="-75" cy="-40" r="9" fill="#38bdf8" />
      <circle id="base-middle-tip" cx="-50" cy="-50" r="9" fill="#38bdf8" />
      <circle id="base-ring-tip" cx="-28" cy="-42" r="9" fill="#38bdf8" />
      <circle id="base-pinky-tip" cx="-10" cy="-25" r="8" fill="#38bdf8" />
    </g>

    <!-- Active Touch Pulse Glow -->
    <circle id="active-vowel-glow" cx="-95" cy="10" r="24" fill="url(#vowel-a-glow)" opacity="0.7" pointer-events="none" />

    <!-- Dominant Pointer Hand ("The Pen" - Amber/Emerald) -->
    <g id="pointer-hand" stroke="#f59e0b" stroke-width="5" stroke-linecap="round">
      <line id="dom-pointer-bone" x1="60" y1="25" x2="-95" y2="10" />
      <line x1="110" y1="80" x2="60" y2="25" stroke="#d97706" stroke-width="6" />

      <!-- Dominant Nodes -->
      <circle id="dom-wrist" cx="110" cy="80" r="14" fill="#b45309" />
      <circle id="dom-knuckle" cx="60" cy="25" r="18" fill="#d97706" />
      <circle id="dom-pointer-tip" cx="-95" cy="10" r="11" fill="#fbbf24" filter="url(#glow-drop)" />
    </g>
  </g>

  <!-- Interactive 3D Perspective Helper Badge -->
  <g transform="translate(0, 135)">
    <rect x="-190" y="-12" width="380" height="24" rx="6" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="0" y="3" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">
      🖐️ Drag dominant hand or use 3D Orbit slider to view Signer POV vs Receiver POV
    </text>
  </g>
</svg>
