<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <radialGradient id="pd-bg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#131e33"/>
      <stop offset="62%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="pd-rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pd-chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pd-pole-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="pd-weight" cx="44%" cy="40%" r="58%" fx="30%" fy="26%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="35%" stop-color="#fb7185"/>
      <stop offset="78%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>
    <radialGradient id="pd-pivot" cx="44%" cy="40%" r="56%" fx="30%" fy="28%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Instanced Precision Wheel Symbol -->
    <g id="pd-wheel-sym">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#64748b" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="#e2e8f0"/>
    </g>
    <style>
      .hud-text { font-family: monospace; font-size: 11px; fill: #94a3b8; font-weight: 700; }
      .hud-val  { font-family: monospace; font-size: 13.5px; font-weight: 900; }
    </style>
  </defs>

  <!-- Aerospace Control Lab Backdrop & Calibration Grid -->
  <rect width="800" height="400" fill="url(#pd-bg)" aria-hidden="true"/>
  <g aria-hidden="true" stroke="#38bdf8" stroke-width="0.7" opacity="0.12">
    <path d="M 0 80 H 800 M 0 160 H 800 M 0 240 H 800 M 100 0 V 400 M 200 0 V 400 M 300 0 V 400 M 400 0 V 400 M 500 0 V 400 M 600 0 V 400 M 700 0 V 400"/>
  </g>
  <!-- Center Target Line (x = 0) -->
  <line x1="400" y1="90" x2="400" y2="282" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.35" aria-hidden="true"/>

  <!-- Machined Linear Track & End-Stop Bumpers -->
  <g aria-hidden="true">
    <rect x="46" y="282" width="708" height="14" rx="4" fill="url(#pd-rail)" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="52" y="284" width="696" height="2.5" rx="1" fill="#e2e8f0" opacity="0.35"/>
    <!-- Left & Right Rubberized End-Stops -->
    <rect x="44" y="264" width="14" height="32" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="742" y="264" width="14" height="32" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Millimeter Scale Ticks -->
    <g stroke="#64748b" stroke-width="1.2">
      <line x1="150" y1="296" x2="150" y2="306"/>
      <line x1="275" y1="296" x2="275" y2="304"/>
      <line x1="400" y1="296" x2="400" y2="310" stroke="#38bdf8" stroke-width="1.8"/>
      <line x1="525" y1="296" x2="525" y2="304"/>
      <line x1="650" y1="296" x2="650" y2="306"/>
    </g>
    <text x="150" y="320" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">-250px</text>
    <text x="400" y="322" fill="#38bdf8" font-size="10.5" font-family="monospace" font-weight="800" text-anchor="middle">x = 0 (TARGET)</text>
    <text x="650" y="320" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">+250px</text>
  </g>

  <!-- The Cart Assembly (Transformed via Cartesian X) -->
  <g id="cart" transform="translate(400, 250)" style="cursor: grab;"
     role="button" tabindex="0" aria-label="Draggable cart chassis"
     data-pedagogical="cart-chassis">
    <!-- Cel Shadow -->
    <rect x="-44" y="29" width="88" height="5" rx="2.5" fill="#020617" opacity="0.65" aria-hidden="true"/>
    <!-- Instanced Ball-Bearing Wheels -->
    <use href="#pd-wheel-sym" x="-30" y="25" aria-hidden="true"/>
    <use href="#pd-wheel-sym" x="30" y="25" aria-hidden="true"/>
    <!-- Anodized Chassis Body -->
    <rect x="-48" y="-2" width="96" height="26" rx="5" fill="url(#pd-chassis)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="-42" y="1" width="84" height="4" rx="2" fill="#94a3b8" opacity="0.24" aria-hidden="true"/>
    <!-- Drive Motor Accent Stripes -->
    <rect x="-36" y="10" width="18" height="6" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.8" aria-hidden="true"/>
    <rect x="18" y="10" width="18" height="6" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.8" aria-hidden="true"/>

    <!-- The Inverted Pole (Pure polar rotation around pivot 0, 0) -->
    <g id="pole" transform="rotate(0, 0, 0)" style="cursor: grab;"
       role="button" tabindex="0" aria-label="Inverted pendulum pole"
       data-pedagogical="inverted-pole">
      <line x1="0" y1="0" x2="0" y2="-122" stroke="url(#pd-pole-grad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="-1.2" y1="-6" x2="-1.2" y2="-116" stroke="#ffe4e6" stroke-width="1.2" opacity="0.55" aria-hidden="true"/>
      <!-- Counterweight Collar & Tip Mass -->
      <rect x="-5" y="-110" width="10" height="5" rx="1.5" fill="#fbbf24" stroke="#78350f" stroke-width="0.8" aria-hidden="true"/>
      <circle cx="0" cy="-124" r="10" fill="url(#pd-weight)" stroke="#fda4af" stroke-width="1.4"/>
    </g>

    <!-- Brass Pivot Bearing -->
    <circle cx="0" cy="0" r="6.5" fill="url(#pd-pivot)" stroke="#0f172a" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="2" fill="#fef9c3" aria-hidden="true"/>
  </g>

  <!-- Crisp Instrument Telemetry HUD Panel -->
  <g id="hud" transform="translate(34, 24)">
    <rect x="3" y="4" width="276" height="98" rx="10" fill="#020617" opacity="0.6" aria-hidden="true"/>
    <rect x="0" y="0" width="276" height="98" rx="10" fill="#0f172a" fill-opacity="0.92" stroke="#334155" stroke-width="1.4"/>
    <rect x="10" y="2.5" width="256" height="2" rx="1" fill="#38bdf8" opacity="0.45" aria-hidden="true"/>
    <text x="16" y="23" class="hud-text">MODE: <tspan id="hud-mode" class="hud-val" fill="#38bdf8">TUPLE</tspan></text>
    <text x="16" y="45" class="hud-text">PAYLOAD: <tspan id="hud-bytes" class="hud-val" fill="#a5f3fc">16 B</tspan></text>
    <text x="16" y="67" class="hud-text">LOOP LATENCY: <tspan id="hud-ms" class="hud-val" fill="#34d399">10.2 ms</tspan></text>
    <text x="16" y="88" class="hud-text">STATE: <tspan id="hud-status" class="hud-val" fill="#22c55e">BALANCED (60 FPS)</tspan></text>
  </g>
</svg>
