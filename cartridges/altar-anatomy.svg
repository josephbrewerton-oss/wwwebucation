<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="altar-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="altar-room-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(250, 204, 21, 0.22)" />
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.08)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="gold-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>

  <!-- Deep Sacred Sanctuary Interior Atmosphere -->
  <rect x="0" y="0" width="800" height="480" fill="#090d16" />
  <circle cx="400" cy="200" r="320" fill="url(#altar-room-glow)" />

  <!-- Sanctuary Stepped Dais (Suppedaneum - 3 Liturgical Steps) -->
  <polygon points="80,440 720,440 680,390 120,390" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <polygon points="120,390 680,390 640,340 160,340" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <polygon points="160,340 640,340 600,290 200,290" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <text x="400" y="420" fill="#64748b" font-size="10" font-weight="bold" letter-spacing="3" text-anchor="middle">
    THREE SANCTUARY STEPS: FAITH &bull; HOPE &bull; CHARITY
  </text>

  <!-- Altar Solid Base & Carved Pillars -->
  <rect x="230" y="220" width="340" height="90" rx="4" fill="#0b1120" stroke="#334155" stroke-width="2" />

  <!-- Liturgical Antependium (Altar Frontal Fabric) -->
  <rect x="238" y="224" width="324" height="82" rx="2" fill="#15803d" stroke="#22c55e" stroke-width="2" />
  <line x1="238" y1="300" x2="562" y2="300" stroke="#facc15" stroke-width="3" stroke-dasharray="4 2" />
  <circle cx="400" cy="265" r="22" fill="rgba(0,0,0,0.3)" stroke="#facc15" stroke-width="2" />
  <text x="400" y="271" fill="#fef08a" font-size="16" font-weight="900" text-anchor="middle">IHS</text>
  <text x="400" y="294" fill="#bbf7d0" font-size="8" font-weight="bold" text-anchor="middle">ANTEPENDIUM &bull; LITURGICAL FRONTAL</text>

  <!-- Consecrated Stone Mensa -->
  <polygon points="190,220 610,220 630,185 170,185" fill="#e2e8f0" stroke="#f8fafc" stroke-width="2" />
  <text x="400" y="210" fill="#0f172a" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">
    MENSA ALTARIS &bull; CHRIST THE CORNERSTONE
  </text>

  <!-- Pure White Altar Linens (Lintea Altaris) Falling on Sides -->
  <polygon points="186,216 614,216 626,190 174,190" fill="#ffffff" opacity="0.95" stroke="#cbd5e1" stroke-width="1.5" />
  <path d="M 186 216 L 186 255 Q 191 260, 196 255 L 196 216" fill="#ffffff" stroke="#94a3b8" />
  <path d="M 614 216 L 614 255 Q 609 260, 604 255 L 604 216" fill="#ffffff" stroke="#94a3b8" />

  <!-- Inset Consecrated Altar Stone (Ara) with 5 Crosses -->
  <rect x="340" y="194" width="120" height="20" rx="3" fill="#64748b" stroke="#ca8a04" stroke-width="1.5" />
  <!-- 5 Gold Crosses cut into the stone -->
  <text x="350" y="208" fill="#facc15" font-size="8" font-weight="bold">✠</text>
  <text x="442" y="208" fill="#facc15" font-size="8" font-weight="bold">✠</text>
  <text x="400" y="208" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">✠</text>
  <text x="365" y="208" fill="#facc15" font-size="7">✦</text>
  <text x="428" y="208" fill="#facc15" font-size="7">✦</text>

  <!-- Relic Chamber Glow Effect -->
  <circle id="altar-relic-glow" cx="400" cy="204" r="26" fill="rgba(250, 204, 21, 0.35)" filter="url(#altar-glow)" opacity="0.0" />

  <!-- The Corporal (Unfolded 9-square linen in center) -->
  <polygon points="364,204 436,204 442,180 358,180" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="388" y1="180" x2="388" y2="204" stroke="#e2e8f0" stroke-dasharray="1 2" />
  <line x1="412" y1="180" x2="412" y2="204" stroke="#e2e8f0" stroke-dasharray="1 2" />

  <!-- The Central Altar Crucifix -->
  <polygon points="388,165 412,165 408,155 392,155" fill="#ca8a04" stroke="#eab308" stroke-width="1" />
  <rect x="397" y="70" width="6" height="85" fill="#ca8a04" stroke="#eab308" stroke-width="1" />
  <rect x="380" y="90" width="40" height="6" fill="#ca8a04" stroke="#eab308" stroke-width="1" />
  <!-- Corpus of Christ -->
  <line x1="400" y1="84" x2="400" y2="110" stroke="#f8fafc" stroke-width="3" />
  <line x1="386" y1="93" x2="414" y2="93" stroke="#f8fafc" stroke-width="2.5" />
  <circle cx="400" cy="80" r="3.5" fill="#f8fafc" />
  <circle cx="400" cy="90" r="25" fill="rgba(250, 204, 21, 0.12)" filter="url(#altar-glow)" />

  <!-- Four Beeswax Altar Candles (Two Left, Two Right) -->
  <!-- Candle 1 -->
  <rect x="210" y="170" width="12" height="20" fill="#ca8a04" />
  <rect x="213" y="115" width="6" height="55" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" />
  <circle id="altar-candle-glow-1" cx="216" cy="110" r="6" fill="#f97316" filter="url(#altar-glow)" />
  <circle cx="216" cy="109" r="2.5" fill="#fef08a" />

  <!-- Candle 2 -->
  <rect x="255" y="175" width="12" height="20" fill="#ca8a04" />
  <rect x="258" y="125" width="6" height="50" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" />
  <circle cx="261" cy="120" r="5.5" fill="#f97316" filter="url(#altar-glow)" />
  <circle cx="261" cy="119" r="2.5" fill="#fef08a" />

  <!-- Candle 3 -->
  <rect x="535" y="175" width="12" height="20" fill="#ca8a04" />
  <rect x="538" y="125" width="6" height="50" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" />
  <circle cx="541" cy="120" r="5.5" fill="#f97316" filter="url(#altar-glow)" />
  <circle cx="541" cy="119" r="2.5" fill="#fef08a" />

  <!-- Candle 4 -->
  <rect x="580" y="170" width="12" height="20" fill="#ca8a04" />
  <rect x="583" y="115" width="6" height="55" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8" />
  <circle id="altar-candle-glow-2" cx="586" cy="110" r="6" fill="#f97316" filter="url(#altar-glow)" />
  <circle cx="586" cy="109" r="2.5" fill="#fef08a" />

  <!-- The Roman Missal & Stand (Left Altar Horn) -->
  <polygon points="295,195 330,195 338,180 303,180" fill="#991b1b" stroke="#facc15" stroke-width="1.5" />
  <polygon points="298,193 327,193 335,182 306,182" fill="#f8fafc" />
  <text x="316" y="189" fill="#991b1b" font-size="8" font-weight="900" text-anchor="middle">📖</text>
  <text x="316" y="206" fill="#cbd5e1" font-size="6" font-weight="bold" text-anchor="middle">MISSAL</text>

  <!-- Golden Chalice, Paten with Host, and Pall (On the Corporal) -->
  <polygon points="412,192 426,192 421,180 417,180" fill="#eab308" />
  <path d="M 412 180 Q 419 170, 419 160 Q 426 170, 426 180 Z" fill="#facc15" stroke="#ca8a04" stroke-width="0.8" />
  <!-- Sacred Pall -->
  <rect x="410" y="156" width="18" height="5" rx="1" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text x="419" y="160" fill="#ca8a04" font-size="4" font-weight="bold" text-anchor="middle">+</text>

  <!-- Paten with Consecrated Host -->
  <ellipse cx="384" cy="194" rx="10" ry="4" fill="#eab308" stroke="#ca8a04" stroke-width="1" />
  <ellipse cx="384" cy="192" rx="7" ry="2.8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
  <text x="384" y="193" fill="#78350f" font-size="4" font-weight="bold" text-anchor="middle">+</text>

  <!-- Credence Table (South Side: Wine, Water Cruets, Lavabo Bowl & Towel) -->
  <rect x="660" y="240" width="90" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <rect x="655" y="235" width="100" height="7" rx="1" fill="#f8fafc" />
  <!-- Glass Cruets -->
  <ellipse cx="685" cy="228" rx="4" ry="8" fill="#38bdf8" stroke="#0284c7" stroke-width="1" />
  <ellipse cx="705" cy="228" rx="4" ry="8" fill="#b91c1c" stroke="#991b1b" stroke-width="1" />
  <text x="705" y="265" fill="#f8fafc" font-size="8" font-weight="bold" text-anchor="middle">CREDENCE TABLE</text>
  <text x="705" y="278" fill="#94a3b8" font-size="7" text-anchor="middle">Cruets &bull; Lavabo &bull; Bells</text>

  <!-- Sanctuary Sanctus Bells (Front Right Step) -->
  <circle cx="630" cy="365" r="14" fill="#ca8a04" stroke="#facc15" stroke-width="2" />
  <text x="630" y="370" fill="#ffffff" font-size="12" text-anchor="middle">🔔</text>
  <text x="630" y="392" fill="#cbd5e1" font-size="7" font-weight="bold" text-anchor="middle">SANCTUS BELLS</text>

  <!-- Interactive Moving Liturgical Probe Spotlight -->
  <circle id="altar-probe-halo" cx="400" cy="210" r="32" fill="rgba(250, 204, 21, 0.15)" stroke="#facc15" stroke-width="2" stroke-dasharray="4 3" filter="url(#altar-glow)" />
  <circle id="altar-probe" cx="400" cy="210" r="8" fill="#facc15" filter="url(#altar-glow)" />

  <!-- Top Pedagogical HUD Station Banner -->
  <rect x="80" y="14" width="640" height="44" rx="8" fill="#090d16" stroke="#facc15" stroke-width="1.5" />
  <text id="altar-step-title" x="105" y="32" fill="#fef08a" font-size="12" font-weight="900">
    1. THE CONSECRATED MENSA (CHRIST THE CORNERSTONE)
  </text>
  <text id="altar-step-desc" x="105" y="47" fill="#cbd5e1" font-size="10">
    Mensa Altaris &bull; Anointed with Holy Chrism representing Christ Himself...
  </text>
  <circle cx="692" cy="36" r="12" fill="#b45309" />
  <text x="692" y="40" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">✝</text>
</svg>
