<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="rosary-bg-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="gold-bead-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
    <radialGradient id="sapphire-bead-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
    <radialGradient id="halo-pulse-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="rosary-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Sacred Blue Background -->
  <rect width="800" height="480" fill="url(#rosary-bg-glow)" />

  <!-- Title Ribbon -->
  <g transform="translate(400, 48)">
    <rect x="-240" y="-16" width="480" height="32" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(234, 179, 8, 0.45)" stroke-width="1.5" />
    <text id="rosary-prayer-status" x="0" y="5" text-anchor="middle" fill="#fde047" font-size="12.5" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="0.5">
      CRUCIFIX: Credo in Deum (Apostles' Creed)
    </text>
  </g>

  <!-- 3D Bead Circle (Chaplet Decades) -->
  <g id="rosary-3d-root">
    <!-- Base Ellipse Thread -->
    <ellipse id="rosary-ring" cx="400" cy="235" rx="140" ry="60" fill="none" stroke="rgba(234, 179, 8, 0.35)" stroke-width="2.5" />

    <!-- 10 Decade Beads (Sapphire Marian Beads) -->
    <g id="decade-beads" transform="translate(400, 235)">
      <circle cx="-140" cy="0" r="8" fill="url(#gold-bead-grad)" />
      <circle cx="-130" cy="-22" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="-108" cy="-39" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="-80" cy="-52" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="-48" cy="-58" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="-16" cy="-60" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="16" cy="-60" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="48" cy="-58" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="80" cy="-52" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="108" cy="-39" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="130" cy="-22" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="140" cy="0" r="8" fill="url(#gold-bead-grad)" />
      <circle cx="130" cy="22" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="108" cy="39" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="80" cy="52" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="48" cy="58" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="-48" cy="58" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="-80" cy="52" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="-108" cy="39" r="6.5" fill="url(#sapphire-bead-grad)" />
      <circle cx="-130" cy="22" r="6.5" fill="url(#sapphire-bead-grad)" />
    </g>

    <!-- Active Contemplative Bead Halo Glow -->
    <circle id="active-bead-halo" cx="400" cy="295" r="22" fill="url(#halo-pulse-grad)" opacity="0.85" pointer-events="none" />

    <!-- Centerpiece Miraculous Medal -->
    <g id="centerpiece-medal" transform="translate(400, 295)">
      <circle cx="0" cy="0" r="11" fill="url(#gold-bead-grad)" stroke="#ca8a04" stroke-width="1.5" />
      <text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="7" font-weight="900">M</text>
    </g>

    <!-- Pendent Strand Leading to Crucifix -->
    <line id="pendent-line" x1="400" y1="306" x2="400" y2="370" stroke="#ca8a04" stroke-width="2.5" />
    <circle id="our-father-pendent" cx="400" cy="320" r="7.5" fill="url(#gold-bead-grad)" />
    <circle cx="400" cy="334" r="5.5" fill="url(#sapphire-bead-grad)" />
    <circle cx="400" cy="346" r="5.5" fill="url(#sapphire-bead-grad)" />
    <circle cx="400" cy="358" r="5.5" fill="url(#sapphire-bead-grad)" />

    <!-- Crucifix -->
    <g id="crucifix-node" transform="translate(400, 385)" filter="url(#rosary-glow)">
      <!-- Cross Beams -->
      <line x1="0" y1="-16" x2="0" y2="22" stroke="#ca8a04" stroke-width="5.5" stroke-linecap="square" />
      <line x1="-14" y1="-5" x2="14" y2="-5" stroke="#ca8a04" stroke-width="5.5" stroke-linecap="square" />
      <!-- Silver Corpus of Christ -->
      <circle cx="0" cy="-7" r="3" fill="#f8fafc" />
      <line x1="0" y1="-5" x2="0" y2="8" stroke="#f8fafc" stroke-width="2.2" />
      <line x1="-8" y1="-5" x2="8" y2="-5" stroke="#f8fafc" stroke-width="1.6" />
      <text x="0" y="-18" text-anchor="middle" fill="#fef08a" font-size="6" font-weight="900">INRI</text>
    </g>
  </g>

  <!-- 4 Mystery Cycles Legend -->
  <g transform="translate(400, 445)" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">
    <rect x="-240" y="-14" width="480" height="28" rx="7" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="-160" y="4" fill="#6ee7b7">💛 Joyful</text>
    <text x="-50" y="4" fill="#38bdf8">🤍 Luminous</text>
    <text x="55" y="4" fill="#f87171">❤️ Sorrowful</text>
    <text x="160" y="4" fill="#fde047">👑 Glorious</text>
  </g>
</svg>
