<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Trinitarian Sky Gradient -->
    <radialGradient id="creed-sky" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Divine Golden Light -->
    <radialGradient id="trinity-gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.95)" />
      <stop offset="40%" stop-color="rgba(245, 158, 11, 0.6)" />
      <stop offset="100%" stop-color="rgba(180, 83, 9, 0)" />
    </radialGradient>

    <!-- Dove Spirit White Nimbus -->
    <radialGradient id="spirit-nimbus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="50%" stop-color="rgba(191, 219, 254, 0.5)" />
      <stop offset="100%" stop-color="rgba(30, 58, 138, 0)" />
    </radialGradient>

    <!-- Cross Gold Gradient -->
    <linearGradient id="creed-cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="soft-glow-creed" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#creed-sky)" />

  <!-- Heavenly Radiance Lines -->
  <g opacity="0.3">
    <line x1="400" y1="120" x2="80" y2="40" stroke="#facc15" stroke-width="1.5" />
    <line x1="400" y1="120" x2="200" y2="15" stroke="#facc15" stroke-width="1.5" />
    <line x1="400" y1="120" x2="600" y2="15" stroke="#facc15" stroke-width="1.5" />
    <line x1="400" y1="120" x2="720" y2="40" stroke="#facc15" stroke-width="1.5" />
  </g>

  <!-- LEFT: The Father & Creation -->
  <g id="father-creation-panel" transform="translate(170, 220)">
    <circle cx="0" cy="0" r="70" fill="#090d16" stroke="#3b82f6" stroke-width="2" opacity="0.8" />
    
    <!-- Hand of the Creator / Sun and Moon Cosmos -->
    <circle cx="0" cy="-10" r="32" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Radiant Golden Sun -->
    <circle cx="-10" cy="-18" r="10" fill="#facc15" filter="url(#soft-glow-creed)" />
    <!-- Crescent Silver Moon -->
    <path d="M 12,-16 A 8,8 0 0 1 18,-6 A 11,11 0 0 0 12,-16 Z" fill="#e2e8f0" />
    <!-- Mountain and Ocean Horizon -->
    <path d="M -28,12 L -12,-4 L 4,8 L 18,-1 L 28,12 Z" fill="#047857" stroke="#10b981" stroke-width="1" />
    <path d="M -30,12 Q 0,22 30,12 L 30,22 L -30,22 Z" fill="#0284c7" />

    <text x="0" y="80" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold" font-family="sans-serif">
      1. God the Father
    </text>
    <text x="0" y="96" text-anchor="middle" fill="#cbd5e1" font-size="9.5" font-family="sans-serif">
      Creator of Heaven &amp; Earth
    </text>
  </g>

  <!-- CENTER: The Son & Redemption (Crux Gloriosa & Resurrectio) -->
  <g id="son-redemption-panel" transform="translate(400, 180)">
    <!-- Expanding Trinitarian Halo -->
    <circle id="trinity-halo" cx="0" cy="0" r="55" fill="url(#trinity-gold-glow)" opacity="0.6" filter="url(#soft-glow-creed)" />

    <!-- Glorified Cross of the Resurrection -->
    <g id="resurrection-cross-node" cursor="grab">
      <!-- Vertical Beam -->
      <rect x="-8" y="-70" width="16" height="120" rx="4" fill="url(#creed-cross-grad)" stroke="#a16207" stroke-width="2" filter="url(#soft-glow-creed)" />
      <!-- Horizontal Beam -->
      <rect x="-42" y="-45" width="84" height="16" rx="4" fill="url(#creed-cross-grad)" stroke="#a16207" stroke-width="2" />
      
      <!-- Crown of Glory Nimbus at Intersection -->
      <circle cx="0" cy="-37" r="18" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="3 3" />

      <!-- Alpha and Omega -->
      <text id="alpha-omega-glow" x="-28" y="-28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="900" font-family="serif">Α</text>
      <text x="28" y="-28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="900" font-family="serif">Ω</text>
    </g>

    <!-- Empty Tomb Arch with White Stone of Resurrection -->
    <path d="M -50,60 C -50,25 50,25 50,60 Z" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <path d="M -30,60 C -30,38 30,38 30,60 Z" fill="#020617" />
    <!-- Rolled Back Stone -->
    <circle cx="42" cy="52" r="16" fill="#475569" stroke="#94a3b8" stroke-width="1.5" />

    <text x="0" y="85" text-anchor="middle" fill="#fef08a" font-size="13" font-weight="800" font-family="sans-serif">
      2. Jesus Christ, Only Son
    </text>
    <text x="0" y="100" text-anchor="middle" fill="#fde047" font-size="9.5" font-family="sans-serif">
      True God from True God &bull; Risen Lord
    </text>
  </g>

  <!-- RIGHT: The Holy Spirit & The Church (Sanctificatio) -->
  <g id="spirit-church-panel" transform="translate(630, 220)">
    <circle cx="0" cy="0" r="70" fill="#090d16" stroke="#f59e0b" stroke-width="2" opacity="0.8" />

    <!-- Descending Dove of the Holy Spirit -->
    <circle cx="0" cy="-15" r="30" fill="url(#spirit-nimbus)" filter="url(#soft-glow-creed)" />
    <!-- Dove Body and Wings -->
    <path d="M 0,-30 C -12,-30 -22,-20 -28,-14 C -22,-12 -12,-16 -6,-16 L -10,0 L 0,-6 L 10,0 L 6,-16 C 12,-16 22,-12 28,-14 C 22,-20 12,-30 0,-30 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M -2,-8 L 0,6 L 2,-8 Z" fill="#facc15" />

    <!-- 4 Marks of the Church Shields (One, Holy, Catholic, Apostolic) -->
    <g transform="translate(0, 22)">
      <!-- Shield 1: One (Unity) -->
      <circle cx="-30" cy="0" r="9" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
      <text x="-30" y="3" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="bold">ONE</text>
      <!-- Shield 2: Holy (Cross) -->
      <circle cx="-10" cy="0" r="9" fill="#991b1b" stroke="#f87171" stroke-width="1.5" />
      <text x="-10" y="3" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="bold">HOLY</text>
      <!-- Shield 3: Catholic (Global) -->
      <circle cx="10" cy="0" r="9" fill="#15803d" stroke="#4ade80" stroke-width="1.5" />
      <text x="10" y="3" text-anchor="middle" fill="#ffffff" font-size="6" font-weight="bold">CATH</text>
      <!-- Shield 4: Apostolic (Keys) -->
      <circle cx="30" cy="0" r="9" fill="#b45309" stroke="#facc15" stroke-width="1.5" />
      <text x="30" y="3" text-anchor="middle" fill="#ffffff" font-size="6.5" font-weight="bold">APOST</text>
    </g>

    <text x="0" y="80" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="bold" font-family="sans-serif">
      3. Holy Spirit &amp; Church
    </text>
    <text x="0" y="96" text-anchor="middle" fill="#cbd5e1" font-size="9.5" font-family="sans-serif">
      Giver of Life &bull; One, Holy, Catholic, Apostolic
    </text>
  </g>

  <!-- Interactive Trinitarian Creed Dial at Bottom -->
  <g id="creed-dial-container" transform="translate(0, 420)">
    <!-- Selector Track -->
    <rect x="140" y="5" width="520" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Ticks & Labels -->
    <text x="175" y="21" fill="#93c5fd" font-size="11" font-weight="bold" font-family="sans-serif">1. The Father &amp; Creation</text>
    <text x="380" y="21" fill="#fde047" font-size="11" font-weight="bold" font-family="sans-serif">2. The Son &amp; Redemption</text>
    <text x="560" y="21" fill="#fdba74" font-size="11" font-weight="bold" font-family="sans-serif">3. Holy Spirit &amp; Church</text>

    <!-- Draggable Knob -->
    <g id="creed-trinity-slider" cursor="ew-resize" transform="translate(175, 17)">
      <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="2" filter="url(#soft-glow-creed)" />
      <circle cx="0" cy="0" r="6" fill="#1e1b4b" />
    </g>
  </g>
</svg>
