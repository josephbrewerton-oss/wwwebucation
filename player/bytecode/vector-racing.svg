<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="100%" stop-color="#091a13" />
    </linearGradient>
    <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f8fafc" />
      <rect x="6" width="6" height="6" fill="#0f172a" />
      <rect y="6" width="6" height="6" fill="#0f172a" />
      <rect x="6" y="6" width="6" height="6" fill="#f8fafc" />
    </pattern>
  </defs>

  <!-- Outer Grass Backdrop -->
  <rect width="800" height="480" fill="url(#grassGrad)" />

  <!-- Track Kerbs & Asphalt Circuit -->
  <rect x="65" y="45" width="670" height="390" rx="165" fill="none" stroke="#ef4444" stroke-width="86" />
  <rect x="65" y="45" width="670" height="390" rx="165" fill="none" stroke="#f8fafc" stroke-width="86" stroke-dasharray="18 18" />
  <rect x="65" y="45" width="670" height="390" rx="165" fill="none" stroke="#1e293b" stroke-width="76" />
  <rect x="65" y="45" width="670" height="390" rx="165" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="14 14" />

  <!-- Inner Infield -->
  <rect x="145" y="125" width="510" height="230" rx="95" fill="#0b2218" stroke="#334155" stroke-width="2" />

  <!-- Start / Finish Line -->
  <rect x="394" y="357" width="14" height="76" fill="url(#checker)" />

  <!-- Infield Telemetry Display -->
  <g id="infield-hud">
    <text x="400" y="185" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">
      VECTOR GRAND PRIX // AST KINEMATICS
    </text>
    <text id="telemetry-text" x="400" y="212" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="bold">
      0 MPH | HDG 0°
    </text>
    <text x="400" y="234" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">
      Keys: W/S or ↑/↓ Gas & Brake · A/D or ←/→ Steer · Space Boost · R Reset
    </text>
  </g>

  <!-- Declarative On-Canvas Controls (Mouse / Touch) -->
  <g transform="translate(225, 255)">
    <g id="btn-steer-left" style="cursor:pointer">
      <rect x="0" y="0" width="54" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="27" y="23" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" pointer-events="none">◀</text>
    </g>
    <g id="btn-steer-right" transform="translate(62, 0)" style="cursor:pointer">
      <rect x="0" y="0" width="54" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="27" y="23" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" pointer-events="none">▶</text>
    </g>
    <g id="btn-brake" transform="translate(132, 0)" style="cursor:pointer">
      <rect x="0" y="0" width="64" height="36" rx="8" fill="#3f1d2e" stroke="#f43f5e" stroke-width="1.5" />
      <text x="32" y="22" text-anchor="middle" fill="#fda4af" font-family="monospace" font-size="11" font-weight="bold" pointer-events="none">BRAKE</text>
    </g>
    <g id="btn-gas" transform="translate(204, 0)" style="cursor:pointer">
      <rect x="0" y="0" width="64" height="36" rx="8" fill="#133929" stroke="#10b981" stroke-width="1.5" />
      <text x="32" y="22" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold" pointer-events="none">GAS</text>
    </g>
    <g id="btn-boost" transform="translate(276, 0)" style="cursor:pointer">
      <rect x="0" y="0" width="68" height="36" rx="8" fill="#3b2611" stroke="#f59e0b" stroke-width="1.5" />
      <text x="34" y="22" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="11" font-weight="bold" pointer-events="none">BOOST</text>
    </g>
  </g>

  <!-- Player Race Car (Origin 0,0 facing +X right) -->
  <g id="race-car" transform="translate(400, 395) rotate(0)">
    <!-- Afterburner Boost Flame -->
    <polygon id="boost-flame" points="-18,-4 -34,0 -18,4" fill="#f59e0b" opacity="0" />
    <!-- Tires -->
    <rect x="-13" y="-11" width="7" height="3" rx="1" fill="#0f172a" />
    <rect x="6" y="-11" width="7" height="3" rx="1" fill="#0f172a" />
    <rect x="-13" y="8" width="7" height="3" rx="1" fill="#0f172a" />
    <rect x="6" y="8" width="7" height="3" rx="1" fill="#0f172a" />
    <!-- Formula Chassis -->
    <polygon points="-16,-8 14,-6 20,0 14,6 -16,8" fill="#ef4444" stroke="#fca5a5" stroke-width="1" />
    <!-- Rear Wing -->
    <rect x="-18" y="-9" width="4" height="18" rx="1" fill="#991b1b" />
    <!-- Cockpit & Halo -->
    <ellipse cx="1" cy="0" rx="6" ry="3.5" fill="#0f172a" />
    <circle cx="0" cy="0" r="2.2" fill="#facc15" />
    <!-- Front Wing -->
    <rect x="16" y="-8" width="3" height="16" rx="1" fill="#f8fafc" />
  </g>
</svg>