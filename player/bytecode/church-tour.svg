    <line x1="324" y1="290" x2="362" y2="290" stroke="#92400e" stroke-width="1" />
    <rect x="434" y="286" width="46" height="18" rx="3" fill="#451a03" stroke="#78350f" stroke-width="1" />
    <line x1="438" y1="290" x2="476" y2="290" stroke="#92400e" stroke-width="1" />

    <rect x="320" y="322" width="46" height="18" rx="3" fill="#451a03" stroke="#78350f" stroke-width="1" />
    <line x1="324" y1="326" x2="362" y2="326" stroke="#92400e" stroke-width="1" />
    <rect x="434" y="322" width="46" height="18" rx="3" fill="#451a03" stroke="#78350f" stroke-width="1" />
