<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="bodmas-bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Glowing Forcefield Gradient -->
    <linearGradient id="bodmas-clamp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9" />
    </linearGradient>

    <!-- Tile Gradients -->
    <linearGradient id="bodmas-tile-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="bodmas-coin-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="bodmas-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bodmas-bg-glow)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
  </g>

  <!-- Top Title Bar -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="1">
      ORDER OF OPERATIONS: BODMAS / BIDMAS
    </text>
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      The Mathematical Physics of Operator Precedence • Grouping Before Loose Units
    </text>
  </g>

  <!-- Big Central Mathematical Expression Container -->
  <g transform="translate(40, 100)">
    <!-- Dark Card Backing -->
    <rect width="720" height="90" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Term 1: Loose 5 -->
    <g transform="translate(100, 56)">
      <text font-family="system-ui, monospace" font-size="44" font-weight="900" fill="#fbbf24" text-anchor="middle">
        5
      </text>
      <text y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">
        (5 LOOSE UNITS)
      </text>
    </g>

    <!-- Plus Sign -->
    <text x="210" y="60" font-family="system-ui, monospace" font-size="38" font-weight="900" fill="#64748b" text-anchor="middle">
      +
    </text>

    <!-- Term 2: Magnetic Clamping Box around 3 x 4 -->
    <g id="bodmas-clamp" transform="translate(280, 14)">
      <!-- Animated Forcefield Border -->
      <rect id="bodmas-clamp-border" width="260" height="62" rx="12" fill="rgba(6, 182, 212, 0.12)" stroke="url(#bodmas-clamp-grad)" stroke-width="2.5" filter="url(#bodmas-glow)" />
      
      <!-- Expression 3 x 4 -->
      <g id="bodmas-expr-3x4" transform="translate(130, 42)">
        <text font-family="system-ui, monospace" font-size="42" font-weight="900" fill="#38bdf8" text-anchor="middle">
          3 × 4
        </text>
      </g>

      <!-- Evaluated 12 Replacement (Fades in at t >= 0.75) -->
      <g id="bodmas-expr-12" opacity="0" transform="translate(130, 42)">
        <text font-family="system-ui, monospace" font-size="42" font-weight="900" fill="#4ade80" text-anchor="middle">
          12
        </text>
      </g>

      <!-- Forcefield Clamp Label -->
      <text id="bodmas-clamp-label" x="130" y="58" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#06b6d4" letter-spacing="1" text-anchor="middle">
        ♦ HIGH-VOLTAGE MULTIPLICATION CLAMP ♦
      </text>
    </g>

    <!-- Equals Sign -->
    <text x="590" y="60" font-family="system-ui, monospace" font-size="38" font-weight="900" fill="#64748b" text-anchor="middle">
      =
    </text>

    <!-- Result Target Box -->
    <g transform="translate(625, 20)">
      <rect width="80" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <text id="bodmas-result-txt" x="40" y="36" font-family="system-ui, monospace" font-size="28" font-weight="900" fill="#94a3b8" text-anchor="middle">
        ?
      </text>
    </g>
  </g>

  <!-- Lower Visual Concrete Representations (Stage Area) -->
  <g transform="translate(40, 210)">
    
    <!-- Left: 5 Loose Gold Coins -->
    <g transform="translate(50, 20)">
      <text x="45" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle">
        5 Loose Coins
      </text>
      <circle cx="20" cy="30" r="14" fill="url(#bodmas-coin-gold)" stroke="#b45309" stroke-width="1.5" />
      <circle cx="50" cy="30" r="14" fill="url(#bodmas-coin-gold)" stroke="#b45309" stroke-width="1.5" />
      <circle cx="80" cy="30" r="14" fill="url(#bodmas-coin-gold)" stroke="#b45309" stroke-width="1.5" />
      <circle cx="35" cy="65" r="14" fill="url(#bodmas-coin-gold)" stroke="#b45309" stroke-width="1.5" />
      <circle cx="65" cy="65" r="14" fill="url(#bodmas-coin-gold)" stroke="#b45309" stroke-width="1.5" />
      
      <text x="45" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
        Units cannot join a
      </text>
      <text x="45" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
        rectangle halfway!
      </text>
    </g>

    <!-- Center-Right: 3x4 Rectangular Blue Tile Array -->
    <g id="bodmas-area-group" transform="translate(240, 10)">
      <rect width="250" height="190" rx="14" fill="rgba(30, 41, 59, 0.5)" stroke="#1e3a8a" stroke-width="1.5" />
      <text x="125" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">
        3 Rows × 4 Columns = 12 Tiles
      </text>

      <!-- 12 Tiles Grid (3 x 4) -->
      <g transform="translate(35, 40)">
        <!-- Row 1 -->
        <rect x="0" y="0" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
        <rect x="46" y="0" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
        <rect x="92" y="0" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
        <rect x="138" y="0" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />

        <!-- Row 2 -->
        <rect x="0" y="42" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
        <rect x="46" y="42" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
        <rect x="92" y="42" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
        <rect x="138" y="42" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />

        <!-- Row 3 -->
        <rect x="0" y="84" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
        <rect x="46" y="84" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
        <rect x="92" y="84" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
        <rect x="138" y="84" width="38" height="34" rx="6" fill="url(#bodmas-tile-blue)" />
      </g>

      <text x="125" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">
        Solid 2D Area Block (Must Stay Intact)
      </text>
    </g>

    <!-- Right: Cognitive Trap vs Proof Callout Box -->
    <g transform="translate(520, 10)">
      <!-- Trap Card (Visible during middle phase) -->
      <g id="bodmas-trap-card" opacity="0">
        <rect width="200" height="190" rx="14" fill="rgba(153, 27, 27, 0.2)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" />
        <text x="100" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#f87171" text-anchor="middle">
          ⚠️ THE LEFT-TO-RIGHT TRAP
        </text>
        <text x="100" y="56" font-family="system-ui, monospace" font-size="16" font-weight="800" fill="#fca5a5" text-anchor="middle">
          5 + 3 = 8
        </text>
        <text x="100" y="82" font-family="system-ui, monospace" font-size="16" font-weight="800" fill="#fca5a5" text-anchor="middle">
          8 × 4 = 32 ❌
        </text>
        <text x="100" y="118" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fecaca" text-anchor="middle">
          Turning 3 groups into 8
        </text>
        <text x="100" y="134" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fecaca" text-anchor="middle">
          invents 20 extra tiles
        </text>
        <text x="100" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fecaca" text-anchor="middle">
          out of thin air!
        </text>
      </g>

      <!-- Proof Card (Visible at end phase) -->
      <g id="bodmas-proof-card" opacity="0">
        <rect width="200" height="190" rx="14" fill="rgba(22, 101, 52, 0.25)" stroke="#22c55e" stroke-width="2" />
        <text x="100" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#4ade80" text-anchor="middle">
          ✅ THE MATHEMATICAL PROOF
        </text>
        <text x="100" y="60" font-family="system-ui, monospace" font-size="15" font-weight="800" fill="#bbf7d0" text-anchor="middle">
          Clamp 3 × 4 = 12
        </text>
        <text x="100" y="88" font-family="system-ui, monospace" font-size="15" font-weight="800" fill="#bbf7d0" text-anchor="middle">
          Add 5 + 12 = 17
        </text>
        <text x="100" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#86efac" text-anchor="middle">
          12 Area Units
        </text>
        <text x="100" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#86efac" text-anchor="middle">
          + 5 Loose Units = 17
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(40, 430)">
    <rect width="720" height="36" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text id="bodmas-banner-txt" x="360" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">
      BODMAS Rule: Multiplication &amp; Division bind tighter than Addition &amp; Subtraction.
    </text>
  </g>
</svg>
