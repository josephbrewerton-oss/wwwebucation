<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Cosmic Vignette -->
    <radialGradient id="space-bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="65%" stop-color="#030712" />
      <stop offset="100%" stop-color="#010308" />
    </radialGradient>

    <!-- Solar Core &amp; Photosphere Gradient -->
    <radialGradient id="sun-plasma" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>

    <!-- Solar Corona Outer Plasma Halo -->
    <radialGradient id="sun-corona-rad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Intense Solar Flare &amp; Glow Filter -->
    <filter id="solar-flare" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="heavyBlur" />
      <feGaussianBlur stdDeviation="3" result="tightBlur" />
      <feMerge>
        <feMergeNode in="heavyBlur" />
        <feMergeNode in="tightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 3D Planet Mercury: Rocky Silicate Sphere -->
    <radialGradient id="planet-grad-mercury" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="80%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <!-- 3D Planet Venus: Thick Sulfuric Atmosphere -->
    <radialGradient id="planet-grad-venus" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="45%" stop-color="#fde047" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>

    <!-- 3D Planet Earth: Blue Marble Globe -->
    <radialGradient id="planet-grad-earth" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Earth Moon -->
    <radialGradient id="moon-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>

    <!-- 3D Planet Mars: Iron Oxide Rust Red -->
    <radialGradient id="planet-grad-mars" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- 3D Planet Jupiter: Jovian Atmosphere Bands -->
    <radialGradient id="planet-grad-jupiter" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="30%" stop-color="#fed7aa" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="85%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <!-- 3D Planet Saturn: Golden Ringed Gas Giant -->
    <radialGradient id="planet-grad-saturn" cx="36%" cy="34%" r="66%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="90%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#422006" />
    </radialGradient>

    <!-- Saturn Ring Gradient -->
    <linearGradient id="saturn-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Celestial Label Shadow -->
    <filter id="planet-label-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Cosmic Canvas -->
  <rect x="0" y="0" width="800" height="480" fill="url(#space-bg-grad)" />

  <!-- Twinkling Ambient Starfield Particles -->
  <g opacity="0.6">
    <circle cx="85" cy="45" r="1" fill="#ffffff" opacity="0.8" />
    <circle cx="140" cy="115" r="0.8" fill="#93c5fd" opacity="0.6" />
    <circle cx="210" cy="65" r="1.2" fill="#ffffff" opacity="0.9" />
    <circle cx="310" cy="35" r="0.7" fill="#fde047" opacity="0.7" />
    <circle cx="480" cy="40" r="1.1" fill="#ffffff" opacity="0.85" />
    <circle cx="620" cy="70" r="0.8" fill="#93c5fd" opacity="0.6" />
    <circle cx="720" cy="50" r="1.3" fill="#ffffff" opacity="0.9" />
    <circle cx="770" cy="130" r="0.9" fill="#fde047" opacity="0.7" />
    <circle cx="65" cy="220" r="0.7" fill="#ffffff" opacity="0.5" />
    <circle cx="45" cy="380" r="1" fill="#ffffff" opacity="0.8" />
    <circle cx="160" cy="430" r="0.8" fill="#93c5fd" opacity="0.6" />
    <circle cx="280" cy="450" r="1.2" fill="#ffffff" opacity="0.75" />
    <circle cx="510" cy="440" r="0.9" fill="#fde047" opacity="0.8" />
    <circle cx="640" cy="420" r="1.4" fill="#ffffff" opacity="0.9" />
    <circle cx="750" cy="370" r="0.8" fill="#93c5fd" opacity="0.6" />
    <circle cx="780" cy="280" r="1.1" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Central Sun System -->
  <circle id="sun-corona" cx="400" cy="240" r="42" fill="url(#sun-corona-rad)" opacity="0.5" filter="url(#solar-flare)" />
  <circle id="sun-body" cx="400" cy="240" r="26" fill="url(#sun-plasma)" stroke="#ffedd5" stroke-width="1.5" />

  <!-- Dynamic 3D Planetary Orbits (Luminescent Trails) -->
  <path id="orbit-mercury" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.7" />
  <path id="orbit-venus" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.7" />
  <path id="orbit-earth" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5" />
  <path id="orbit-mars" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.7" />
  <path id="orbit-jupiter" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.7" />
  <path id="orbit-saturn" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.7" />

  <!-- Planets (3D Specular Orbs) -->
  <circle id="planet-mercury" cx="455" cy="240" r="5" fill="url(#planet-grad-mercury)" stroke="#cbd5e1" stroke-width="0.5" />
  <text id="label-mercury" x="455" y="258" fill="#e2e8f0" font-size="11" font-weight="700" text-anchor="middle" filter="url(#planet-label-shadow)">Mercury</text>

  <circle id="planet-venus" cx="490" cy="240" r="8" fill="url(#planet-grad-venus)" stroke="#fef08a" stroke-width="0.7" />
  <text id="label-venus" x="490" y="261" fill="#fef08a" font-size="11" font-weight="700" text-anchor="middle" filter="url(#planet-label-shadow)">Venus</text>

  <circle id="planet-earth" cx="535" cy="240" r="9" fill="url(#planet-grad-earth)" stroke="#93c5fd" stroke-width="0.8" />
  <text id="label-earth" x="535" y="262" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle" filter="url(#planet-label-shadow)">Earth</text>
  <circle id="moon-earth" cx="553" cy="240" r="2.5" fill="url(#moon-grad)" stroke="#ffffff" stroke-width="0.4" />

  <circle id="planet-mars" cx="575" cy="240" r="6" fill="url(#planet-grad-mars)" stroke="#fca5a5" stroke-width="0.6" />
  <text id="label-mars" x="575" y="259" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle" filter="url(#planet-label-shadow)">Mars</text>

  <circle id="planet-jupiter" cx="630" cy="240" r="14" fill="url(#planet-grad-jupiter)" stroke="#ea580c" stroke-width="1" />
  <text id="label-jupiter" x="630" y="266" fill="#fed7aa" font-size="11" font-weight="700" text-anchor="middle" filter="url(#planet-label-shadow)">Jupiter</text>

  <path id="saturn-ring" fill="none" stroke="url(#saturn-ring-grad)" stroke-width="3" opacity="0.9" />
  <circle id="planet-saturn" cx="690" cy="240" r="11" fill="url(#planet-grad-saturn)" stroke="#ca8a04" stroke-width="0.8" />
  <text id="label-saturn" x="690" y="264" fill="#fef08a" font-size="11" font-weight="700" text-anchor="middle" filter="url(#planet-label-shadow)">Saturn</text>
</svg>
