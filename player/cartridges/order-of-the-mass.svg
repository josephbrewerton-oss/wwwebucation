<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sanctuary Cathedral Ambient Gradient -->
    <radialGradient id="mass-cathedral-sky" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Divine Host Radiance -->
    <radialGradient id="host-radiance-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.98)" />
      <stop offset="35%" stop-color="rgba(254, 240, 138, 0.85)" />
      <stop offset="70%" stop-color="rgba(245, 158, 11, 0.4)" />
      <stop offset="100%" stop-color="rgba(180, 83, 9, 0)" />
    </radialGradient>

    <!-- Red Sanctuary Lamp Flame -->
    <radialGradient id="sanctuary-lamp-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(248, 113, 113, 0.95)" />
      <stop offset="50%" stop-color="rgba(220, 38, 38, 0.6)" />
      <stop offset="100%" stop-color="rgba(153, 27, 27, 0)" />
    </radialGradient>

    <!-- Golden Chalice Gradient -->
    <linearGradient id="mass-gold-chalice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <filter id="soft-glow-mass" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#mass-cathedral-sky)" />

  <!-- Cathedral Sanctuary Arches & Stained Glass Rosette Silhouette -->
  <g opacity="0.3">
    <circle cx="400" cy="110" r="50" fill="none" stroke="#ca8a04" stroke-width="2" />
    <circle cx="400" cy="110" r="25" fill="none" stroke="#facc15" stroke-width="1.5" />
    <line x1="350" y1="110" x2="450" y2="110" stroke="#facc15" stroke-width="1.5" />
    <line x1="400" y1="60" x2="400" y2="160" stroke="#facc15" stroke-width="1.5" />
    <path d="M 120,400 L 120,200 Q 260,100 400,200 L 400,400 Z" fill="none" stroke="#334155" stroke-width="2" />
    <path d="M 680,400 L 680,200 Q 540,100 400,200 L 400,400 Z" fill="none" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Sanctuary Floor & Altar Steps -->
  <path d="M 80,400 L 720,400 L 760,440 L 40,440 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M 140,370 L 660,370 L 680,400 L 120,400 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />

  <!-- The High Altar Mensa -->
  <rect x="220" y="270" width="360" height="100" rx="4" fill="#475569" stroke="#64748b" stroke-width="2" />
  <rect x="200" y="265" width="400" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="200" y1="285" x2="600" y2="285" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" />

  <!-- TABERNACLE -->
  <g id="sanctuary-tabernacle" transform="translate(400, 220)">
    <rect x="-40" y="-45" width="80" height="90" rx="6" fill="#ca8a04" stroke="#a16207" stroke-width="2" />
    <rect x="-35" y="-38" width="33" height="78" fill="#eab308" stroke="#854d0e" stroke-width="1" />
    <rect x="2" y="-38" width="33" height="78" fill="#eab308" stroke="#854d0e" stroke-width="1" />
    <circle cx="-18" cy="0" r="3" fill="#713f12" />
    <circle cx="18" cy="0" r="3" fill="#713f12" />
    <polygon points="0,-65 -45,-45 45,-45" fill="#a16207" />
    <line x1="0" y1="-65" x2="0" y2="-80" stroke="#facc15" stroke-width="2" />
    <line x1="-6" y1="-74" x2="6" y2="-74" stroke="#facc15" stroke-width="2" />
  </g>

  <!-- RED SANCTUARY LAMP -->
  <g id="sanctuary-lamp" transform="translate(485, 175)">
    <line x1="0" y1="-50" x2="0" y2="0" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="2 3" />
    <path d="M -12,0 L 12,0 L 8,24 L -8,24 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5" />
    <circle id="sanctuary-flame-halo" cx="0" cy="10" r="22" fill="url(#sanctuary-lamp-red)" filter="url(#soft-glow-mass)" />
    <circle cx="0" cy="8" r="4" fill="#fef08a" />
  </g>

  <!-- ALTAR CANDLESTICKS -->
  <g id="altar-candle-left" transform="translate(245, 215)">
    <rect x="-5" y="0" width="10" height="50" fill="#fef08a" stroke="#e2e8f0" stroke-width="1" />
    <path d="M 0,-12 C -4,-6 -3,-2 0,0 C 3,-2 4,-6 0,-12 Z" fill="#facc15" filter="url(#soft-glow-mass)" />
  </g>
  <g id="altar-candle-right" transform="translate(555, 215)">
    <rect x="-5" y="0" width="10" height="50" fill="#fef08a" stroke="#e2e8f0" stroke-width="1" />
    <path d="M 0,-12 C -4,-6 -3,-2 0,0 C 3,-2 4,-6 0,-12 Z" fill="#facc15" filter="url(#soft-glow-mass)" />
  </g>

  <!-- MULTI-SLIDE SCENIC LAYERS -->
  
  <!-- SLIDE 1: Introductory Rites (Asperges / Processional Cross / Missal) -->
  <g id="layer-part-1" opacity="0.0">
    <!-- Processional Cross in Sanctuary -->
    <g transform="translate(310, 210)">
      <line x1="0" y1="0" x2="0" y2="70" stroke="#ca8a04" stroke-width="3" />
      <line x1="-12" y1="18" x2="12" y2="18" stroke="#ca8a04" stroke-width="3" />
      <circle cx="0" cy="18" r="4" fill="#fef08a" />
    </g>
    <!-- Altar Missal Stand -->
    <g transform="translate(470, 248)">
      <polygon points="0,22 30,8 35,16 5,30" fill="#78350f" stroke="#451a03" stroke-width="1.5" />
      <polygon points="5,8 30,-5 35,3 10,16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="18" y="7" fill="#dc2626" font-size="6" font-weight="bold">☩</text>
    </g>
  </g>

  <!-- SLIDE 2: Liturgy of the Word (Ambo / Open Gospel Book of Truth) -->
  <g id="layer-part-2" opacity="0.0">
    <g transform="translate(340, 215)">
      <!-- Ambo Wooden Pulpit -->
      <polygon points="0,65 120,65 110,0 10,0" fill="#451a03" stroke="#292524" stroke-width="2" />
      <!-- Bookrest with Open Lectionary -->
      <rect x="25" y="-15" width="70" height="25" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
      <line x1="60" y1="-15" x2="60" y2="10" stroke="#92400e" stroke-width="1.5" />
      <line x1="30" y1="-7" x2="55" y2="-7" stroke="#1c1917" stroke-width="1" />
      <line x1="30" y1="-2" x2="55" y2="-2" stroke="#1c1917" stroke-width="1" />
      <line x1="65" y1="-7" x2="90" y2="-7" stroke="#1c1917" stroke-width="1" />
      <line x1="65" y1="-2" x2="90" y2="-2" stroke="#1c1917" stroke-width="1" />
    </g>
  </g>

  <!-- SLIDE 3: Liturgy of the Eucharist (Elevation of Consecrated Host & Chalice) -->
  <g id="layer-part-3" opacity="1.0">
    <g id="elevation-host-chalice" transform="translate(400, 160)">
      <circle id="host-divine-radiance" cx="0" cy="-35" r="48" fill="url(#host-radiance-glow)" filter="url(#soft-glow-mass)" />
      <circle cx="0" cy="-35" r="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#soft-glow-mass)" />
      <circle cx="0" cy="-35" r="21" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2" />
      <path d="M 0,-47 L 0,-23 M -8,-39 L 8,-39" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
      <text x="0" y="-27" text-anchor="middle" fill="#92400e" font-size="8" font-weight="bold">IHS</text>
      
