<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sacred Ambience & Gradients -->
    <radialGradient id="communion-sky" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="gold-halo-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(250, 204, 21, 0.95)" />
      <stop offset="60%" stop-color="rgba(217, 119, 6, 0.5)" />
      <stop offset="100%" stop-color="rgba(180, 83, 9, 0)" />
    </radialGradient>

    <linearGradient id="gold-cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="byzantine-mosaic-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="pedestal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#communion-sky)" />

  <!-- Architectural Background: Roman Basilica Arches & Byzantine Domes -->
  <g opacity="0.30">
    <!-- Roman Arch Left -->
    <path d="M 40,400 L 40,220 C 40,160 180,160 180,220 L 180,400 Z" fill="none" stroke="#64748b" stroke-width="3" />
    <path d="M 60,400 L 60,230 C 60,180 160,180 160,230 L 160,400 Z" fill="none" stroke="#475569" stroke-width="1.5" />

    <!-- Byzantine Onion Dome Center-Right -->
    <path d="M 620,400 L 620,240 C 620,180 670,140 700,90 C 730,140 780,180 780,240 L 780,400 Z" fill="none" stroke="#ca8a04" stroke-width="2" />
    <line x1="700" y1="90" x2="700" y2="55" stroke="#facc15" stroke-width="3" />
    <line x1="690" y1="70" x2="710" y2="70" stroke="#facc15" stroke-width="3" />
  </g>

  <!-- Sanctuary Floor Grid -->
  <path d="M 0,395 L 800,395 M 0,425 L 800,425 M 0,455 L 800,455" stroke="#1e293b" stroke-width="1" />
  <path d="M 100,395 L 40,480 M 250,395 L 210,480 M 400,395 L 400,480 M 550,395 L 590,480 M 700,395 L 760,480" stroke="#1e293b" stroke-width="1" />

  <!-- TOP SHOWCASE MARQUEE: Active Liturgical Tradition Display -->
  <g id="rite-showcase-panel" transform="translate(400, 32)">
    <rect x="-290" y="-18" width="580" height="42" rx="21" fill="rgba(15, 23, 42, 0.90)" stroke="#334155" stroke-width="1.5" filter="url(#soft-glow)" />
    <!-- Active Rite Title -->
    <text id="active-rite-title" x="0" y="0" text-anchor="middle" fill="#facc15" font-size="12.5" font-weight="900" font-family="sans-serif">
      1. Western Latin Rite (Roman, Ambrosian, Mozarabic)
    </text>
    <!-- Active Rite Subtitle / Heartland -->
    <text id="active-rite-desc" x="0" y="15" text-anchor="middle" fill="#cbd5e1" font-size="9.5" font-family="sans-serif">
      1 Western Church (&gt;1.3B) &bull; Unleavened Host (Hostia Pura) &bull; Statues &amp; Gregorian Chant
    </text>
  </g>

  <!-- CENTER: The Holy See Cathedra & Communion Beacon (Unity with Peter) -->
  <g id="communion-beacon-group" transform="translate(400, 142)">
    <!-- Expanding Halo Pulse -->
    <circle id="beacon-halo" cx="0" cy="0" r="42" fill="url(#gold-halo-grad)" opacity="0.8" filter="url(#soft-glow)" />
    <circle id="beacon-pulse" cx="0" cy="0" r="68" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.5" />

    <!-- Communion Rays to Shrines -->
    <line id="beacon-ray-left" x1="0" y1="20" x2="-240" y2="120" stroke="#facc15" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" />
    <line id="beacon-ray-right" x1="0" y1="20" x2="240" y2="120" stroke="#facc15" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" />

    <!-- Keys of Saint Peter (Decussate) -->
    <g id="communion-beacon-core" cursor="grab" filter="url(#soft-glow)">
      <!-- Golden Key -->
      <path d="M -16,-16 L 16,16 M 12,12 L 18,6 M 8,16 L 14,10" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="-18" cy="-18" r="6" fill="none" stroke="#facc15" stroke-width="3" />

      <!-- Silver Key -->
      <path d="M 16,-16 L -16,16 M -12,12 L -18,6 M -8,16 L -14,10" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="18" cy="-18" r="6" fill="none" stroke="#e2e8f0" stroke-width="3" />

      <!-- Triple Papal Tiara / Mitre Accent -->
      <path d="M -12,-28 Q 0,-38 12,-28 L 8,-20 Q 0,-24 -8,-20 Z" fill="#eab308" stroke="#ca8a04" stroke-width="1" />
    </g>

    <!-- Beacon Pillar Ray -->
    <line x1="0" y1="20" x2="0" y2="245" stroke="#facc15" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />
    <text x="0" y="38" text-anchor="middle" fill="#fef08a" font-size="11" font-weight="bold" font-family="sans-serif">
      CATHEDRA PETRI
    </text>
    <text x="0" y="52" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="sans-serif">
      One Lord &bull; One Faith &bull; 24 Churches
    </text>
  </g>

  <!-- LEFT PANEL: Western Latin Tradition (Roman Rite, Unleavened Host, Cruciform Basilica) -->
  <g id="western-latin-shrine" transform="translate(160, 260)">
    <!-- Altar Stone Base -->
    <rect x="-115" y="40" width="230" height="92" rx="8" fill="url(#pedestal-grad)" stroke="#475569" stroke-width="2" />
    <rect x="-105" y="45" width="210" height="8" fill="#e2e8f0" />

    <!-- Roman Chalice & Unleavened Host -->
    <path d="M -30,40 Q -30,0 -15,0 Q 0,0 0,40 Z" fill="url(#gold-cross-grad)" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="-18" y="25" width="6" height="15" fill="#ca8a04" />
    <ellipse cx="-15" cy="40" rx="14" ry="4" fill="#a16207" />

    <!-- The Pure White Unleavened Host (Hostia Pura) with IHS -->
    <circle cx="15" cy="15" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#soft-glow)" />
    <text x="15" y="20" text-anchor="middle" fill="#b45309" font-size="12" font-weight="900" font-family="serif">IHS</text>
    <circle cx="15" cy="15" r="20" fill="none" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Latin Tradition Title -->
    <text id="latin-shrine-title" x="0" y="78" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="800" font-family="sans-serif">
      1. Western Latin Rite
    </text>
    <text id="latin-shrine-sub" x="0" y="94" text-anchor="middle" fill="#93c5fd" font-size="9.5" font-family="sans-serif">
      Roman, Ambrosian, Mozarabic
    </text>
    <text id="latin-shrine-desc" x="0" y="110" text-anchor="middle" fill="#cbd5e1" font-size="8.5" font-style="italic" font-family="sans-serif">
      Unleavened Host &bull; Statues &bull; Latin &amp; Vernacular
    </text>
  </g>

  <!-- RIGHT PANEL: Eastern Catholic Traditions (Byzantine, Maronite, Alexandrian, Chaldean, Armenian) -->
  <g id="eastern-byzantine-shrine" transform="translate(640, 260)">
    <!-- Icon Screen (Iconostasis) Pedestal -->
    <rect x="-115" y="40" width="230" height="92" rx="8" fill="url(#pedestal-grad)" stroke="#475569" stroke-width="2" />
    <rect x="-105" y="45" width="210" height="8" fill="#ca8a04" />

    <!-- Holy Icon with Gold Leaf Nimbus (Christ Pantocrator / Theotokos) -->
    <rect id="icon-gold-glow" x="-45" y="-5" width="40" height="48" rx="4" fill="#ca8a04" opacity="0.9" filter="url(#soft-glow)" />
    <rect x="-42" y="-2" width="34" height="42" rx="3" fill="url(#byzantine-mosaic-grad)" stroke="#facc15" stroke-width="1.5" />
    <circle cx="-25" cy="14" r="11" fill="#facc15" opacity="0.8" />
    <path d="M -30,14 C -30,6 -20,6 -20,14 C -20,20 -30,20 -30,14 Z" fill="#991b1b" />
    <text x="-25" y="4" text-anchor="middle" fill="#fef08a" font-size="7" font-weight="bold">IC XC</text>

    <!-- Leavened Prosphora Bread (Seal with IC XC NIKA) -->
    <circle cx="25" cy="15" r="22" fill="#fed7aa" stroke="#d97706" stroke-width="2" filter="url(#soft-glow)" />
    <!-- Square Eucharistic Seal in Bread -->
    <rect x="13" y="3" width="24" height="24" fill="#ffedd5" stroke="#b45309" stroke-width="1" />
    <text x="25" y="14" text-anchor="middle" fill="#9a3412" font-size="8" font-weight="bold">IC XC</text>
    <text x="25" y="24" text-anchor="middle" fill="#9a3412" font-size="8" font-weight="bold">NI KA</text>

    <!-- Eastern Tradition Dynamic Text -->
    <text id="eastern-tradition-title" x="0" y="78" text-anchor="middle" fill="#facc15" font-size="12" font-weight="800" font-family="sans-serif">
      23 Eastern Catholic Churches
    </text>
    <text id="eastern-tradition-sub" x="0" y="94" text-anchor="middle" fill="#fde047" font-size="9.5" font-family="sans-serif">
      Byzantine &bull; Antiochian &bull; Alexandrian
    </text>
    <text id="eastern-tradition-features" x="0" y="110" text-anchor="middle" fill="#cbd5e1" font-size="8.5" font-style="italic" font-family="sans-serif">
      Prosphora (Leaven) &bull; Holy Icons &bull; Liturgical Spoon
    </text>
  </g>

  <!-- Interactive Rite Family Dial at Bottom (Stations: 140, 244, 348, 452, 556, 660) -->
  <g id="rite-selector-container" transform="translate(0, 412)">
    <!-- Header Marquee Label above track -->
    <text x="400" y="-3" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700" letter-spacing="0.06em" font-family="sans-serif">
      SELECT A LITURGICAL TRADITION (CLICK STATION OR DRAG SLIDER KNOB)
    </text>

    <!-- Selector Track -->
    <rect x="90" y="6" width="620" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Station 1: Roman (x=140) -->
    <g id="station-1-btn" cursor="pointer">
      <rect id="tick-1-pill" x="100" y="8" width="80" height="20" rx="10" fill="#2563eb" opacity="0.9" />
      <text id="tick-1-text" x="140" y="22" text-anchor="middle" fill="#fef08a" font-size="10" font-weight="bold" font-family="sans-serif">1. Roman</text>
    </g>

    <!-- Station 2: Byzantine (x=244) -->
    <g id="station-2-btn" cursor="pointer">
      <rect id="tick-2-pill" x="198" y="8" width="92" height="20" rx="10" fill="#d97706" opacity="0.0" />
      <text id="tick-2-text" x="244" y="22" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold" font-family="sans-serif">2. Byzantine</text>
    </g>

    <!-- Station 3: Alexandrian (x=348) -->
    <g id="station-3-btn" cursor="pointer">
      <rect id="tick-3-pill" x="300" y="8" width="96" height="20" rx="10" fill="#059669" opacity="0.0" />
      <text id="tick-3-text" x="348" y="22" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold" font-family="sans-serif">3. Alexandrian</text>
    </g>

    <!-- Station 4: Antiochian (x=452) -->
    <g id="station-4-btn" cursor="pointer">
      <rect id="tick-4-pill" x="406" y="8" width="92" height="20" rx="10" fill="#dc2626" opacity="0.0" />
      <text id="tick-4-text" x="452" y="22" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold" font-family="sans-serif">4. Antiochian</text>
    </g>

    <!-- Station 5: Chaldean (x=556) -->
    <g id="station-5-btn" cursor="pointer">
      <rect id="tick-5-pill" x="510" y="8" width="92" height="20" rx="10" fill="#7c3aed" opacity="0.0" />
      <text id="tick-5-text" x="556" y="22" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold" font-family="sans-serif">5. Chaldean</text>
    </g>

    <!-- Station 6: Armenian (x=660) -->
    <g id="station-6-btn" cursor="pointer">
      <rect id="tick-6-pill" x="614" y="8" width="92" height="20" rx="10" fill="#ea580c" opacity="0.0" />
      <text id="tick-6-text" x="660" y="22" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold" font-family="sans-serif">6. Armenian</text>
    </g>

    <!-- Draggable Knob (x starts at 140) -->
    <g id="rite-selector-knob" cursor="ew-resize" transform="translate(140, 18)">
      <circle cx="0" cy="0" r="15" fill="#facc15" stroke="#ca8a04" stroke-width="2.5" filter="url(#soft-glow)" />
      <circle cx="0" cy="0" r="6" fill="#1e1b4b" />
      <path d="M -3,0 L 3,0 M 0,-3 L 0,3" stroke="#facc15" stroke-width="1.5" />
    </g>
  </g>
</svg>
