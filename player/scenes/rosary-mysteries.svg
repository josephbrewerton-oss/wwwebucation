<svg xmlns="http://www.w3.org/2000/svg" viewBox="-240 -160 480 320" width="100%" height="100%">
  <defs>
    <radialGradient id="rosary-bg-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="gold-bead-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
    <radialGradient id="sapphire-bead-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
    <radialGradient id="halo-pulse-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="rosary-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Sacred Blue Background -->
  <rect x="-240" y="-160" width="480" height="320" fill="url(#rosary-bg-glow)" />

  <!-- Title Ribbon -->
  <g transform="translate(0, -135)">
    <rect x="-200" y="-12" width="400" height="24" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1" />
    <text id="rosary-prayer-status" x="0" y="4" text-anchor="middle" fill="#fde047" font-size="10" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="0.5">
      CRUCIFIX: Credo in Deum (Apostles' Creed)
    </text>
  </g>

  <!-- 3D Bead Circle (Chaplet Decades) -->
  <g id="rosary-3d-root" transform="translate(0, -20)">
    <!-- Base Ellipse Thread -->
    <ellipse id="rosary-ring" cx="0" cy="0" rx="130" ry="55" fill="none" stroke="rgba(234, 179, 8, 0.35)" stroke-width="2" />

    <!-- 10 Decade Beads (Sapphire Marian Beads) -->
    <g id="decade-beads">
      <!-- 50 beads around circle, represented in sample clusters -->
      <circle cx="-130" cy="0" r="7" fill="url(#gold-bead-grad)" />
      <circle cx="-120" cy="-20" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="-100" cy="-36" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="-75" cy="-48" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="-45" cy="-53" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="-15" cy="-55" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="15" cy="-55" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="45" cy="-53" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="75" cy="-48" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="100" cy="-36" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="120" cy="-20" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="130" cy="0" r="7" fill="url(#gold-bead-grad)" />
      <circle cx="120" cy="20" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="100" cy="36" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="75" cy="48" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="45" cy="53" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="-45" cy="53" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="-75" cy="48" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="-100" cy="36" r="6" fill="url(#sapphire-bead-grad)" />
      <circle cx="-120" cy="20" r="6" fill="url(#sapphire-bead-grad)" />
    </g>

    <!-- Active Contemplative Bead Halo Glow -->
    <circle id="active-bead-halo" cx="0" cy="55" r="18" fill="url(#halo-pulse-grad)" opacity="0.85" pointer-events="none" />

    <!-- Centerpiece Miraculous Medal -->
    <g id="centerpiece-medal" transform="translate(0, 55)">
      <circle cx="0" cy="0" r="10" fill="url(#gold-bead-grad)" stroke="#ca8a04" stroke-width="1.5" />
      <text x="0" y="3" text-anchor="middle" fill="#0f172a" font-size="6" font-weight="900">M</text>
    </g>

    <!-- Pendent Strand Leading to Crucifix -->
    <line id="pendent-line" x1="0" y1="65" x2="0" y2="130" stroke="#ca8a04" stroke-width="2" />
    <circle id="our-father-pendent" cx="0" cy="80" r="6.5" fill="url(#gold-bead-grad)" />
    <circle cx="0" cy="95" r="5" fill="url(#sapphire-bead-grad)" />
    <circle cx="0" cy="107" r="5" fill="url(#sapphire-bead-grad)" />
    <circle cx="0" cy="119" r="5" fill="url(#sapphire-bead-grad)" />

    <!-- Crucifix -->
    <g id="crucifix-node" transform="translate(0, 142)" filter="url(#rosary-glow)">
      <!-- Cross Beams -->
      <line x1="0" y1="-14" x2="0" y2="18" stroke="#ca8a04" stroke-width="5" stroke-linecap="square" />
      <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#ca8a04" stroke-width="5" stroke-linecap="square" />
      <!-- Silver Corpus of Christ -->
      <circle cx="0" cy="-6" r="2.5" fill="#f8fafc" />
      <line x1="0" y1="-4" x2="0" y2="6" stroke="#f8fafc" stroke-width="2" />
      <line x1="-7" y1="-4" x2="7" y2="-4" stroke="#f8fafc" stroke-width="1.5" />
      <text x="0" y="-16" text-anchor="middle" fill="#fef08a" font-size="5" font-weight="900">INRI</text>
    </g>
  </g>

  <!-- 4 Mystery Cycles Legend -->
  <g transform="translate(0, 138)" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">
    <rect x="-210" y="-12" width="420" height="24" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="-140" y="3" fill="#6ee7b7">💛 Joyful</text>
    <text x="-45" y="3" fill="#38bdf8">🤍 Luminous</text>
    <text x="50" y="3" fill="#f87171">❤️ Sorrowful</text>
    <text x="145" y="3" fill="#fde047">👑 Glorious</text>
  </g>
</svg>
