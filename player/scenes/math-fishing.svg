<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Sky & Water Gradients -->
    <linearGradient id="fish-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="fish-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.88" />
      <stop offset="30%" stop-color="#0369a1" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#075985" />
      <stop offset="100%" stop-color="#09182d" />
    </linearGradient>
    <linearGradient id="fish-bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="40%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="bank-soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Species Colors -->
    <linearGradient id="fish-clown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="fish-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="fish-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="fish-coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="fish-emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="fish-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Bucket Metallic -->
    <linearGradient id="bucket-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="pond-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky & Horizon -->
  <rect x="0" y="0" width="800" height="150" fill="url(#fish-sky)" />
  <circle cx="730" cy="45" r="26" fill="#fef08a" opacity="0.85" filter="url(#pond-glow)" />
  <path d="M 660,40 Q 675,25 695,30 Q 715,22 730,35 Q 745,30 755,42 L 655,42 Z" fill="#ffffff" opacity="0.6" />
  <path d="M 520,30 Q 535,18 550,22 Q 568,14 580,26 Q 595,20 605,32 L 515,32 Z" fill="#ffffff" opacity="0.45" />

  <!-- Rolling Hills Background -->
  <path d="M 0,150 L 120,95 L 260,150 L 410,105 L 560,150 L 710,90 L 800,150 Z" fill="#0369a1" opacity="0.35" />
  <path d="M 0,150 L 190,115 L 350,150 L 490,120 L 660,150 L 800,125 Z" fill="#0284c7" opacity="0.55" />

  <!-- Grassy Fishing Bank & Soil Edge -->
  <path d="M 0,128 Q 220,146 400,140 T 800,135 L 800,165 L 0,165 Z" fill="url(#bank-soil)" opacity="0.6" />
  <path d="M 0,118 Q 220,138 400,132 T 800,128 L 800,156 L 0,156 Z" fill="url(#fish-bank)" />

  <!-- Grassy Flowers & Detail on Bank -->
  <circle cx="165" cy="132" r="3" fill="#fef08a" />
  <circle cx="175" cy="130" r="2.5" fill="#f472b6" />
  <circle cx="210" cy="134" r="3" fill="#ffffff" />
  <circle cx="340" cy="132" r="2.5" fill="#fef08a" />

  <!-- Water Surface & Deep Pond Layer -->
  <rect x="0" y="150" width="800" height="330" fill="url(#fish-water)" />

  <!-- Sun Rays Caustics into Pond -->
  <polygon points="680,150 780,150 720,480 620,480" fill="#38bdf8" opacity="0.06" />
  <polygon points="560,150 640,150 540,480 470,480" fill="#38bdf8" opacity="0.05" />
  <polygon points="420,150 500,150 380,480 320,480" fill="#38bdf8" opacity="0.04" />

  <!-- Dynamic Waves -->
  <path id="water-wave-1" d="M 0,155 Q 100,150 200,155 T 400,155 T 600,155 T 800,155" fill="none" stroke="#bae6fd" stroke-width="2.5" opacity="0.75" />
  <path id="water-wave-2" d="M 0,165 Q 150,160 300,165 T 600,165 T 800,165" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.5" />

  <!-- Reeds & Water Lilies -->
  <g id="pond-reeds">
    <path d="M 40,480 Q 60,360 50,300 Q 40,240 55,180" fill="none" stroke="#059669" stroke-width="6" opacity="0.7" stroke-linecap="round" />
    <path d="M 70,480 Q 90,380 75,310 Q 60,240 80,200" fill="none" stroke="#10b981" stroke-width="5" opacity="0.6" stroke-linecap="round" />
    <path d="M 730,480 Q 710,370 735,290 Q 750,220 720,180" fill="none" stroke="#059669" stroke-width="6" opacity="0.7" stroke-linecap="round" />
    <path d="M 760,480 Q 745,390 765,320 Q 775,250 750,210" fill="none" stroke="#10b981" stroke-width="5" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Lily Pads with Water Ripples -->
  <g id="lilypad-left" transform="translate(140, 162)">
    <ellipse cx="0" cy="0" rx="36" ry="10" fill="#15803d" stroke="#22c55e" stroke-width="1.5" opacity="0.9" />
    <path d="M 0,0 L 26,-7" stroke="#14532d" stroke-width="2" />
    <circle cx="10" cy="-3" r="4" fill="#fb7185" />
  </g>
  <g id="lilypad-right" transform="translate(680, 166)">
    <ellipse cx="0" cy="0" rx="42" ry="12" fill="#15803d" stroke="#22c55e" stroke-width="1.5" opacity="0.9" />
    <path d="M 0,0 L -30,-8" stroke="#14532d" stroke-width="2" />
    <circle cx="-12" cy="-4" r="5" fill="#f43f5e" />
  </g>

  <!-- Floating Air Bubbles Container -->
  <g id="pond-bubbles-group"></g>

  <!-- Group for Animated Swimming Fish School -->
  <g id="fish-school-group"></g>

  <!-- Water Splash / Ripple Particle Layer -->
  <g id="pond-fx-layer"></g>

  <!-- Angler Tackle Bucket & Star Badge on Grassy Bank (Left) -->
  <g id="tackle-bucket-group" transform="translate(24, 86)">
    <!-- Wooden Deck / Mud patch -->
    <ellipse cx="50" cy="56" rx="44" ry="10" fill="#78350f" opacity="0.4" />

    <!-- Metal Tackle Bucket -->
    <g id="tackle-bucket" style="cursor: pointer;" data-action="pond-release">
      <path d="M 22,28 L 30,58 Q 50,62 70,58 L 78,28 Q 50,24 22,28 Z" fill="url(#bucket-grad)" stroke="#334155" stroke-width="1.5" />
      <ellipse cx="50" cy="28" rx="28" ry="6" fill="#0284c7" stroke="#475569" stroke-width="1.5" />
      <!-- Copper bands -->
      <path d="M 25,38 Q 50,42 75,38" fill="none" stroke="#d97706" stroke-width="2" />
      <path d="M 28,48 Q 50,52 72,48" fill="none" stroke="#d97706" stroke-width="2" />
      <!-- Handle -->
      <path d="M 20,28 Q 50,6 80,28" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      <!-- Fish tail peeking out -->
      <polygon id="bucket-fish-tail" points="46,24 40,12 52,14" fill="#fb923c" />
      <polygon id="bucket-fish-tail-2" points="56,25 64,13 52,17" fill="#38bdf8" />
    </g>

    <!-- Score & Streak Plaque -->
    <rect x="0" y="66" width="100" height="26" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <text x="50" y="77" fill="#facc15" font-size="9" font-weight="900" text-anchor="middle">⭐ BONDS: <tspan id="score-bonds-count">0</tspan></text>
    <text id="score-streak-text" x="50" y="88" fill="#38bdf8" font-size="8" font-weight="700" text-anchor="middle">Streak: 0 🔥</text>
  </g>

  <!-- Quick Target Preset Chips on Bank (Bank Center-Left) -->
  <g id="target-presets-dock" transform="translate(132, 82)">
    <rect x="0" y="0" width="105" height="48" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="52" y="12" fill="#94a3b8" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="0.5">TARGET PRESET</text>
    <!-- Buttons -->
    <g class="pond-preset-btn" data-action="pond-target-10" style="cursor: pointer;" transform="translate(6, 17)">
      <rect width="28" height="18" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="12" fill="#ffffff" font-size="9" font-weight="900" text-anchor="middle">10</text>
    </g>
    <g class="pond-preset-btn" data-action="pond-target-20" style="cursor: pointer;" transform="translate(38, 17)">
      <rect width="28" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="12" fill="#94a3b8" font-size="9" font-weight="900" text-anchor="middle">20</text>
    </g>
    <g class="pond-preset-btn" data-action="pond-target-5" style="cursor: pointer;" transform="translate(70, 17)">
      <rect width="28" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="12" fill="#94a3b8" font-size="9" font-weight="900" text-anchor="middle">5</text>
    </g>
    <!-- Restock Pond Chip -->
    <g class="pond-preset-btn" data-action="pond-restock" style="cursor: pointer;" transform="translate(6, 37)">
      <text x="46" y="7" fill="#38bdf8" font-size="7.5" font-weight="700" text-anchor="middle">🔄 Restock Pond</text>
    </g>
  </g>

  <!-- Math Equation & Ten-Frame Master HUD Board -->
  <g id="math-hud" transform="translate(244, 12)">
    <!-- Slate Backdrop -->
    <rect x="0" y="0" width="542" height="78" rx="12" fill="#0f172a" fill-opacity="0.94" stroke="#0284c7" stroke-width="2" />

    <!-- Title Badge -->
    <rect x="180" y="4" width="182" height="15" rx="4" fill="#0369a1" fill-opacity="0.6" />
    <text id="math-hud-title" x="271" y="15" fill="#bae6fd" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">NUMBER BONDS TARGET: 10</text>

    <!-- Equation Line -->
    <text id="math-hud-equation" x="271" y="36" fill="#38bdf8" font-size="17" font-weight="900" text-anchor="middle">Catch fish to make 10! (e.g. 4 + 6 = 10)</text>

    <!-- Pedagogical Ten-Frame / Twenty-Frame Container -->
    <g id="ten-frame-group" transform="translate(26, 44)">
      <!-- Rendered dynamically by ast-gestures.js with ten-frame slots -->
    </g>
  </g>

  <!-- Angler Fishing Rod & Tackle Line -->
  <g id="fishing-rod-group">
    <!-- Flexible Wooden Rod anchored on grassy bank -->
    <path id="fishing-rod" d="M 330,126 Q 370,80 440,55" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" />
    <!-- Fishing Line -->
    <line id="fishing-line" x1="440" y1="55" x2="440" y2="240" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 2" />

    <!-- Bobber Float at Waterline -->
    <g id="fishing-bobber-rig" transform="translate(440, 155)">
      <ellipse cx="0" cy="0" rx="9" ry="4" fill="#0369a1" opacity="0.4" />
      <circle id="fishing-bobber" cx="0" cy="0" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1" />
      <path d="M -7,0 A 7 7 0 0 0 7,0 Z" fill="#ffffff" />
    </g>

    <!-- Submerged Hook & Lure Assembly -->
    <g id="fishing-hook" transform="translate(440, 240)" style="cursor: grab;">
      <!-- Glowing Target Aura -->
      <circle cx="0" cy="0" r="18" fill="#38bdf8" opacity="0.15" filter="url(#pond-glow)" />
      <!-- Bobber sinker -->
      <circle cx="0" cy="-6" r="4" fill="#94a3b8" />
      <!-- Steel Hook Barb -->
      <path d="M 0,-6 L 0,8 A 7 7 0 0 0 12,8 L 12,3" fill="none" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" />
      <!-- Bait worm -->
      <path d="M 11,5 Q 15,9 12,13" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
      <!-- Direct Release Button (Appears when fish is hooked) -->
      <g id="hook-release-btn" transform="translate(18, -14)" display="none" style="cursor: pointer;">
        <rect width="52" height="16" rx="4" fill="#0f172a" fill-opacity="0.9" stroke="#ef4444" stroke-width="1" />
        <text x="26" y="11" fill="#fca5a5" font-size="8" font-weight="800" text-anchor="middle">✕ Release</text>
      </g>
    </g>
  </g>
</svg>
