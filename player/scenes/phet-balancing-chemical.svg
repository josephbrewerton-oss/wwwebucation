<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <rect width="800" height="480" fill="#090d16"/>
  <text x="400" y="40" fill="#f8fafc" font-size="21" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
    PhET Distilled: Balancing Chemical Equations
  </text>
  <text x="400" y="64" fill="#94a3b8" font-size="12.5" text-anchor="middle" font-family="system-ui, sans-serif">
    Click Cards or Use Sliders/Arrow Keys to Balance Stoichiometric Coefficients
  </text>

  <!-- Left Pan (Reactants) -->
  <g id="reactants-card" transform="translate(80, 136)" style="cursor: pointer;"
     data-pedagogical="chem-reactants"
     data-pedagogical-title="Reactant Molecules (Left Side)"
     data-pedagogical-eq="Coefficients multiply whole molecules (e.g. 2 H₂ = 4 H atoms)"
     data-pedagogical-desc="Chemical reactions break covalent bonds in diatomic H₂ and O₂ reactants to rearrange existing atoms without creating or destroying mass.">
    <rect width="260" height="176" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="130" y="30" fill="#93c5fd" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.8">REACTANTS (CLICK TO STEP H₂)</text>
    <text id="reactant-eq-txt" x="130" y="80" fill="#f8fafc" font-size="26" font-weight="900" text-anchor="middle" font-family="monospace">2 H₂ + 1 O₂</text>
    <text id="reactant-atoms-txt" x="130" y="122" fill="#60a5fa" font-size="13.5" font-weight="800" text-anchor="middle">4 Hydrogen • 2 Oxygen</text>
    <text x="130" y="152" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">↑/↓ Adjust H₂  •  Space Steps O₂</text>
  </g>

  <!-- Equal / Yield Arrow -->
  <g transform="translate(366, 202)">
    <path id="balance-arrow" d="M 0 10 L 42 10 L 42 0 L 68 15 L 42 30 L 42 20 L 0 20 Z" fill="#22c55e"/>
    <text id="balance-status-txt" x="34" y="54" fill="#4ade80" font-size="11.5" font-weight="900" text-anchor="middle">BALANCED ✓</text>
  </g>

  <!-- Right Pan (Products) -->
  <g id="products-card" transform="translate(460, 136)" style="cursor: pointer;"
     data-pedagogical="chem-products"
     data-pedagogical-title="Product Molecules (Right Side)"
     data-pedagogical-eq="Antoine Lavoisier's Law: Σ m_reactants = Σ m_products"
     data-pedagogical-desc="Never change chemical subscripts (H₂O ≠ H₂O₂); only adjust stoichiometric coefficients in front of formulas!">
    <rect id="products-border" width="260" height="176" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="130" y="30" fill="#86efac" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.8">PRODUCTS (CLICK TO STEP H₂O)</text>
    <text id="product-eq-txt" x="130" y="80" fill="#f8fafc" font-size="26" font-weight="900" text-anchor="middle" font-family="monospace">2 H₂O</text>
    <text id="product-atoms-txt" x="130" y="122" fill="#4ade80" font-size="13.5" font-weight="800" text-anchor="middle">4 Hydrogen • 2 Oxygen</text>
    <text x="130" y="152" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">←/→ Adjust H₂O Coefficient</text>
  </g>

  <rect id="balance-banner-rect" x="140" y="376" width="520" height="50" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.8"/>
  <text id="balance-banner-txt" x="400" y="407" fill="#4ade80" font-size="14.5" font-weight="800" text-anchor="middle" font-family="monospace">
    Conservation Verified: 4 H &amp; 2 O (Left) = 4 H &amp; 2 O (Right)
  </text>
</svg>