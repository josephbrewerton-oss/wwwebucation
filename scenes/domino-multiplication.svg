<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Lighting & Table Gradients -->
    <linearGradient id="track-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="domino-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="domino-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Master Reusable Domino Vector (Group template) -->
    <g id="single-domino">
      <!-- Shadow projection -->
      <ellipse cx="6" cy="72" rx="14" ry="4" fill="#000000" opacity="0.45" />
      <!-- Side depth -->
      <polygon points="12,0 16,-4 16,66 12,70" fill="url(#domino-side)" />
      <!-- Top depth -->
      <polygon points="0,0 12,0 16,-4 4,-4" fill="#7dd3fc" />
      <!-- Front face -->
      <rect x="0" y="0" width="12" height="70" rx="2" fill="url(#domino-body)" stroke="#bae6fd" stroke-width="0.75" />
      <line x1="2" y1="35" x2="10" y2="35" stroke="#0284c7" stroke-width="1" />
      <!-- Dice dots (Pips) -->
      <circle cx="6" cy="18" r="1.5" fill="#ffffff" />
      <circle cx="6" cy="52" r="1.5" fill="#ffffff" />
    </g>
  </defs>

  <!-- Stage Backdrop -->
  <rect width="800" height="500" fill="#020617" />

  <!-- 3D Perspective Floor Track -->
  <polygon points="180,140 620,140 760,440 40,440" fill="url(#track-surface)" stroke="#334155" stroke-width="1.5" />

  <!-- Perspective Track Dividing Guide Marks -->
  <line x1="180" y1="140" x2="40" y2="440" stroke="#38bdf8" stroke-dasharray="4,8" opacity="0.25" />
  <line x1="620" y1="140" x2="760" y2="440" stroke="#38bdf8" stroke-dasharray="4,8" opacity="0.25" />
  <line x1="400" y1="140" x2="400" y2="440" stroke="#64748b" stroke-dasharray="2,6" opacity="0.15" />

  <!-- Mechanical Starting Pusher Lever -->
  <g id="release-trigger-lever" transform="rotate(0, 110, 370)" style="cursor: pointer;">
    <rect x="95" y="360" width="30" height="20" rx="4" fill="#334155" stroke="#64748b" />
    <circle cx="110" cy="370" r="10" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
    <line x1="110" y1="370" x2="135" y2="340" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
    <circle cx="135" cy="340" r="7" fill="#ef4444" />
  </g>

  <!-- ================= FACTOR CLUSTERS ================= -->
  <!-- Cluster 1 -->
  <g id="cluster-1" transform="translate(140, 310)">
    <use href="#single-domino" x="0" y="0" id="domino-1-1" transform="rotate(0, 6, 70)" />
    <use href="#single-domino" x="18" y="0" id="domino-1-2" transform="rotate(0, 24, 70)" />
    <use href="#single-domino" x="36" y="0" id="domino-1-3" transform="rotate(0, 42, 70)" />
    <use href="#single-domino" x="54" y="0" id="domino-1-4" transform="rotate(0, 60, 70)" />
    <use href="#single-domino" x="72" y="0" id="domino-1-5" transform="rotate(0, 78, 70)" />
    <use href="#single-domino" x="90" y="0" id="domino-1-6" transform="rotate(0, 96, 70)" />
    <text x="50" y="92" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle" opacity="0.7">Group 1 (6)</text>
  </g>

  <!-- Cluster 2 -->
  <g id="cluster-2" transform="translate(270, 260)">
    <use href="#single-domino" x="0" y="0" id="domino-2-1" transform="rotate(0, 6, 70)" />
    <use href="#single-domino" x="16" y="0" id="domino-2-2" transform="rotate(0, 22, 70)" />
    <use href="#single-domino" x="32" y="0" id="domino-2-3" transform="rotate(0, 38, 70)" />
    <use href="#single-domino" x="48" y="0" id="domino-2-4" transform="rotate(0, 54, 70)" />
    <use href="#single-domino" x="64" y="0" id="domino-2-5" transform="rotate(0, 70, 70)" />
    <use href="#single-domino" x="80" y="0" id="domino-2-6" transform="rotate(0, 86, 70)" />
    <text x="45" y="88" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle" opacity="0.7">Group 2 (12)</text>
  </g>

  <!-- Cluster 3 -->
  <g id="cluster-3" transform="translate(390, 215)">
    <use href="#single-domino" x="0" y="0" id="domino-3-1" transform="rotate(0, 6, 70)" />
    <use href="#single-domino" x="14" y="0" id="domino-3-2" transform="rotate(0, 20, 70)" />
    <use href="#single-domino" x="28" y="0" id="domino-3-3" transform="rotate(0, 34, 70)" />
    <use href="#single-domino" x="42" y="0" id="domino-3-4" transform="rotate(0, 48, 70)" />
    <use href="#single-domino" x="56" y="0" id="domino-3-5" transform="rotate(0, 62, 70)" />
    <use href="#single-domino" x="70" y="0" id="domino-3-6" transform="rotate(0, 76, 70)" />
    <text x="40" y="84" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle" opacity="0.7">Group 3 (18)</text>
  </g>

  <!-- Cluster 4 -->
  <g id="cluster-4" transform="translate(495, 175)">
    <use href="#single-domino" x="0" y="0" id="domino-4-1" transform="rotate(0, 6, 70)" />
    <use href="#single-domino" x="12" y="0" id="domino-4-2" transform="rotate(0, 18, 70)" />
    <use href="#single-domino" x="24" y="0" id="domino-4-3" transform="rotate(0, 30, 70)" />
    <use href="#single-domino" x="36" y="0" id="domino-4-4" transform="rotate(0, 42, 70)" />
    <use href="#single-domino" x="48" y="0" id="domino-4-5" transform="rotate(0, 54, 70)" />
    <use href="#single-domino" x="60" y="0" id="domino-4-6" transform="rotate(0, 66, 70)" />
    <text x="35" y="80" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle" opacity="0.7">Group 4 (24)</text>
  </g>

  <!-- Mechanical Finish Bell -->
  <g id="finish-bell" transform="translate(640, 160)">
    <path d="M 0,40 C 0,10 40,10 40,40 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2" />
    <circle cx="20" cy="42" r="5" fill="#a16207" />
    <rect x="18" y="4" width="4" height="12" fill="#713f12" />
  </g>

  <!-- Realtime Heads-Up Display (Mathematical Counter) -->
  <g id="hud-panel" transform="translate(250, 20)">
    <rect width="300" height="60" rx="8" fill="#0f172a" opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    <text id="math-display" x="150" y="38" fill="#38bdf8" font-size="20" font-weight="bold" font-family="monospace" text-anchor="middle">
      6 × 4 = 24
    </text>
    <text id="cadence-status" x="150" y="52" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">
      Cascading Momentum: 0 Fallen
    </text>
  </g>
</svg>
