<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="phonics-bg-grad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="1" />
    </radialGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Forest Background -->
  <rect width="800" height="480" fill="url(#phonics-bg-grad)" />

  <!-- DfE Status Ribbon -->
  <g transform="translate(400, 48)">
    <rect x="-260" y="-16" width="520" height="32" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#34d399" font-size="12" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="0.5">
      DfE STATUTORY YEAR 1 PHONICS SCREENING CHECK (40 WORDS &bull; 32 PASS THRESHOLD)
    </text>
  </g>

  <!-- Alien Word Monster Card -->
  <g id="alien-monster-badge" transform="translate(190, 230)" filter="url(#card-shadow)">
    <rect x="-65" y="-85" width="130" height="170" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
    <!-- Friendly Monster SVG Graphic -->
    <circle cx="0" cy="-25" r="34" fill="#10b981" />
    <!-- Horns -->
    <path d="M-20,-48 Q-34,-70 -14,-60 Z" fill="#34d399" />
    <path d="M20,-48 Q34,-70 14,-60 Z" fill="#34d399" />
    <!-- Single Eyeball -->
    <circle cx="0" cy="-29" r="14" fill="#ffffff" />
    <circle cx="3" cy="-29" r="5.5" fill="#0f172a" />
    <circle cx="6" cy="-31" r="2.2" fill="#ffffff" />
    <!-- Smile -->
    <path d="M-11,-10 Q0,4 11,-10" fill="none" stroke="#064e3b" stroke-width="3" stroke-linecap="round" />
    <!-- Body text -->
    <text x="0" y="34" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="900" font-family="system-ui, sans-serif">
      ALIEN WORD
    </text>
    <text x="0" y="56" text-anchor="middle" fill="#6ee7b7" font-size="10.5" font-family="system-ui, sans-serif">
      Pure Decoding
    </text>
  </g>

  <!-- Central Flashcard Stage -->
  <g id="main-flashcard" transform="translate(500, 230)" filter="url(#card-shadow)">
    <!-- Whiteboard Flashcard Slab -->
    <rect x="-210" y="-110" width="420" height="220" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="3.5" />

    <!-- Word Category Banner -->
    <rect x="-210" y="-110" width="420" height="40" rx="18" fill="#f1f5f9" />
    <text id="word-type-tag" x="0" y="-84" text-anchor="middle" fill="#047857" font-size="13.5" font-weight="900" font-family="system-ui, sans-serif">
      👾 PSEUDO / ALIEN WORD
    </text>

    <!-- Large Bold Grapheme Text -->
    <text id="current-word-display" x="0" y="12" text-anchor="middle" fill="#0f172a" font-size="62" font-weight="900" font-family="'Comic Sans MS', 'Chalkboard', system-ui, sans-serif" letter-spacing="18">
      v  a  p
    </text>

    <!-- Tactile Sound Buttons Row -->
    <g id="sound-buttons-row" transform="translate(0, 50)">
      <!-- Sound Button Dot 1 -->
      <circle id="sound-dot-1" cx="-95" cy="0" r="12" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5" />
      <!-- Sound Button Dot 2 -->
      <circle id="sound-dot-2" cx="0" cy="0" r="12" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5" />
      <!-- Sound Button Dot 3 -->
      <circle id="sound-dot-3" cx="95" cy="0" r="12" fill="#38bdf8" stroke="#0284c7" stroke-width="2.5" />
    </g>

    <!-- Left-to-Right Blending Sweep Bar -->
    <g transform="translate(0, 82)">
      <!-- Sweep Track -->
      <line x1="-165" y1="0" x2="165" y2="0" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
      <polygon points="170,0 158,-6 158,6" fill="#cbd5e1" />
      <!-- Sweeping Finger Beacon Indicator -->
      <circle id="blend-sweep-pointer" cx="-165" cy="0" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2.5" filter="url(#card-shadow)" />
    </g>
  </g>

  <!-- Instructions & Score Threshold Footnote -->
  <g transform="translate(400, 445)">
    <rect x="-260" y="-14" width="520" height="28" rx="7" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">
      👆 Tap sound buttons to segment pure phonemes &bull; Drag green pointer to blend sounds into words
    </text>
  </g>
</svg>
