<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <defs>
    <linearGradient id="acid-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="syringe-plunger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#090d16"/>
  <rect x="0" y="0" width="800" height="480" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="400" y="34" fill="#f8fafc" font-size="19" font-weight="800" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Rates of Reaction &amp; Collision Theory (CaCO₃ + 2HCl)
  </text>
  <text x="400" y="54" fill="#94a3b8" font-size="11.5" font-weight="600" text-anchor="middle">
    KS4 GCSE Chemistry · Gas Syringe Collection · Live Product Curve &amp; Stoichiometry Ledger
  </text>

  <!-- Left Lab Bench: Conical Reaction Flask & Gas Syringe -->
  <rect x="30" y="76" width="375" height="310" rx="12" fill="#0b1120" stroke="#334155" stroke-width="2"/>

  <!-- Glass Syringe Barrel + Tubing -->
  <path d="M 155 155 L 155 102 L 222 102" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="220" y="88" width="160" height="28" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#475569" stroke-width="1">
    <line x1="250" y1="88" x2="250" y2="96"/>
    <line x1="280" y1="88" x2="280" y2="98"/>
    <line x1="310" y1="88" x2="310" y2="96"/>
    <line x1="340" y1="88" x2="340" y2="98"/>
  </g>
  <rect id="co2-fill-bar" x="222" y="90" width="0" height="24" rx="2" fill="#22c55e" opacity="0.35"/>
  <g id="syringe-piston" transform="translate(226, 89)">
    <rect x="0" y="0" width="12" height="26" rx="2" fill="url(#syringe-plunger)" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="12" y="9" width="44" height="8" rx="2" fill="#64748b"/>
    <rect x="54" y="2" width="6" height="22" rx="2" fill="#cbd5e1"/>
  </g>
  <text id="syringe-readout" x="300" y="132" fill="#4ade80" font-size="11.5" font-weight="800" text-anchor="middle" font-family="monospace">
    CO₂ Gas: 0.0 cm³
  </text>

  <!-- Reaction Chamber Box (Bound tightly for :particle-pool) -->
  <rect x="52" y="160" width="210" height="190" rx="10" fill="url(#acid-grad)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="135" y="148" width="44" height="14" rx="3" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Marble Chips (CaCO3 solid surface area representation) -->
  <g id="marble-chips-group">
    <polygon id="chip-1" points="72,334 94,322 118,336 106,346 76,346" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon id="chip-2" points="132,330 156,318 178,334 166,346 136,346" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon id="chip-3" points="190,332 214,320 238,336 226,346 196,346" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- In-Stage Parameter & Rate Summary -->
  <g transform="translate(274, 160)">
    <rect width="118" height="190" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="59" y="22" fill="#94a3b8" font-size="10" font-weight="800" text-anchor="middle">CONDITIONS</text>

    <text x="10" y="46" fill="#94a3b8" font-size="10" font-weight="700">Temp (T):</text>
    <text id="val-temp" x="108" y="46" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="end" font-family="monospace">30 °C</text>

    <text x="10" y="72" fill="#94a3b8" font-size="10" font-weight="700">HCl [C]:</text>
    <text id="val-conc" x="108" y="72" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="end" font-family="monospace">1.0 M</text>

    <text x="10" y="98" fill="#94a3b8" font-size="10" font-weight="700">Chip Size:</text>
    <text id="val-sa" x="108" y="98" fill="#e2e8f0" font-size="10.5" font-weight="800" text-anchor="end" font-family="monospace">Large (1x)</text>

    <line x1="10" y1="112" x2="108" y2="112" stroke="#1e293b" stroke-width="1.5"/>

    <text x="59" y="130" fill="#94a3b8" font-size="9.5" font-weight="800" text-anchor="middle">COLLISION FACTOR</text>
    <text id="val-krate" x="59" y="150" fill="#facc15" font-size="15" font-weight="900" text-anchor="middle" font-family="monospace">1.4x</text>

    <text x="59" y="170" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">Instant Rate:</text>
    <text id="val-rate" x="59" y="184" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle" font-family="monospace">0.0 cm³/s</text>
  </g>

  <!-- Quick Clickable Chip Surface Area Selector on SVG -->
  <g transform="translate(52, 356)">
    <g id="btn-sa-large" style="cursor:pointer;">
      <rect width="66" height="22" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="33" y="15" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">Large (1x)</text>
    </g>
    <g id="btn-sa-med" transform="translate(72, 0)" style="cursor:pointer;">
      <rect width="66" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="33" y="15" fill="#cbd5e1" font-size="9.5" font-weight="700" text-anchor="middle">Med (2x)</text>
    </g>
    <g id="btn-sa-powder" transform="translate(144, 0)" style="cursor:pointer;">
      <rect width="66" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="33" y="15" fill="#cbd5e1" font-size="9.5" font-weight="700" text-anchor="middle">Powder (3x)</text>
    </g>
  </g>

  <!-- Right Panel: Live Vector Oscilloscope (:scope) -->
  <rect x="420" y="76" width="350" height="240" rx="12" fill="#0b1120" stroke="#334155" stroke-width="2"/>
  <text x="595" y="96" fill="#e2e8f0" font-size="12" font-weight="800" text-anchor="middle">
    Live Gas Evolution Curve (CO₂ vs Time)
  </text>

  <!-- Scope Axes & Grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="455" y1="114" x2="750" y2="114"/>
    <line x1="455" y1="154" x2="750" y2="154"/>
    <line x1="455" y1="194" x2="750" y2="194"/>
    <line x1="455" y1="234" x2="750" y2="234"/>
    <line x1="514" y1="114" x2="514" y2="274"/>
    <line x1="573" y1="114" x2="573" y2="274"/>
    <line x1="632" y1="114" x2="632" y2="274"/>
    <line x1="691" y1="114" x2="691" y2="274"/>
  </g>
  <line x1="455" y1="114" x2="455" y2="274" stroke="#64748b" stroke-width="1.5"/>
  <line x1="455" y1="274" x2="750" y2="274" stroke="#64748b" stroke-width="1.5"/>

  <text x="448" y="118" fill="#94a3b8" font-size="9" text-anchor="end" font-family="monospace">80</text>
  <text x="448" y="198" fill="#94a3b8" font-size="9" text-anchor="end" font-family="monospace">40</text>
  <text x="448" y="278" fill="#94a3b8" font-size="9" text-anchor="end" font-family="monospace">0</text>
  <text x="602" y="294" fill="#94a3b8" font-size="9.5" text-anchor="middle">Time (0 – 25 s)</text>
  <text x="434" y="194" fill="#94a3b8" font-size="9.5" text-anchor="middle" transform="rotate(-90 434 194)">CO₂ (cm³)</text>

  <!-- Live Oscilloscope Trace Polyline -->
  <polyline id="rate-scope-line" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points=""/>

  <!-- Conservation Ledger Mount Group (:ledger) -->
  <rect x="420" y="328" width="350" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <g id="reaction-ledger"></g>

  <!-- Bottom Equation Strip -->
  <g transform="translate(30, 400)">
    <rect width="740" height="56" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="22" fill="#38bdf8" font-size="11" font-weight="800">COLLISION THEORY &amp; MASS CONSERVATION:</text>
    <text id="rate-equation-status" x="20" y="42" fill="#e2e8f0" font-size="12.5" font-weight="700" font-family="monospace">
      Mean Rate = ΔV(CO₂) / Δt · Higher Temp &amp; Concentration increase successful collision frequency
    </text>
  </g>
</svg>
