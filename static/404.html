<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — St Joseph's Curriculum Portal</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="St Joseph's Curriculum Portal page not found. Return to interactive curriculum, simulations, and lessons." />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <style>
      :root {
        --stj-bg: #f8fafc;
        --stj-card: #ffffff;
        --stj-text: #0f172a;
        --stj-sub: #475569;
        --stj-primary: #2563eb;
        --stj-primary-hover: #1d4ed8;
        --stj-border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --stj-bg: #0f172a;
          --stj-card: #1e293b;
          --stj-text: #f8fafc;
          --stj-sub: #94a3b8;
          --stj-primary: #38bdf8;
          --stj-primary-hover: #0284c7;
          --stj-border: #334155;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--stj-bg);
        color: var(--stj-text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background-color: var(--stj-card);
        border: 1px solid var(--stj-border);
        border-radius: 16px;
        padding: 2.5rem 2rem;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(37, 99, 235, 0.1);
        color: var(--stj-primary);
        font-size: 0.82rem;
        font-weight: 700;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 800;
        margin: 0 0 0.75rem 0;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--stj-sub);
        margin: 0 0 1.75rem 0;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      .btn-primary {
        background-color: var(--stj-primary);
        color: #ffffff;
      }
      .btn-primary:hover {
        background-color: var(--stj-primary-hover);
      }
      .btn-outline {
        border: 1px solid var(--stj-border);
        color: var(--stj-text);
      }
      .btn-outline:hover {
        background-color: var(--stj-bg);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">
        <span>🕊️</span> St Joseph's Curriculum Portal
      </div>
      <h1>Page Not Found (404)</h1>
      <p>
        The curriculum cartridge or page you requested could not be located.
        Return to the portal homepage to continue exploring interactive lessons, simulations, and Catholic catechesis.
      </p>
      <div class="actions">
        <a href="./" class="btn btn-primary" aria-label="Return to St Joseph's Curriculum Portal Homepage">
          <span>🏠</span> Return to Homepage
        </a>
        <a href="./player" class="btn btn-outline" aria-label="Open AST Vector Player Simulators">
          <span>🎮</span> Launch AST Vector Simulators
        </a>
      </div>
    </main>

    <script>
      // Single Page Application redirect fallback for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        var hostname = window.location.hostname;
        var isGh = hostname === 'github.io' || hostname.endsWith('.github.io');
        var base = (isGh && parts.length > 0) ? '/' + encodeURIComponent(parts[0]) + '/' : '/';
        if (path.indexOf(base) === 0 && path.length > base.length) {
          var segment = path.slice(base.length);
          // If not a static file with extension, redirect to base with hash
          if (segment.indexOf('.') === -1) {
            var safeSegment = encodeURI(decodeURI(segment));
            window.location.replace(base + '#' + safeSegment + window.location.search);
          }
        }
      })();
    </script>
  </body>
</html>
