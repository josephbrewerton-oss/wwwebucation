<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="celestial-sky-grad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="rgba(30, 58, 138, 0.45)" />
      <stop offset="70%" stop-color="rgba(15, 23, 42, 0.85)" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="leather-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="gilded-edges" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <radialGradient id="sun-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)" />
    </radialGradient>
    <radialGradient id="moon-silver" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>
  </defs>

  <!-- Deep Nocturnal Sky Background -->
  <rect id="celestial-sky-fill" x="0" y="0" width="800" height="480" fill="#030712" />
  <circle cx="400" cy="200" r="380" fill="url(#celestial-sky-grad)" />

  <!-- Constellation Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="60" r="1.5" />
    <circle cx="140" cy="110" r="1.2" />
    <circle cx="210" cy="45" r="2" />
    <circle cx="680" cy="80" r="1.5" />
    <circle cx="730" cy="130" r="2" />
    <circle cx="620" cy="50" r="1.2" />
    <circle cx="310" cy="70" r="1" />
    <circle cx="500" cy="65" r="1.2" />
  </g>

  <!-- Celestial 24-Hour Liturgical Dial (The Sanctification of Time) -->
  <g transform="translate(400, 190)">
    <!-- Outer Bronze Chapter Ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#ca8a04" stroke-width="3" opacity="0.7" />
    <circle cx="0" cy="0" r="148" fill="rgba(15, 23, 42, 0.65)" stroke="#334155" stroke-width="1.5" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="2 4" />

    <!-- 7 Canonical Hour Station Nodes -->
    <!-- Midnight / Matins (top) -->
    <g transform="translate(0, -135)">
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="3" fill="#38bdf8" font-size="8" font-weight="bold" text-anchor="middle">MAT</text>
      <text x="0" y="-18" fill="#94a3b8" font-size="7" text-anchor="middle">Matins 3h</text>
    </g>

    <!-- Lauds (Dawn ~6 AM, top-right) -->
    <g transform="translate(105, -80)">
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#facc15" stroke-width="2" />
      <text x="0" y="3" fill="#facc15" font-size="8" font-weight="bold" text-anchor="middle">LAU</text>
      <text x="22" y="3" fill="#fef08a" font-size="7" font-weight="bold">Lauds 6h</text>
    </g>

    <!-- Terce (Mid-Morning ~9 AM, right) -->
    <g transform="translate(135, 10)">
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
      <text x="0" y="3" fill="#fbbf24" font-size="8" font-weight="bold" text-anchor="middle">TER</text>
      <text x="22" y="3" fill="#cbd5e1" font-size="7">Terce 9h</text>
    </g>

    <!-- Sext (Midday ~12 PM, bottom-right) -->
    <g transform="translate(95, 100)">
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <text x="0" y="3" fill="#f59e0b" font-size="8" font-weight="bold" text-anchor="middle">SEX</text>
      <text x="22" y="3" fill="#cbd5e1" font-size="7">Sext 12h</text>
    </g>

    <!-- None (Afternoon ~3 PM, bottom-left) -->
    <g transform="translate(-95, 100)">
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#ea580c" stroke-width="2" />
      <text x="0" y="3" fill="#ea580c" font-size="8" font-weight="bold" text-anchor="middle">NON</text>
      <text x="-22" y="3" fill="#cbd5e1" font-size="7" text-anchor="end">None 15h</text>
    </g>

    <!-- Vespers (Evening Sunset ~6 PM, left) -->
    <g transform="translate(-135, 10)">
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
      <text x="0" y="3" fill="#ec4899" font-size="8" font-weight="bold" text-anchor="middle">VES</text>
      <text x="-22" y="3" fill="#f472b6" font-size="7" font-weight="bold" text-anchor="end">Vespers 18h</text>
    </g>

    <!-- Compline (Night ~9 PM, top-left) -->
    <g transform="translate(-105, -80)">
      <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
      <text x="0" y="3" fill="#a855f7" font-size="8" font-weight="bold" text-anchor="middle">COM</text>
      <text x="-22" y="3" fill="#c084fc" font-size="7" text-anchor="end">Compline 21h</text>
    </g>

    <!-- Rotating Celestial Sun/Moon Pointer (Bound to AST) -->
    <g id="celestial-sun-moon">
      <line x1="0" y1="0" x2="0" y2="-120" stroke="#facc15" stroke-width="2.5" />
      <!-- Radiant Sun -->
      <circle cx="0" cy="-120" r="16" fill="url(#sun-gold)" />
      <circle cx="0" cy="-120" r="8" fill="#fef08a" />
      <!-- Silver Crescent Moon on opposing arm -->
      <line x1="0" y1="0" x2="0" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="0" cy="120" r="10" fill="url(#moon-silver)" />
      <path d="M -5 112 Q 3 120 -5 128 Q 0 120 -5 112 Z" fill="#0f172a" />
    </g>

    <!-- Interactive Dial Center Knob -->
    <g id="celestial-dial-knob" style="cursor: grab;">
      <circle cx="0" cy="0" r="20" fill="url(#leather-cover)" stroke="#ca8a04" stroke-width="2.5" />
      <circle cx="0" cy="0" r="12" fill="#ca8a04" />
      <circle cx="0" cy="0" r="5" fill="#fef08a" />
      <text x="0" y="2" fill="#713f12" font-size="7" font-weight="bold" text-anchor="middle">✠</text>
    </g>
  </g>

  <!-- LOWER FOREGROUND: Open Liturgical Breviary (Liturgia Horarum) -->
  <g transform="translate(400, 375)">
    <!-- Book Shadow -->
    <rect x="-190" y="-35" width="380" height="75" rx="10" fill="#000000" opacity="0.6" filter="blur(6px)" />

    <!-- Leather Binder Cushion -->
    <path d="M -180 35 L -180 -30 Q 0 -45 180 -30 L 180 35 Q 0 20 -180 35 Z" fill="url(#leather-cover)" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Gilded Gold Edges -->
    <path d="M -176 34 L 176 34 L 174 26 L -174 26 Z" fill="url(#gilded-edges)" />

    <!-- Left Page (Cream Vellum) -->
    <polygon points="-172,24 -6,22 -6,-36 -172,-32" fill="#fffbeb" stroke="#d6d3d1" stroke-width="1" />
    <!-- Right Page (Cream Vellum) -->
    <polygon points="6,22 172,24 172,-32 6,-36" fill="#fffbeb" stroke="#d6d3d1" stroke-width="1" />

    <!-- Book Spine Gutter -->
    <line x1="0" y1="-38" x2="0" y2="24" stroke="#78716c" stroke-width="2" />

    <!-- Left Page Text (Red Rubric + Black Psalm Chants) -->
    <text x="-90" y="-20" fill="#dc2626" font-size="6" font-weight="bold" text-anchor="middle">AD LAUDES MATUTINAS</text>
    <line x1="-155" y1="-12" x2="-25" y2="-12" stroke="#44403c" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="-155" y1="-5" x2="-25" y2="-5" stroke="#44403c" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="-155" y1="2" x2="-45" y2="2" stroke="#44403c" stroke-width="1" stroke-dasharray="2 2" />
    <text x="-90" y="14" fill="#b91c1c" font-size="6" font-style="italic" text-anchor="middle">Canticum Zachariae &bull; Benedictus</text>

    <!-- Right Page Text (Evening Vespers & Magnificat) -->
    <text x="90" y="-20" fill="#dc2626" font-size="6" font-weight="bold" text-anchor="middle">AD VESPERAS</text>
    <line x1="25" y1="-12" x2="155" y2="-12" stroke="#44403c" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="25" y1="-5" x2="155" y2="-5" stroke="#44403c" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="25" y1="2" x2="135" y2="2" stroke="#44403c" stroke-width="1" stroke-dasharray="2 2" />
    <text x="90" y="14" fill="#b91c1c" font-size="6" font-style="italic" text-anchor="middle">Canticum B.V. Mariae &bull; Magnificat</text>

    <!-- Red Silk Marker Ribbon -->
    <g id="breviary-ribbon-red">
      <path d="M 0 -38 Q -20 0 -35 55 L -25 55 Q -10 5 0 -38 Z" fill="#ef4444" opacity="0.95" />
    </g>
    <!-- Gold Silk Marker Ribbon -->
    <path d="M 0 -38 Q 20 0 45 55 L 35 55 Q 10 5 0 -38 Z" fill="#eab308" opacity="0.95" />
  </g>

  <!-- Bottom Liturgical Banner -->
  <rect x="150" y="442" width="500" height="28" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" stroke-width="1" />
  <text x="400" y="460" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle" letter-spacing="1">
    LITURGIA HORARUM &bull; "SEVEN TIMES A DAY I PRAISE THEE" (PSALM 119:164)
  </text>
</svg>
