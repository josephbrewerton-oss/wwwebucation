<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <defs>
    <!-- Chamber Gradients -->
    <linearGradient id="piston-shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="chamber-wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mercury-tube" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow-gauge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="#090d16"/>
  <rect x="0" y="0" width="800" height="480" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title &amp; Curriculum Banner -->
  <text x="400" y="38" fill="#f8fafc" font-size="20" font-weight="900" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Kinetic Gas Theory &amp; Thermodynamics (PV = nRT)
  </text>
  <text x="400" y="58" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">
    KS3/KS4 Physics &amp; Chemistry: Elastic Wall Collisions, Boyle's Law &amp; Thermal Speed
  </text>

  <!-- Piston Cylinder Container Outer Frame -->
  <rect x="40" y="80" width="460" height="300" rx="16" fill="#0b1120" stroke="#334155" stroke-width="6"/>

  <!-- Grid Coordinate Lines inside Chamber -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="140" x2="500" y2="140"/>
    <line x1="40" y1="200" x2="500" y2="200"/>
    <line x1="40" y1="260" x2="500" y2="260"/>
    <line x1="40" y1="320" x2="500" y2="320"/>
    <line x1="120" y1="80" x2="120" y2="380"/>
    <line x1="200" y1="80" x2="200" y2="380"/>
    <line x1="280" y1="80" x2="280" y2="380"/>
    <line x1="360" y1="80" x2="360" y2="380"/>
    <line x1="440" y1="80" x2="440" y2="380"/>
  </g>

  <!-- Dynamic Gas Particles Vector Stage Container -->
  <g id="gas-particles-group">
    <!-- Seed initial visible representative particles -->
    <circle cx="80" cy="140" r="6" fill="#38bdf8"/>
    <circle cx="120" cy="220" r="6" fill="#4ade80"/>
    <circle cx="210" cy="110" r="6" fill="#facc15"/>
    <circle cx="160" cy="300" r="6" fill="#f43f5e"/>
    <circle cx="290" cy="180" r="6" fill="#38bdf8"/>
    <circle cx="240" cy="260" r="6" fill="#4ade80"/>
    <circle cx="340" cy="130" r="6" fill="#facc15"/>
    <circle cx="180" cy="160" r="6" fill="#38bdf8"/>
    <circle cx="320" cy="310" r="6" fill="#4ade80"/>
    <circle cx="100" cy="270" r="6" fill="#f43f5e"/>
    <circle cx="260" cy="340" r="6" fill="#38bdf8"/>
    <circle cx="380" cy="230" r="6" fill="#facc15"/>
    <!-- Brownian Pollen Tracer -->
    <circle id="brownian-grain" cx="200" cy="210" r="16" fill="#f59e0b" stroke="#fef3c7" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Movable Piston Head &amp; Mechanical Shaft -->
  <g id="piston-assembly" transform="translate(430, 0)">
    <!-- Piston Face -->
    <rect x="0" y="80" width="28" height="300" rx="4" fill="url(#piston-shaft)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Grip Ribs -->
    <line x1="14" y1="95" x2="14" y2="365" stroke="#334155" stroke-width="4"/>
    <!-- Piston Push Rod -->
    <rect x="28" y="215" width="80" height="30" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <circle cx="100" cy="230" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <!-- Volume Label on Piston Face -->
    <text x="14" y="235" fill="#090d16" font-size="11" font-weight="900" text-anchor="middle" transform="rotate(-90 14 235)">
      PISTON
    </text>
  </g>

  <!-- Right Instrument Rack: Bourdon Pressure Gauge -->
  <g id="pressure-gauge" transform="translate(630, 160)">
    <!-- Gauge Housing -->
    <circle cx="0" cy="0" r="64" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <circle cx="0" cy="0" r="56" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <!-- Gauge Dial Ticks -->
    <path d="M -40 25 A 50 50 0 1 1 40 25" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="2 8"/>
    <!-- Needle Pivot &amp; Arm -->
    <g id="gauge-needle" transform="rotate(-45 0 0)">
      <line x1="0" y1="8" x2="0" y2="-44" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#f8fafc"/>
    </g>
    <!-- Readout Text -->
    <text x="0" y="24" fill="#94a3b8" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1">PRESSURE</text>
    <text id="gauge-value" x="0" y="42" fill="#38bdf8" font-size="14" font-weight="900" text-anchor="middle" font-family="monospace">
      101.3 kPa
    </text>
  </g>

  <!-- Thermometer Cylinder -->
  <g id="thermometer-unit" transform="translate(730, 90)">
    <!-- Outer glass tube -->
    <rect x="0" y="0" width="22" height="180" rx="11" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Mercury / Alcohol Column -->
    <rect id="thermo-fluid" x="4" y="60" width="14" height="116" rx="7" fill="url(#mercury-tube)"/>
    <!-- Thermometer Bulb -->
    <circle cx="11" cy="180" r="16" fill="#ef4444" stroke="#475569" stroke-width="2"/>
    <!-- Temperature Text -->
    <text id="thermo-value" x="11" y="215" fill="#fca5a5" font-size="12" font-weight="900" text-anchor="middle" font-family="monospace">
      300 K
    </text>
    <text x="11" y="228" fill="#94a3b8" font-size="9" font-weight="700" text-anchor="middle">
      (27°C)
    </text>
  </g>

  <!-- State of Matter Indicator Pills -->
  <g transform="translate(560, 310)">
    <rect width="210" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <g id="state-indicators">
      <rect id="ind-solid" x="10" y="8" width="58" height="26" rx="4" fill="#1e293b" style="cursor: pointer;" data-interactive="gas-state" data-gas-state="solid"/>
      <text id="txt-solid" x="39" y="24" fill="#64748b" font-size="10" font-weight="900" text-anchor="middle" style="cursor: pointer; pointer-events: none;">SOLID</text>

      <rect id="ind-liquid" x="76" y="8" width="58" height="26" rx="4" fill="#1e293b" style="cursor: pointer;" data-interactive="gas-state" data-gas-state="liquid"/>
      <text id="txt-liquid" x="105" y="24" fill="#64748b" font-size="10" font-weight="900" text-anchor="middle" style="cursor: pointer; pointer-events: none;">LIQUID</text>

      <rect id="ind-gas" x="142" y="8" width="58" height="26" rx="4" fill="#2563eb" style="cursor: pointer;" data-interactive="gas-state" data-gas-state="gas"/>
      <text id="txt-gas" x="171" y="24" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle" style="cursor: pointer; pointer-events: none;">GAS</text>
    </g>
  </g>

  <!-- Bottom Invariant Mathematical Card: Boyle's Law Verification -->
  <g transform="translate(40, 400)">
    <rect width="720" height="58" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <g transform="translate(20, 20)">
      <text fill="#86efac" font-size="11" font-weight="800" letter-spacing="1">
        BOYLE'S LAW INVARIANT (T = CONSTANT):
      </text>
      <text x="0" y="24" fill="#22c55e" font-size="16" font-weight="900" font-family="monospace" id="pv-equation">
        P × V = k  •  (101.3 kPa × 100% Volume = 10,130)
      </text>
    </g>
    <!-- Collision Momentum Telemetry -->
    <g transform="translate(480, 22)">
      <text fill="#94a3b8" font-size="11" font-weight="700">Wall Impulses: <tspan id="collision-rate" fill="#38bdf8" font-weight="900">480 / sec</tspan></text>
      <text y="20" fill="#94a3b8" font-size="11" font-weight="700">Root-Mean-Square Speed: <tspan id="rms-speed" fill="#facc15" font-weight="900">490 m/s</tspan></text>
    </g>
  </g>
</svg>
