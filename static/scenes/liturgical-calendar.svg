<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="calendar-bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.55)" />
      <stop offset="70%" stop-color="rgba(15, 23, 42, 0.85)" />
      <stop offset="100%" stop-color="#040711" />
    </radialGradient>
    <linearGradient id="gold-crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>

  <!-- Deep Sacred Nocturnal Navy Background -->
  <rect x="0" y="0" width="800" height="480" fill="#040711" />
  <circle cx="400" cy="220" r="350" fill="url(#calendar-bg-glow)" />

  <!-- THE LITURGICAL YEAR WHEEL (360-Degree Cycle) -->
  <g transform="translate(400, 220)">
    <!-- Outer Season Halo Ring (bound to AST) -->
    <circle id="season-glow-halo" cx="0" cy="0" r="172" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.8" />
    <circle cx="0" cy="0" r="162" fill="#0b1120" stroke="#334155" stroke-width="2" />

    <!-- 1. Advent Slice: Violet (Top, ~330° to 360°) -->
    <path d="M 0 0 L -45 -154 A 160 160 0 0 1 0 -160 Z" fill="#6b21a8" stroke="#a855f7" stroke-width="1.5" />
    <text x="-25" y="-135" fill="#f3e8ff" font-size="8.5" font-weight="bold" transform="rotate(-15 -25 -135)">ADVENT</text>

    <!-- 2. Christmas Season Slice: White & Gold (~0° to 40°) -->
    <path d="M 0 0 L 0 -160 A 160 160 0 0 1 102 -123 Z" fill="#fffbeb" stroke="#facc15" stroke-width="1.5" />
    <text x="50" y="-120" fill="#854d0e" font-size="8.5" font-weight="bold" transform="rotate(20 50 -120)">CHRISTMAS</text>

    <!-- 3. Ordinary Time Part I: Green (~40° to 100°) -->
    <path d="M 0 0 L 102 -123 A 160 160 0 0 1 157 28 Z" fill="#15803d" stroke="#4ade80" stroke-width="1.5" />
    <text x="120" y="-40" fill="#dcfce7" font-size="8.5" font-weight="bold" transform="rotate(65 120 -40)">ORD. TIME I</text>

    <!-- 4. Lent & Holy Week: Violet / Purple (~100° to 160°) -->
    <path d="M 0 0 L 157 28 A 160 160 0 0 1 55 150 Z" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
    <text x="110" y="80" fill="#f3e8ff" font-size="9" font-weight="bold" transform="rotate(130 110 80)">LENT (40D)</text>

    <!-- 5. Triduum & Easter: Gold, White & Pentecost Red (~160° to 230°) -->
    <path d="M 0 0 L 55 150 A 160 160 0 0 1 -122 103 Z" fill="#eab308" stroke="#fef08a" stroke-width="1.5" />
    <text x="-35" y="135" fill="#713f12" font-size="9" font-weight="bold" transform="rotate(-15 -35 135)">EASTER (50D)</text>

    <!-- Pentecost Red Tongue slice -->
    <path d="M 0 0 L -122 103 A 160 160 0 0 1 -140 78 Z" fill="#dc2626" stroke="#f87171" stroke-width="1" />
    <text x="-125" y="85" fill="#fef2f2" font-size="6.5" font-weight="bold">PENT</text>

    <!-- 6. Ordinary Time Part II: Emerald Green (~230° to 330°) -->
    <path d="M 0 0 L -140 78 A 160 160 0 0 1 -45 -154 Z" fill="#166534" stroke="#22c55e" stroke-width="1.5" />
    <text x="-120" y="-40" fill="#dcfce7" font-size="9" font-weight="bold" transform="rotate(-65 -120 -40)">ORDINARY TIME II (GROWTH &amp; HOPE)</text>

    <!-- Inner Chapter Ring -->
    <circle cx="0" cy="0" r="75" fill="#0f172a" stroke="#ca8a04" stroke-width="2" />

    <!-- Center Season Badge (bound to AST) -->
    <circle id="season-center-badge" cx="0" cy="0" r="54" fill="#14532d" stroke="#fde047" stroke-width="2" />

    <!-- Crown of Christ the King (Rex Regum) at Center -->
    <g transform="translate(0, -6)">
      <polygon points="-22 10 22 10 18 -10 6 -2 0 -16 -6 -2 -18 -10" fill="url(#gold-crown)" stroke="#78350f" stroke-width="1.5" />
      <circle cx="-18" cy="-10" r="2.5" fill="#ef4444" />
      <circle cx="0" cy="-16" r="3" fill="#38bdf8" />
      <circle cx="18" cy="-10" r="2.5" fill="#ef4444" />
      <text x="0" y="24" fill="#fef08a" font-size="7.5" font-weight="900" text-anchor="middle" letter-spacing="1">CHRISTUS REX</text>
    </g>

    <!-- Rotating Needle / Pointer (bound to AST seasonAngle) -->
    <g id="liturgical-dial-needle" style="cursor: grab;">
      <line x1="0" y1="20" x2="0" y2="-152" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
      <polygon points="0 -166 -7 -148 7 -148" fill="#ffffff" stroke="#ca8a04" stroke-width="1" />
      <circle cx="0" cy="0" r="12" fill="#d97706" stroke="#ffffff" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#fef08a" />
    </g>
  </g>

  <!-- Four Seasonal Callout Cards in Corners -->
  <!-- Top-Left: Advent / Christmas -->
  <g transform="translate(100, 60)">
    <rect x="-70" y="-20" width="140" height="40" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="0" y="-4" fill="#c084fc" font-size="8" font-weight="bold" text-anchor="middle">PURPLE &bull; WHITE &bull; ROSE</text>
    <text x="0" y="10" fill="#94a3b8" font-size="7" text-anchor="middle">Incarnation &bull; Gaudete</text>
  </g>

  <!-- Top-Right: Lent / Easter -->
  <g transform="translate(700, 60)">
    <rect x="-70" y="-20" width="140" height="40" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
    <text x="0" y="-4" fill="#fde047" font-size="8" font-weight="bold" text-anchor="middle">GOLD &bull; RED &bull; WHITE</text>
    <text x="0" y="10" fill="#94a3b8" font-size="7" text-anchor="middle">Paschal Mystery &bull; 50 Days</text>
  </g>

  <!-- Bottom Liturgical Banner -->
  <rect x="130" y="442" width="540" height="28" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" stroke-width="1" />
  <text x="400" y="460" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle" letter-spacing="1">
    ANNUS LITURGICUS &bull; SANCTIFYING THE SEASONS WITH CHRIST THE KING
  </text>
</svg>
