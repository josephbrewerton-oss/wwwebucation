<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sacrament-glory" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.45)" />
      <stop offset="50%" stop-color="rgba(217, 119, 6, 0.15)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="sacrament-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Sacred Sanctuary Blue / Slate Background -->
  <rect x="0" y="0" width="800" height="480" fill="#090e1a" />
  <circle cx="400" cy="220" r="350" fill="url(#sacrament-glory)" />

  <!-- Seven Radiant Streams of Grace from Christ the Vine -->
  <g id="seven-rays-radiance" stroke="#facc15" stroke-width="2" opacity="0.65" stroke-dasharray="3 3">
    <!-- Stream to Baptism -->
    <line x1="400" y1="210" x2="140" y2="110" />
    <!-- Stream to Confirmation -->
    <line x1="400" y1="210" x2="270" y2="70" />
    <!-- Stream to Eucharist (Center/Top) -->
    <line x1="400" y1="210" x2="400" y2="60" />
    <!-- Stream to Penance -->
    <line x1="400" y1="210" x2="530" y2="70" />
    <!-- Stream to Anointing -->
    <line x1="400" y1="210" x2="660" y2="110" />
    <!-- Stream to Holy Orders -->
    <line x1="400" y1="210" x2="220" y2="350" />
    <!-- Stream to Holy Matrimony -->
    <line x1="400" y1="210" x2="580" y2="350" />
  </g>

  <!-- CENTER: The Holy Eucharist (Source & Summit of all Sacraments) -->
  <g id="sacramental-grace-source" transform="translate(400, 215)" style="cursor: grab;">
    <!-- Indelible Seal Glow ring (bound to AST) -->
    <circle id="indelible-seal-glow" cx="0" cy="0" r="68" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" stroke-dasharray="4 2" />

    <!-- Radiant Monstrance / Chalice Host Halo -->
    <circle cx="0" cy="0" r="54" fill="rgba(15, 23, 42, 0.9)" stroke="url(#gold-grad)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="46" fill="rgba(245, 158, 11, 0.15)" stroke="#ca8a04" stroke-width="1" />

    <!-- Center Cross & Sacred Heart IHS -->
    <g id="sacrament-center-icon">
      <!-- Golden Chalice Base -->
      <path d="M -16 28 L 16 28 L 10 20 L -10 20 Z" fill="url(#gold-grad)" />
      <rect x="-3" y="10" width="6" height="12" fill="#d97706" />
      <path d="M -14 10 Q -16 -4 0 -4 Q 16 -4 14 10 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1" />
      <!-- Luminous White Host -->
      <circle cx="0" cy="-18" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="0" y="-13" fill="#d97706" font-size="10" font-weight="900" text-anchor="middle">IHS</text>
      <text x="0" y="-24" fill="#ef4444" font-size="8" font-weight="900" text-anchor="middle">✠</text>
    </g>

    <!-- Center Label -->
    <text x="0" y="44" fill="#fef08a" font-size="7.5" font-weight="bold" letter-spacing="1" text-anchor="middle">FONS ET CULMEN</text>
  </g>

  <!-- 1. BAPTISM (Initiation) - Shell & Living Water -->
  <g transform="translate(140, 110)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <path d="M -18 8 Q 0 25 18 8 Q 12 -12 0 -14 Q -12 -12 -18 8 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="0" cy="-4" r="3" fill="#38bdf8" />
    <circle cx="-6" cy="2" r="2.5" fill="#38bdf8" />
    <circle cx="6" cy="2" r="2.5" fill="#38bdf8" />
    <text x="0" y="24" fill="#38bdf8" font-size="6.5" font-weight="bold" text-anchor="middle">SEAL ✠</text>
    <text x="0" y="48" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">BAPTISM</text>
    <text x="0" y="58" fill="#94a3b8" font-size="7" text-anchor="middle">Water &bull; Trinity</text>
  </g>

  <!-- 2. CONFIRMATION (Initiation) - Dove of Holy Spirit & Chrism -->
  <g transform="translate(270, 70)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#ef4444" stroke-width="2" />
    <!-- Dove Descending -->
    <path d="M 0 -12 Q -15 0 -8 10 Q 0 6 8 10 Q 15 0 0 -12 Z" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
    <circle cx="0" cy="14" r="4" fill="#fbbf24" stroke="#d97706" />
    <text x="0" y="24" fill="#ef4444" font-size="6.5" font-weight="bold" text-anchor="middle">SEAL ✠</text>
    <text x="0" y="48" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">CONFIRMATION</text>
    <text x="0" y="58" fill="#94a3b8" font-size="7" text-anchor="middle">Chrism &bull; 7 Gifts</text>
  </g>

  <!-- 3. EUCHARIST (Initiation / Apex) - Wheat & Grapes -->
  <g transform="translate(400, 60)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#eab308" stroke-width="2" />
    <circle cx="0" cy="-6" r="10" fill="#ffffff" stroke="#eab308" stroke-width="1.5" />
    <text x="0" y="-3" fill="#ca8a04" font-size="7" font-weight="900" text-anchor="middle">✠</text>
    <!-- Grapes -->
    <circle cx="-6" cy="12" r="3" fill="#818cf8" />
    <circle cx="0" cy="12" r="3" fill="#818cf8" />
    <circle cx="6" cy="12" r="3" fill="#818cf8" />
    <circle cx="-3" cy="17" r="3" fill="#6366f1" />
    <circle cx="3" cy="17" r="3" fill="#6366f1" />
    <circle cx="0" cy="22" r="2.5" fill="#4f46e5" />
    <text x="0" y="48" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">EUCHARIST</text>
    <text x="0" y="58" fill="#94a3b8" font-size="7" text-anchor="middle">Body &amp; Blood</text>
  </g>

  <!-- 4. PENANCE & RECONCILIATION (Healing) - Keys of the Kingdom & Purple Stole -->
  <g transform="translate(530, 70)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <!-- Crossed Keys of Peter -->
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#facc15" stroke-width="2" />
    <circle cx="-12" cy="-12" r="4" fill="none" stroke="#facc15" stroke-width="1.5" />
    <line x1="12" y1="-12" x2="-12" y2="12" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="12" cy="-12" r="4" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="0" y="48" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">PENANCE</text>
    <text x="0" y="58" fill="#94a3b8" font-size="7" text-anchor="middle">Absolution &bull; Peace</text>
  </g>

  <!-- 5. ANOINTING OF THE SICK (Healing) - Oil Vessel & Olive Branch -->
  <g transform="translate(660, 110)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#22c55e" stroke-width="2" />
    <!-- Oil Vessel (Oleum Infirmorum O.I.) -->
    <rect x="-8" y="-12" width="16" height="24" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <text x="0" y="2" fill="#713f12" font-size="7" font-weight="bold" text-anchor="middle">O.I.</text>
    <!-- Olive Leaves -->
    <path d="M -16 -4 Q -12 -12 0 -10" stroke="#4ade80" stroke-width="1.5" fill="none" />
    <path d="M 16 -4 Q 12 -12 0 -10" stroke="#4ade80" stroke-width="1.5" fill="none" />
    <text x="0" y="48" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">ANOINTING</text>
    <text x="0" y="58" fill="#94a3b8" font-size="7" text-anchor="middle">Fortitude &bull; Health</text>
  </g>

  <!-- 6. HOLY ORDERS (Service of Communion) - Bishop's Mitre, Crosier & Stole -->
  <g transform="translate(220, 350)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <!-- Bishop Crosier Hook -->
    <path d="M -12 14 L -12 -6 Q -12 -16 0 -16 Q 10 -16 10 -6 Q 10 2 2 2" fill="none" stroke="url(#gold-grad)" stroke-width="2" />
    <text x="0" y="22" fill="#f59e0b" font-size="6.5" font-weight="bold" text-anchor="middle">SEAL ✠</text>
    <text x="0" y="48" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">HOLY ORDERS</text>
    <text x="0" y="58" fill="#94a3b8" font-size="7" text-anchor="middle">Apostolic Service</text>
  </g>

  <!-- 7. HOLY MATRIMONY (Service of Communion) - Two Interlocking Gold Rings & Cross -->
  <g transform="translate(580, 350)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <!-- Two Interlocking Wedding Rings -->
    <circle cx="-6" cy="0" r="11" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" />
    <circle cx="6" cy="0" r="11" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" />
    <text x="0" y="-14" fill="#fbbf24" font-size="8" font-weight="bold" text-anchor="middle">✠</text>
    <text x="0" y="48" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">MATRIMONY</text>
    <text x="0" y="58" fill="#94a3b8" font-size="7" text-anchor="middle">Covenant &bull; Love</text>
  </g>

  <!-- Bottom Liturgical Inscription Banner -->
  <rect x="130" y="442" width="540" height="28" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" stroke-width="1" />
  <text x="400" y="460" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle" letter-spacing="1">
    SEPTEM SACRAMENTA &bull; INITIATION &bull; HEALING &bull; SERVICE OF COMMUNION
  </text>
</svg>
