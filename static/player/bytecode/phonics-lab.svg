<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ph-bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Glowing Arrow Gradient -->
    <linearGradient id="ph-arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Finger Glow Filter -->
    <filter id="ph-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#ph-bg-glow)" />

  <!-- Blueprint Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="1">
      EARLY PHONICS: SOUND BUTTONS &amp; BLENDING SWEEP
    </text>
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Systematic Synthetic Phonics • Pure Phonemes • The Universal UK Primary Blending Mat
    </text>
  </g>

  <!-- Big Interactive Blending Stage Container -->
  <g transform="translate(40, 95)">
    <rect width="460" height="320" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <text x="230" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">
      SYNTHETIC BLENDING MAT: SEGMENT &amp; BLEND
    </text>

    <!-- The Big Decodable Word: C - A - T -->
    <g transform="translate(70, 70)">
      <!-- Box for 'c' -->
      <g transform="translate(0, 0)">
        <rect id="ph-card-c" width="90" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <text x="45" y="76" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">
          c
        </text>
        <!-- Sound Button Dot -->
        <circle id="ph-btn-c" cx="45" cy="140" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
        <text x="45" y="144" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">
          /k/
        </text>
      </g>

      <!-- Box for 'a' -->
      <g transform="translate(115, 0)">
        <rect id="ph-card-a" width="90" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <text x="45" y="76" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">
          a
        </text>
        <!-- Sound Button Dot -->
        <circle id="ph-btn-a" cx="45" cy="140" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
        <text x="45" y="144" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">
          /æ/
        </text>
      </g>

      <!-- Box for 't' -->
      <g transform="translate(230, 0)">
        <rect id="ph-card-t" width="90" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <text x="45" y="76" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">
          t
        </text>
        <!-- Sound Button Dot -->
        <circle id="ph-btn-t" cx="45" cy="140" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
        <text x="45" y="144" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">
          /t/
        </text>
      </g>

      <!-- Animated Blending Sweep Arrow -->
      <g transform="translate(0, 180)">
        <line x1="20" y1="0" x2="300" y2="0" stroke="url(#ph-arrow-grad)" stroke-width="6" stroke-linecap="round" />
        <polygon points="300,-8 315,0 300,8" fill="#4ade80" />
        
        <!-- Animated Reading Finger Cursor -->
        <circle id="ph-finger-cursor" cx="20" cy="0" r="10" fill="#facc15" stroke="#ffffff" stroke-width="2" filter="url(#ph-glow)" />
      </g>

      <!-- Blended Result Word -->
      <g id="ph-blended-result" opacity="0" transform="translate(160, 225)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#4ade80" text-anchor="middle">
          "cat" 🐱
        </text>
      </g>
    </g>
  </g>

  <!-- Right Side: Phonics Rules &amp; Tricky Words Card -->
  <g transform="translate(520, 95)">
    <rect width="240" height="320" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <text x="120" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle">
      UK PHONICS ARCHITECTURE
    </text>

    <!-- Rule 1: Sound Buttons -->
    <g transform="translate(20, 50)">
      <rect width="200" height="70" rx="8" fill="#1e293b" stroke="#475569" />
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#38bdf8">
        1. SOUND BUTTON NOTATION:
      </text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">
        • Dot = Single phoneme
      </text>
      <text x="12" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">
        — Dash = Digraph (sh, ch, ai)
      </text>
    </g>

    <!-- Rule 2: Pure Sounds (No Schwa) -->
    <g transform="translate(20, 130)">
      <rect width="200" height="70" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" />
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#22d3ee">
        2. PURE SOUNDS (NO SCHWA):
      </text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">
        Say /c/ crisp, not "cuh"!
      </text>
      <text x="12" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e0f2fe">
        Say /t/ sharp, not "tuh"!
      </text>
    </g>

    <!-- Rule 3: Tricky Words -->
    <g transform="translate(20, 210)">
      <rect width="200" height="90" rx="8" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" />
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fb7185">
        3. TRICKY WORD SPOTLIGHT:
      </text>
      <text x="12" y="44" font-family="system-ui, monospace" font-size="20" font-weight="900" fill="#ffffff">
        s<tspan fill="#f43f5e">ai</tspan>d
      </text>
      <text x="12" y="66" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fca5a5">
        'ai' is tricky: makes short /e/
      </text>
      <text x="12" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fca5a5">
        sounds like "sed", not "say-d"
      </text>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(40, 430)">
    <rect width="720" height="36" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text id="ph-banner-txt" x="360" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Sound Buttons: Press each pure sound button, then sweep across the arrow to blend!
    </text>
  </g>
</svg>
