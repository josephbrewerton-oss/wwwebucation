<svg xmlns="http://www.w3.org/2000/svg" viewBox="-240 -160 480 320" width="100%" height="100%">
  <defs>
    <radialGradient id="phonics-bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="1" />
    </radialGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Forest Background -->
  <rect x="-240" y="-160" width="480" height="320" fill="url(#phonics-bg-grad)" />

  <!-- DfE Status Ribbon -->
  <g transform="translate(0, -135)">
    <rect x="-200" y="-12" width="400" height="24" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#34d399" font-size="10" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="0.5">
      DfE STATUTORY YEAR 1 PHONICS SCREENING CHECK (40 WORDS &bull; 32 PASS THRESHOLD)
    </text>
  </g>

  <!-- Alien Word Monster Card -->
  <g id="alien-monster-badge" transform="translate(-160, -30)" filter="url(#card-shadow)">
    <rect x="-45" y="-55" width="90" height="110" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <!-- Friendly Monster SVG Graphic -->
    <circle cx="0" cy="-15" r="24" fill="#10b981" />
    <!-- Horns -->
    <path d="M-15,-32 Q-25,-48 -10,-42 Z" fill="#34d399" />
    <path d="M15,-32 Q25,-48 10,-42 Z" fill="#34d399" />
    <!-- Single Eyeball -->
    <circle cx="0" cy="-18" r="10" fill="#ffffff" />
    <circle cx="2" cy="-18" r="4" fill="#0f172a" />
    <circle cx="4" cy="-20" r="1.5" fill="#ffffff" />
    <!-- Smile -->
    <path d="M-8,-4 Q0,4 8,-4" fill="none" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" />
    <!-- Body text -->
    <text x="0" y="24" text-anchor="middle" fill="#a7f3d0" font-size="9" font-weight="800" font-family="system-ui, sans-serif">
      ALIEN WORD
    </text>
    <text x="0" y="38" text-anchor="middle" fill="#6ee7b7" font-size="7.5" font-family="system-ui, sans-serif">
      Pure Decoding
    </text>
  </g>

  <!-- Central Flashcard Stage -->
  <g id="main-flashcard" transform="translate(30, -30)" filter="url(#card-shadow)">
    <!-- Whiteboard Flashcard Slab -->
    <rect x="-140" y="-70" width="280" height="140" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />

    <!-- Word Category Banner -->
    <rect x="-140" y="-70" width="280" height="28" rx="14" fill="#f1f5f9" />
    <text id="word-type-tag" x="0" y="-52" text-anchor="middle" fill="#047857" font-size="10" font-weight="900" font-family="system-ui, sans-serif">
      👾 PSEUDO / ALIEN WORD
    </text>

    <!-- Large Bold Grapheme Text -->
    <text id="current-word-display" x="0" y="8" text-anchor="middle" fill="#0f172a" font-size="44" font-weight="900" font-family="'Comic Sans MS', 'Chalkboard', system-ui, sans-serif" letter-spacing="12">
      v  a  p
    </text>

    <!-- Tactile Sound Buttons Row -->
    <g id="sound-buttons-row" transform="translate(0, 36)">
      <!-- Sound Button Dot 1 -->
      <circle id="sound-dot-1" cx="-65" cy="0" r="8" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
      <!-- Sound Button Dot 2 -->
      <circle id="sound-dot-2" cx="0" cy="0" r="8" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
      <!-- Sound Button Dot 3 -->
      <circle id="sound-dot-3" cx="65" cy="0" r="8" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    </g>

    <!-- Left-to-Right Blending Sweep Bar -->
    <g transform="translate(0, 56)">
      <!-- Sweep Track -->
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <polygon points="122,0 114,-5 114,5" fill="#cbd5e1" />
      <!-- Sweeping Finger Beacon Indicator -->
      <circle id="blend-sweep-pointer" cx="-120" cy="0" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#card-shadow)" />
    </g>
  </g>

  <!-- Instructions & Score Threshold Footnote -->
  <g transform="translate(0, 115)">
    <rect x="-210" y="-14" width="420" height="28" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">
      👆 Tap sound buttons to segment pure phonemes &bull; Drag green pointer to blend sounds into words
    </text>
  </g>
</svg>
