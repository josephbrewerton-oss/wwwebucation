<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <rect width="800" height="480" fill="#090d16"/>
  <text x="400" y="40" fill="#f8fafc" font-size="21" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
    PhET Distilled: Pendulum Harmonic Oscillator
  </text>
  <text x="400" y="64" fill="#94a3b8" font-size="12.5" text-anchor="middle" font-family="system-ui, sans-serif">
    Simple Harmonic Motion &amp; Period Invariance: T = 2π√(L / g)
  </text>

  <!-- Pivot Support -->
  <rect x="350" y="88" width="100" height="12" rx="4" fill="#475569"/>
  <circle cx="400" cy="96" r="6" fill="#f59e0b"/>

  <!-- Oscillating String & Bob -->
  <g id="pendulum-arm" style="cursor: grab;"
     data-pedagogical="pendulum-bob"
     data-pedagogical-title="Simple Gravity Pendulum"
     data-pedagogical-eq="T = 2π√(L / g)  (Independent of Mass m)"
     data-pedagogical-desc="Gravitational restoring force (-mg sin θ) accelerates the bob proportionally to mass m, so mass cancels out of the period equation.">
    <line x1="400" y1="96" x2="400" y2="306" stroke="#94a3b8" stroke-width="3" id="string-line"/>
    <circle cx="400" cy="306" r="24" fill="#3b82f6" stroke="#60a5fa" stroke-width="3" id="bob-circle"/>
    <text id="bob-mass-txt" x="400" y="311" fill="#ffffff" font-size="11.5" font-weight="900" text-anchor="middle">1.5 kg</text>
  </g>

  <!-- Energy & Period Telemetry Card -->
  <g transform="translate(545, 132)"
     data-pedagogical="pendulum-energy"
     data-pedagogical-title="Mechanical Energy Conservation"
     data-pedagogical-eq="E_total = KE + GPE = Constant"
     data-pedagogical-desc="Gravitational potential energy peaks at extreme swing angles, converting into kinetic energy at the bottom equilibrium point.">
    <rect width="220" height="168" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="24" fill="#cbd5e1" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">HARMONIC TELEMETRY</text>
    <text id="ke-val-txt" x="18" y="54" fill="#38bdf8" font-size="12" font-weight="800" font-family="monospace">Kinetic (KE): 7.5 J</text>
    <text id="pe-val-txt" x="18" y="80" fill="#facc15" font-size="12" font-weight="800" font-family="monospace">Potential (PE): 7.5 J</text>
    <text id="total-e-txt" x="18" y="108" fill="#4ade80" font-size="12" font-weight="900" font-family="monospace">Total E: 15.0 J</text>
    <line x1="16" y1="124" x2="204" y2="124" stroke="#1e293b" stroke-width="1.5"/>
    <text id="period-readout-txt" x="110" y="148" fill="#f8fafc" font-size="13" font-weight="900" text-anchor="middle" font-family="monospace">Period T = 2.01 s</text>
  </g>

  <text id="pendulum-invariant-banner" x="400" y="432" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">
    Invariant: Mass (1.5 kg) does not change period T — only Length (1.0 m) and Gravity (9.8 m/s²) matter!
  </text>
</svg>