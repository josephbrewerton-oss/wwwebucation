<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sinai Desert Twilight Gradient -->
    <linearGradient id="sinai-sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="35%" stop-color="#1c1917" />
      <stop offset="70%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Cloud of Glory Fire & Light -->
    <radialGradient id="shekinah-fire-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.95)" />
      <stop offset="40%" stop-color="rgba(245, 158, 11, 0.6)" />
      <stop offset="80%" stop-color="rgba(220, 38, 38, 0.3)" />
      <stop offset="100%" stop-color="rgba(69, 26, 3, 0)" />
    </radialGradient>

    <!-- Stone Tablet Texture -->
    <linearGradient id="stone-tablet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Golden Inscription Gradient -->
    <linearGradient id="gold-carving" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="soft-glow-sinai" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#sinai-sky-grad)" />

  <!-- Mount Sinai Peaks in Silhouette -->
  <polygon points="0,420 180,240 340,360 400,280 480,360 620,220 800,420" fill="#1c1917" stroke="#44403c" stroke-width="2" />
  <polygon points="100,420 280,300 400,380 520,290 700,420" fill="#292524" opacity="0.6" />

  <!-- TOP: Shekinah Cloud of Glory & Lightning -->
  <g id="sinai-glory-node" transform="translate(400, 75)" cursor="ns-resize">
    <!-- Fiery Halo -->
    <circle id="sinai-cloud-glow" cx="0" cy="0" r="65" fill="url(#shekinah-fire-glow)" filter="url(#soft-glow-sinai)" />
    
    <!-- Shekinah Cloud Puffs -->
    <path d="M -50,10 C -70,-5 -60,-35 -30,-30 C -20,-50 20,-50 30,-30 C 60,-35 70,-5 50,10 C 65,30 35,45 10,40 C -15,48 -50,35 -50,10 Z" fill="#ca8a04" opacity="0.8" />
    
    <!-- Divine Rays -->
    <g id="sinai-lightning" stroke="#fef08a" stroke-width="2">
      <line x1="-30" y1="35" x2="-60" y2="75" />
      <line x1="0" y1="40" x2="0" y2="90" stroke-width="3" />
      <line x1="30" y1="35" x2="60" y2="75" />
    </g>

    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900" font-family="serif">
      קָדוֹשׁ (HOLY)
    </text>
  </g>

  <!-- CENTER: The Two Stone Tablets of the Law -->
  <g id="two-stone-tablets" transform="translate(400, 240)">
    
    <!-- LEFT TABLET: Commandments I to III (Love of God) -->
    <g id="tablet-one-group" transform="translate(-105, 0)">
      <!-- Arched Stone Tablet -->
      <path id="tablet-one-glow" d="M -85,130 L -85,-70 C -85,-115 85,-115 85,-70 L 85,130 Z" fill="url(#stone-tablet-grad)" stroke="#facc15" stroke-width="3" filter="url(#soft-glow-sinai)" />
      
      <!-- Chiseled Inner Bevel -->
      <path d="M -75,120 L -75,-65 C -75,-100 75,-100 75,-65 L 75,120 Z" fill="none" stroke="#475569" stroke-width="1.5" />

      <!-- Tablet Header -->
      <text x="0" y="-72" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="900" font-family="sans-serif">
        TABLET I
      </text>
      <text x="0" y="-58" text-anchor="middle" fill="#854d0e" font-size="9" font-weight="bold" font-family="sans-serif">
        LOVE OF GOD
      </text>
      <line x1="-50" y1="-50" x2="50" y2="-50" stroke="#a16207" stroke-width="1" />

      <!-- Roman Numerals I, II, III Inscriptions -->
      <g fill="url(#gold-carving)" font-family="serif" font-weight="900" text-anchor="middle">
        <text x="0" y="-18" font-size="20">I</text>
        <text x="0" y="-3" fill="#1e293b" font-size="8.5" font-family="sans-serif">No strange gods before Me</text>

        <text x="0" y="32" font-size="20">II</text>
        <text x="0" y="47" fill="#1e293b" font-size="8.5" font-family="sans-serif">Do not take God's name in vain</text>

        <text x="0" y="82" font-size="20">III</text>
        <text x="0" y="97" fill="#1e293b" font-size="8.5" font-family="sans-serif">Keep holy the Lord's Day</text>
      </g>
    </g>

    <!-- RIGHT TABLET: Commandments IV to X (Love of Neighbour) -->
    <g id="tablet-two-group" transform="translate(105, 0)">
      <!-- Arched Stone Tablet -->
      <path id="tablet-two-glow" d="M -85,130 L -85,-70 C -85,-115 85,-115 85,-70 L 85,130 Z" fill="url(#stone-tablet-grad)" stroke="#94a3b8" stroke-width="1.5" />
      
      <!-- Chiseled Inner Bevel -->
      <path d="M -75,120 L -75,-65 C -75,-100 75,-100 75,-65 L 75,120 Z" fill="none" stroke="#475569" stroke-width="1.5" />

      <!-- Tablet Header -->
      <text x="0" y="-72" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="900" font-family="sans-serif">
        TABLET II
      </text>
      <text x="0" y="-58" text-anchor="middle" fill="#854d0e" font-size="9" font-weight="bold" font-family="sans-serif">
        LOVE OF NEIGHBOUR
      </text>
      <line x1="-50" y1="-50" x2="50" y2="-50" stroke="#a16207" stroke-width="1" />

      <!-- Roman Numerals IV to X Inscriptions -->
      <g fill="url(#gold-carving)" font-family="serif" font-weight="bold" font-size="12" text-anchor="middle">
        <text x="0" y="-28">IV &bull; Honor Father &amp; Mother</text>
        <text x="0" y="-8">V &bull; You Shall Not Kill</text>
        <text x="0" y="12">VI &bull; Purity &amp; Fidelity</text>
        <text x="0" y="32">VII &bull; You Shall Not Steal</text>
        <text x="0" y="52">VIII &bull; Bear No False Witness</text>
        <text x="0" y="72">IX &bull; Pure Thoughts &amp; Desires</text>
        <text x="0" y="92">X &bull; Do Not Covet Goods</text>
      </g>
    </g>
  </g>

  <!-- Interactive Tablet Selector at Bottom -->
  <g id="tablet-selector-container" transform="translate(0, 420)">
    <!-- Selector Track -->
    <rect x="220" y="5" width="360" height="24" rx="12" fill="#1c1917" stroke="#44403c" stroke-width="2" />
    
    <!-- Ticks & Labels -->
    <text x="270" y="21" fill="#fef08a" font-size="11" font-weight="bold" font-family="sans-serif">Tablet I: Love of God (I - III)</text>
    <text x="445" y="21" fill="#cbd5e1" font-size="11" font-weight="bold" font-family="sans-serif">Tablet II: Neighbour (IV - X)</text>

    <!-- Draggable Knob -->
    <g id="tablet-toggle-knob" cursor="ew-resize" transform="translate(260, 17)">
      <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="2" filter="url(#soft-glow-sinai)" />
      <circle cx="0" cy="0" r="6" fill="#451a03" />
    </g>
  </g>
</svg>
