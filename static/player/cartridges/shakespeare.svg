<svg viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Elizabethan Night Atmosphere Gradient -->
    <radialGradient id="globe-night-sky" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Heavens Canopy Celestial Stars -->
    <linearGradient id="heavens-celestial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Oak Timber Framing Gradient -->
    <linearGradient id="oak-timber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Stage Plank Floor -->
    <linearGradient id="stage-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="60%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Hell Trapdoor Underglow -->
    <radialGradient id="hell-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>

    <!-- Ethereal Hallucinated Dagger Glow -->
    <filter id="dagger-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Atmospheric Backdrop -->
  <rect width="800" height="480" fill="url(#globe-night-sky)"/>

  <!-- Static Stars / Bankside Night Sky -->
  <g opacity="0.35">
    <circle cx="80" cy="45" r="1.2" fill="#f8fafc"/>
    <circle cx="140" cy="80" r="0.8" fill="#f8fafc"/>
    <circle cx="210" cy="35" r="1.5" fill="#f8fafc"/>
    <circle cx="620" cy="40" r="1.0" fill="#f8fafc"/>
    <circle cx="710" cy="65" r="1.4" fill="#f8fafc"/>
    <circle cx="750" cy="110" r="0.9" fill="#f8fafc"/>
    <circle cx="340" cy="20" r="1.1" fill="#f8fafc"/>
  </g>

  <!-- HUD Title & 3D Spatial Badge -->
  <g id="globe-header" transform="translate(400, 26)">
    <text text-anchor="middle" fill="#fef08a" font-size="15" font-weight="900" letter-spacing="1">
      THE GLOBE THEATRE (1599) • 3D SPATIAL VECTOR STAGE
    </text>
    <text y="16" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">
      Bankside "Wooden O" • 360° Amphitheatre • Thrust Stage • Iambic Pentameter (da-DUM × 5)
    </text>
  </g>

  <!-- 3D Root Layer: In-Stage Projected Spatial Geometry -->
  <g id="globe-3d-stage-root">
    <!-- 3D "Wooden O" Amphitheatre Galleries (Concentric Rings in 3D Space) -->
    <ellipse id="globe-gallery-ring-3" cx="400" cy="210" rx="260" ry="105" fill="none" stroke="#78350f" stroke-width="8" opacity="0.45" stroke-dasharray="14 4"/>
    <ellipse id="globe-gallery-ring-2" cx="400" cy="225" rx="230" ry="92" fill="none" stroke="#92400e" stroke-width="7" opacity="0.55" stroke-dasharray="12 4"/>
    <ellipse id="globe-gallery-ring-1" cx="400" cy="240" rx="200" ry="80" fill="none" stroke="#b45309" stroke-width="6" opacity="0.65"/>

    <!-- Groundling Standing Yard (Inner 3D Floor Ring) -->
    <ellipse id="globe-yard-ring" cx="400" cy="250" rx="165" ry="65" fill="#1c1917" stroke="#44403c" stroke-width="3" opacity="0.8"/>

    <!-- Backstage Frons Scenae Wall (Projected 3D Polygon/Plane) -->
    <polygon id="globe-frons-scenae" points="290,130 510,130 510,230 290,230" fill="url(#oak-timber)" stroke="#d97706" stroke-width="2"/>

    <!-- The Heavens Canopy Roof (Projected 3D Overhang with Sun/Zodiac) -->
    <polygon id="globe-heavens-roof" points="260,75 540,75 510,135 290,135" fill="url(#heavens-celestial)" stroke="#38bdf8" stroke-width="2.5"/>
    <text id="globe-heavens-text" x="400" y="105" text-anchor="middle" fill="#fef08a" font-size="11" font-weight="900" letter-spacing="1">
      THE HEAVENS (Stars &amp; Zodiac)
    </text>

    <!-- Balcony / Upper Tarras (Juliet's Window) -->
    <rect id="globe-balcony-tarras" x="330" y="140" width="140" height="28" rx="2" fill="#292524" stroke="#f59e0b" stroke-width="1.8"/>
    <text id="globe-balcony-label" x="400" y="158" text-anchor="middle" fill="#fef3c7" font-size="9" font-weight="800">
      UPPER BALCONY / TARRAS (Juliet's Window)
    </text>

    <!-- Central Discovery Space (Inner Stage Doors) -->
    <rect id="globe-discovery-space" x="355" y="178" width="90" height="52" rx="3" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <text id="globe-discovery-label" x="400" y="206" text-anchor="middle" fill="#38bdf8" font-size="8" font-weight="bold">
      DISCOVERY SPACE
    </text>

    <!-- Twin Pillars of Hercules Supporting the Heavens Canopy (3D Lines) -->
    <line id="globe-pillar-left" x1="305" y1="130" x2="305" y2="255" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line id="globe-pillar-right" x1="495" y1="130" x2="495" y2="255" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>

    <!-- 3D Thrust Stage Platform (Extending into the Groundling Yard) -->
    <polygon id="globe-stage-platform" points="290,230 510,230 540,315 260,315" fill="url(#stage-wood)" stroke="#f59e0b" stroke-width="2.5"/>
    
    <!-- Stage Trapdoor ("Hell" - Supernatural Entrances for Ghosts & Witches) -->
    <rect id="globe-trapdoor-hell" x="365" y="260" width="70" height="24" rx="2" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
    <ellipse id="globe-trapdoor-glow" cx="400" cy="272" rx="32" ry="10" fill="url(#hell-fire)"/>
    <text id="globe-trapdoor-label" x="400" y="276" text-anchor="middle" fill="#fca5a5" font-size="8" font-weight="bold">
      TRAPDOOR (HELL)
    </text>

    <!-- 3D Actor Node: Macbeth Soliloquy Position -->
    <circle id="globe-actor-soliloquy" cx="400" cy="292" r="14" fill="#f59e0b" stroke="#fef08a" stroke-width="2"/>
    <text id="globe-actor-label" x="400" y="296" text-anchor="middle" fill="#451a03" font-size="9" font-weight="900">M</text>

    <!-- Floating Hallucinated Dagger ("Is this a dagger which I see before me?") -->
    <g id="globe-dagger" transform="translate(425, 270)" filter="url(#dagger-glow)">
      <path d="M 0 0 L 12 -4 L 8 0 L 12 4 Z" fill="#38bdf8"/>
      <line x1="-6" y1="0" x2="2" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="-2" y1="-3" x2="-2" y2="3" stroke="#e0e7ff" stroke-width="1.5"/>
    </g>

    <!-- Groundling Spectator Points Around the 3-Sided Stage Yard -->
    <g id="globe-groundlings" fill="#64748b" opacity="0.75">
      <circle cx="240" cy="285" r="4.5"/>
      <circle cx="230" cy="305" r="4.5"/>
      <circle cx="245" cy="325" r="4.5"/>
      <circle cx="280" cy="335" r="4.5"/>
      <circle cx="320" cy="342" r="4.5"/>
      <circle cx="360" cy="346" r="4.5"/>
      <circle cx="400" cy="348" r="4.5"/>
      <circle cx="440" cy="346" r="4.5"/>
      <circle cx="480" cy="342" r="4.5"/>
      <circle cx="520" cy="335" r="4.5"/>
      <circle cx="555" cy="325" r="4.5"/>
      <circle cx="570" cy="305" r="4.5"/>
      <circle cx="560" cy="285" r="4.5"/>
    </g>
  </g>

  <!-- Interactive 3D Orbit Camera Guide Prompt -->
  <g id="globe-orbit-prompt" transform="translate(400, 375)">
    <rect x="-180" y="-12" width="360" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.85"/>
    <text text-anchor="middle" y="4" fill="#38bdf8" font-size="10" font-weight="700">
      🔄 3D SPATIAL ORBIT • DRAG STAGE TO ROTATE CAMERA (θ, φ)
    </text>
  </g>

  <!-- Real-Time Iambic Pulse Line (EKG Heartbeat of the Bard) -->
  <g id="iambic-pulse-bar" transform="translate(100, 396)">
    <rect width="600" height="74" rx="10" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="300" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold" id="iambic-status-text">
      IAMBIC PENTAMETER (10 Syllables): da-DUM da-DUM da-DUM da-DUM da-DUM
    </text>
    <path id="iambic-wave" d="M 20 50 L 70 50 L 85 34 L 100 50 L 160 50 L 175 30 L 190 50 L 250 50 L 265 30 L 280 50 L 340 50 L 355 30 L 370 50 L 430 50 L 445 30 L 460 50 L 520 50 L 540 34 L 560 50 L 580 50" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle id="iambic-dot" cx="20" cy="50" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="300" y="66" text-anchor="middle" fill="#94a3b8" font-size="9" id="iambic-meter-sub">
      Standard Elizabethan Meter: 5 Iambs (Unstressed ∪ + Stressed /) = Human Heartbeat Pulse
    </text>
  </g>
</svg>
