<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cst-sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emerald-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0.9)" />
      <stop offset="60%" stop-color="rgba(16, 185, 129, 0.4)" />
      <stop offset="100%" stop-color="rgba(6, 78, 59, 0)" />
    </radialGradient>

    <!-- Gold Sunlight -->
    <linearGradient id="cst-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Earth Marble -->
    <linearGradient id="earth-ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <filter id="soft-glow-cst" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#cst-sky)" />

  <!-- Radiating Rays of Caritas (Divine Charity) -->
  <g opacity="0.25">
    <line x1="400" y1="180" x2="100" y2="40" stroke="#facc15" stroke-width="2" />
    <line x1="400" y1="180" x2="250" y2="20" stroke="#facc15" stroke-width="2" />
    <line x1="400" y1="180" x2="400" y2="10" stroke="#facc15" stroke-width="2.5" />
    <line x1="400" y1="180" x2="550" y2="20" stroke="#facc15" stroke-width="2" />
    <line x1="400" y1="180" x2="700" y2="40" stroke="#facc15" stroke-width="2" />
  </g>

  <!-- LEFT: Scales of Justice & Human Dignity Crown -->
  <g id="justice-section" transform="translate(180, 220)">
    <circle cx="0" cy="0" r="70" fill="#0f172a" stroke="#10b981" stroke-width="2" opacity="0.6" />
    
    <!-- Imago Dei Golden Crown -->
    <path d="M -30,-45 L -20,-20 L 0,-38 L 20,-20 L 30,-45 L 30,-15 L -30,-15 Z" fill="url(#cst-gold)" stroke="#a16207" stroke-width="1.5" filter="url(#soft-glow-cst)" />
    <circle cx="-30" cy="-45" r="3" fill="#ffffff" />
    <circle cx="0" cy="-38" r="3.5" fill="#ffffff" />
    <circle cx="30" cy="-45" r="3" fill="#ffffff" />
    
    <!-- Balance Scales of Social Justice (Rotatable) -->
    <g id="justice-scales">
      <!-- Fulcrum Column -->
      <line x1="0" y1="-10" x2="0" y2="50" stroke="#94a3b8" stroke-width="3" />
      <polygon points="-15,55 15,55 0,45" fill="#64748b" />
      <!-- Crossbeam -->
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#e2e8f0" stroke-width="3" />
      <!-- Left Pan -->
      <line x1="-35" y1="0" x2="-45" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="-35" y1="0" x2="-25" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M -50,25 Q -35,35 -20,25 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
      <!-- Right Pan -->
      <line x1="35" y1="0" x2="25" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="35" y1="0" x2="45" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M 20,25 Q 35,35 50,25 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    </g>

    <text x="0" y="80" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">
      1. Human Dignity
    </text>
    <text x="0" y="96" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="sans-serif">
      Imago Dei &bull; Infinite Worth
    </text>
  </g>

  <!-- CENTER: Global Neighbour Solidarity & Common Good (Earth in Hands) -->
  <g id="solidarity-section" transform="translate(400, 180)">
    <!-- Expanding Halo -->
    <circle id="solidarity-halo" cx="0" cy="0" r="55" fill="url(#emerald-glow)" opacity="0.6" filter="url(#soft-glow-cst)" />

    <!-- Planet Earth (Common Home) -->
    <circle cx="0" cy="0" r="42" fill="url(#earth-ocean)" stroke="#38bdf8" stroke-width="2" />
    <!-- Continents Shape -->
    <path d="M -25,-15 Q -10,-30 5,-20 Q 20,-10 15,10 Q 0,25 -15,15 Q -30,5 -25,-15 Z" fill="#22c55e" opacity="0.8" />
    <path d="M 10,10 Q 25,15 20,30 Q 5,30 10,10 Z" fill="#16a34a" opacity="0.8" />

    <!-- Embracing Hands of Solidarity underneath -->
    <path d="M -55,30 C -45,10 -25,40 0,45 C 25,40 45,10 55,30 C 40,55 -40,55 -55,30 Z" fill="#ca8a04" opacity="0.9" stroke="#facc15" stroke-width="1.5" />

    <!-- Cross of Caritas rising from Earth -->
    <line x1="0" y1="-42" x2="0" y2="-65" stroke="#facc15" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-12" y1="-56" x2="12" y2="-56" stroke="#facc15" stroke-width="3" stroke-linecap="round" />

    <text x="0" y="70" text-anchor="middle" fill="#fef08a" font-size="13" font-weight="800" font-family="sans-serif">
      Solidarity &amp; Common Good
    </text>
    <text x="0" y="85" text-anchor="middle" fill="#a7f3d0" font-size="9.5" font-family="sans-serif">
      "We Are One Global Family" &bull; Luke 10
    </text>
  </g>

  <!-- RIGHT: Care for Creation (Laudato Si' Living Seedling) -->
  <g id="creation-section" transform="translate(620, 220)">
    <circle cx="0" cy="0" r="70" fill="#0f172a" stroke="#10b981" stroke-width="2" opacity="0.6" />

    <!-- Rich Earth Soil Mound -->
    <path d="M -45,35 Q 0,15 45,35 Q 0,48 -45,35 Z" fill="#78350f" stroke="#92400e" stroke-width="1.5" />

    <!-- Sprouting Living Seedling (Scalable) -->
    <g id="seedling-node" transform="translate(0, 20)">
      <g id="seedling-stem">
        <!-- Sprout Stalk -->
        <path d="M 0,10 Q -5,-15 0,-35" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
        <!-- Left Leaf -->
        <path d="M -2,-25 Q -25,-40 -15,-15 Q -5,-18 -2,-25 Z" fill="#4ade80" stroke="#16a34a" stroke-width="1" />
        <!-- Right Leaf -->
        <path d="M 0,-32 Q 25,-45 15,-20 Q 5,-24 0,-32 Z" fill="#22c55e" stroke="#15803d" stroke-width="1" />
        <!-- Dewdrop Glistening on Tip -->
        <circle cx="0" cy="-36" r="3" fill="#bae6fd" filter="url(#soft-glow-cst)" />
      </g>
    </g>

    <text x="0" y="80" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">
      Care for Creation
    </text>
    <text x="0" y="96" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="sans-serif">
      Laudato Si' &bull; Our Common Home
    </text>
  </g>

  <!-- Interactive 7-Pillars Dial at Bottom -->
  <g id="cst-dial-container" transform="translate(0, 420)">
    <!-- Selector Track -->
    <rect x="110" y="5" width="580" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="2" />
    
    <!-- Ticks & Labels for the 7 CST Pillars -->
    <text x="135" y="21" fill="#ecfdf5" font-size="9.5" font-weight="bold" font-family="sans-serif">1. Dignity</text>
    <text x="215" y="21" fill="#ecfdf5" font-size="9.5" font-weight="bold" font-family="sans-serif">2. Common Good</text>
    <text x="320" y="21" fill="#ecfdf5" font-size="9.5" font-weight="bold" font-family="sans-serif">3. Solidarity</text>
    <text x="400" y="21" fill="#ecfdf5" font-size="9.5" font-weight="bold" font-family="sans-serif">4. Subsidiarity</text>
    <text x="495" y="21" fill="#ecfdf5" font-size="9.5" font-weight="bold" font-family="sans-serif">5. Option for Poor</text>
    <text x="595" y="21" fill="#ecfdf5" font-size="9.5" font-weight="bold" font-family="sans-serif">6. Work</text>
    <text x="655" y="21" fill="#ecfdf5" font-size="9.5" font-weight="bold" font-family="sans-serif">7. Creation</text>

    <!-- Draggable Knob -->
    <g id="cst-compass-dial" cursor="ew-resize" transform="translate(135, 17)">
      <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="2" filter="url(#soft-glow-cst)" />
      <circle cx="0" cy="0" r="6" fill="#064e3b" />
    </g>
  </g>
</svg>
