<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filter effects for sacred glow -->
    <filter id="triduum-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="flame-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="lucernarium-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="rgba(251, 191, 36, 0.45)" />
      <stop offset="45%" stop-color="rgba(217, 119, 6, 0.20)" />
      <stop offset="85%" stop-color="rgba(15, 23, 42, 0.08)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="paschal-wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#fffbeb" />
      <stop offset="80%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gold-triduum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.9)" />
      <stop offset="50%" stop-color="rgba(245, 158, 11, 0.4)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <!-- Deep Sacred Sanctuary Interior Night -->
  <rect x="0" y="0" width="800" height="480" fill="#060913" />

  <!-- Ambient Lucernarium Light Sphere (controlled by AST bindings) -->
  <circle id="lucernarium-glow" cx="400" cy="240" r="380" fill="url(#lucernarium-glow)" opacity="0.65" />

  <!-- Background Architecture: Gothic Nave Arches -->
  <path d="M 80 480 L 80 200 Q 200 60 320 200 L 320 480 Z" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 480 480 L 480 200 Q 600 60 720 200 L 720 480 Z" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 280 480 L 280 150 Q 400 20 520 150 L 520 480 Z" fill="none" stroke="#334155" stroke-width="2.5" />

  <!-- Stepped Dais Floor -->
  <polygon points="40 480 760 480 700 420 100 420" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <polygon points="100 420 700 420 650 370 150 370" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

  <!-- Left: Holy Thursday Upper Room Eucharistic Memorial -->
  <g id="upper-room-station" transform="translate(100, 240)">
    <rect x="-40" y="30" width="80" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M -20 30 L 20 30 L 15 10 L -15 10 Z" fill="url(#gold-triduum)" stroke="#d97706" />
    <ellipse cx="0" cy="8" rx="14" ry="4" fill="#fde047" />
    <!-- Golden Chalice -->
    <path d="M -10 10 Q -12 25 0 25 Q 12 25 10 10 Z" fill="url(#gold-triduum)" stroke="#b45309" stroke-width="1" />
    <rect x="-2" y="25" width="4" height="15" fill="#f59e0b" />
    <ellipse cx="0" cy="40" rx="10" ry="3" fill="#d97706" />
    <!-- White Host above Chalice -->
    <circle cx="0" cy="-6" r="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="0" y="-3" fill="#d97706" font-size="7" font-weight="900" text-anchor="middle">✠</text>
    <text x="0" y="80" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="middle">HOLY THURSDAY</text>
    <text x="0" y="93" fill="#eab308" font-size="8" text-anchor="middle">Coena Domini</text>
  </g>

  <!-- Right: Good Friday Golgotha Cross of Redemption -->
  <g id="calvary-station" transform="translate(700, 240)">
    <!-- Golgotha Hill -->
    <ellipse cx="0" cy="80" rx="60" ry="25" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Wood Cross -->
    <rect x="-4" y="-30" width="8" height="90" rx="1" fill="#78350f" stroke="#451a03" stroke-width="1" />
    <rect x="-22" y="-12" width="44" height="7" rx="1" fill="#78350f" stroke="#451a03" stroke-width="1" />
    <!-- INRI titulus -->
    <rect x="-8" y="-38" width="16" height="7" rx="1" fill="#fef3c7" />
    <text x="0" y="-33" fill="#78350f" font-size="5" font-weight="900" text-anchor="middle">INRI</text>
    <!-- Crimson Drops -->
    <circle cx="0" cy="40" r="2.5" fill="#ef4444" opacity="0.9" />
    <text x="0" y="80" fill="#94a3b8" font-size="9" font-weight="bold" text-anchor="middle">GOOD FRIDAY</text>
    <text x="0" y="93" fill="#ef4444" font-size="8" text-anchor="middle">Passio Domini</text>
  </g>

  <!-- CENTER: The Great Paschal Candle & Resurrection Victory -->
  <g id="paschal-candle-beacon" transform="translate(400, 160)" style="cursor: grab;">
    <!-- Easter Carillon Waves -->
    <circle id="easter-carillon-wave" cx="0" cy="-55" r="75" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4" stroke-dasharray="4 3" />
    <circle cx="0" cy="-55" r="110" fill="none" stroke="#fde047" stroke-width="1" opacity="0.25" stroke-dasharray="6 4" />

    <!-- Easter Sunburst Ray Layer -->
    <g id="glory-cross-rays" opacity="0.95">
      <circle cx="0" cy="-55" r="60" fill="url(#sunburst)" />
      <line x1="-70" y1="-55" x2="70" y2="-55" stroke="#fde047" stroke-width="2" opacity="0.8" />
      <line x1="0" y1="-125" x2="0" y2="15" stroke="#fde047" stroke-width="2" opacity="0.8" />
      <line x1="-50" y1="-105" x2="50" y2="-5" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" />
      <line x1="-50" y1="-5" x2="50" y2="-105" stroke="#fbbf24" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- Candlestick Ornate Bronze Base -->
    <polygon points="-25 210 25 210 18 190 -18 190" fill="#78350f" stroke="#ca8a04" stroke-width="2" />
    <rect x="-8" y="140" width="16" height="50" fill="url(#gold-triduum)" stroke="#b45309" stroke-width="1.5" />
    <ellipse cx="0" cy="140" rx="20" ry="6" fill="#f59e0b" stroke="#78350f" stroke-width="1.5" />

    <!-- Paschal Candle Pillar (Pure Beeswax Wax Column) -->
    <rect x="-14" y="-40" width="28" height="180" rx="3" fill="url(#paschal-wax)" stroke="#b45309" stroke-width="1.5" />

    <!-- Inscribed Red Cross with Gold Trim -->
    <rect x="-3" y="10" width="6" height="80" rx="1" fill="#dc2626" stroke="#fbbf24" stroke-width="0.8" />
    <rect x="-11" y="30" width="22" height="6" rx="1" fill="#dc2626" stroke="#fbbf24" stroke-width="0.8" />

    <!-- Five Sacred Grains of Incense (The 5 Holy Wounds) -->
    <circle cx="0" cy="12" r="3.5" fill="#fef08a" stroke="#991b1b" stroke-width="1.5" />
    <circle cx="-10" cy="33" r="3.5" fill="#fef08a" stroke="#991b1b" stroke-width="1.5" />
    <circle cx="10" cy="33" r="3.5" fill="#fef08a" stroke="#991b1b" stroke-width="1.5" />
    <circle cx="0" cy="50" r="3.5" fill="#fef08a" stroke="#991b1b" stroke-width="1.5" />
    <circle cx="0" cy="88" r="3.5" fill="#fef08a" stroke="#991b1b" stroke-width="1.5" />

    <!-- Greek Letter Alpha (Α) above the cross -->
    <text x="0" y="4" fill="#7f1d1d" font-size="12" font-weight="900" font-family="serif" text-anchor="middle">Α</text>

    <!-- Greek Letter Omega (Ω) below the cross -->
    <text x="0" y="106" fill="#7f1d1d" font-size="11" font-weight="900" font-family="serif" text-anchor="middle">Ω</text>

    <!-- Year Numerals around the Cross (2 0 2 6) -->
    <text x="-9" y="24" fill="#78350f" font-size="7" font-weight="bold" text-anchor="middle">2</text>
    <text x="9" y="24" fill="#78350f" font-size="7" font-weight="bold" text-anchor="middle">0</text>
    <text x="-9" y="75" fill="#78350f" font-size="7" font-weight="bold" text-anchor="middle">2</text>
    <text x="9" y="75" fill="#78350f" font-size="7" font-weight="bold" text-anchor="middle">6</text>

    <!-- Wick and Living Flame of the Risen Christ -->
    <line x1="0" y1="-40" x2="0" y2="-48" stroke="#1f2937" stroke-width="2" />
    <!-- Outer Flame Halo -->
    <circle id="paschal-candle-flame" cx="0" cy="-56" r="14" fill="#fef08a" filter="url(#flame-blur)" />
    <!-- Core Teardrop Flame -->
    <path d="M 0 -72 C -9 -58, -7 -46, 0 -46 C 7 -46, 9 -58, 0 -72 Z" fill="#f59e0b" />
    <path d="M 0 -68 C -5 -58, -4 -48, 0 -48 C 4 -48, 5 -58, 0 -68 Z" fill="#ffffff" />

    <!-- Proclamation Banners -->
    <rect x="-85" y="222" width="170" height="28" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="236" fill="#fef08a" font-size="10" font-weight="bold" letter-spacing="2" text-anchor="middle">
      LUMEN CHRISTI
    </text>
    <text x="0" y="246" fill="#6ee7b7" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="middle">
      DEO GRATIAS!
    </text>
  </g>

  <!-- Bottom Interactive Liturgical Banner -->
  <rect x="150" y="440" width="500" height="30" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1" />
  <text x="400" y="459" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">
    SACRUM TRIDUUM PASCHALE &bull; ONE UNBROKEN LITURGY OF SALVATION
  </text>
</svg>
