<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="posture-ambience" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="rgba(30, 58, 138, 0.4)" />
      <stop offset="70%" stop-color="rgba(15, 23, 42, 0.85)" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>
    <radialGradient id="tabernacle-red-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="figure-robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Deep Sacred Sanctuary Interior Night -->
  <rect x="0" y="0" width="800" height="480" fill="#050814" />
  <circle cx="400" cy="220" r="360" fill="url(#posture-ambience)" />

  <!-- Sanctuary Stepped Stone Dais -->
  <polygon points="60 460 740 460 680 390 120 390" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <polygon points="120 390 680 390 630 340 170 340" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

  <!-- Background Left: The Consecrated Altar & Crucifix -->
  <g transform="translate(160, 260)">
    <rect x="-55" y="20" width="110" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <polygon points="-65 20 65 20 60 10 -60 10" fill="#e2e8f0" stroke="#f8fafc" stroke-width="1" />
    <!-- Altar Crucifix -->
    <rect x="-2" y="-30" width="4" height="40" fill="#ca8a04" />
    <rect x="-10" y="-20" width="20" height="3" fill="#ca8a04" />
    <text x="0" y="94" fill="#94a3b8" font-size="8" font-weight="bold" text-anchor="middle">ALTAR OF SACRIFICE</text>
  </g>

  <!-- Background Right: The Tabernacle & Undying Red Lamp -->
  <g transform="translate(640, 250)">
    <!-- Tabernacle Pillar Pedestal -->
    <rect x="-40" y="30" width="80" height="60" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <!-- Golden Tabernacle Shrine -->
    <rect x="-28" y="-15" width="56" height="45" rx="3" fill="#ca8a04" stroke="#fef08a" stroke-width="1.5" />
    <polygon points="-28 -15 28 -15 0 -35" fill="#a16207" stroke="#fde047" stroke-width="1" />
    <circle cx="0" cy="8" r="8" fill="#713f12" stroke="#facc15" stroke-width="1" />
    <text x="0" y="11" fill="#fef08a" font-size="8" font-weight="bold" text-anchor="middle">IHS</text>
    <!-- Perpetual Red Sanctuary Lamp (Canon 940) -->
    <circle cx="42" cy="0" r="14" fill="url(#tabernacle-red-lamp)" />
    <circle cx="42" cy="0" r="4" fill="#fca5a5" />
    <text x="0" y="104" fill="#94a3b8" font-size="8" font-weight="bold" text-anchor="middle">TABERNACLE (REAL PRESENCE)</text>
  </g>

  <!-- CENTER: The Faithful Pilgrim in Sacred Posture -->
  <g id="posture-figure-beacon" transform="translate(400, 230)" style="cursor: grab;">
    <!-- Head Halo of Spiritual Presence -->
    <circle cx="0" cy="-75" r="24" fill="none" stroke="#fde047" stroke-width="1.5" opacity="0.6" stroke-dasharray="2 3" />

    <!-- Sign of the Cross Trace Lines (bound to AST crossSignProgress) -->
    <g id="cross-trace-stroke" opacity="0.9" stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <!-- Vertical Forehead to Breast -->
      <line x1="0" y1="-85" x2="0" y2="-10" />
      <!-- Horizontal Left to Right Shoulder -->
      <line x1="-30" y1="-45" x2="30" y2="-45" />
      <circle cx="0" cy="-85" r="4" fill="#38bdf8" />
      <circle cx="0" cy="-10" r="4" fill="#38bdf8" />
      <circle cx="-30" cy="-45" r="4" fill="#38bdf8" />
      <circle cx="30" cy="-45" r="4" fill="#38bdf8" />
    </g>

    <!-- Torso and Head (rotates on profound bow via AST bindings) -->
    <g id="pilgrim-figure-torso">
      <!-- Head -->
      <circle cx="0" cy="-75" r="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Torso with White Albe / Robe -->
      <path d="M -18 -55 L 18 -55 L 24 30 L -24 30 Z" fill="url(#figure-robe)" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Folded Hands in Prayer (Palms pressed together) -->
      <path d="M -6 -35 L 6 -35 L 3 -12 L -3 -12 Z" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <text x="0" y="-20" fill="#0284c7" font-size="7" font-weight="bold" text-anchor="middle">🙏</text>
    </g>

    <!-- Legs & Knees (adjusts for Stand, Kneel, Genuflect via AST bindings) -->
    <g id="pilgrim-knees-group">
      <!-- Left Leg (Standing/Support) -->
      <rect x="-16" y="30" width="12" height="70" rx="3" fill="#475569" stroke="#334155" />
      <!-- Right Leg (Genuflecting/Kneeling) -->
      <rect x="4" y="30" width="12" height="70" rx="3" fill="#475569" stroke="#334155" />
      <!-- Feet -->
      <ellipse cx="-10" cy="102" rx="10" ry="4" fill="#1e293b" />
      <ellipse cx="10" cy="102" rx="10" ry="4" fill="#1e293b" />
    </g>

    <!-- Prie-Dieu / Kneeler Pad on Floor -->
    <rect x="-45" y="98" width="90" height="12" rx="3" fill="#854d0e" stroke="#ca8a04" stroke-width="1" />
    <rect x="-40" y="94" width="80" height="5" rx="1" fill="#dc2626" />
  </g>

  <!-- Bottom Liturgical Inscription Banner -->
  <rect x="130" y="442" width="540" height="28" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" stroke-width="1" />
  <text x="400" y="460" fill="#f8fafc" font-size="10.5" font-weight="bold" text-anchor="middle" letter-spacing="1">
    GESTUS SACRI &bull; STANDING &bull; KNEELING &bull; GENUFLECTION &bull; BOW &bull; SIGN OF THE CROSS
  </text>
</svg>
