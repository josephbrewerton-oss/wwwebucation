<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <defs>
    <linearGradient id="phet-wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="phet-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="480" fill="#090d16"/>
  <text x="400" y="42" fill="#f8fafc" font-size="22" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
    PhET Distilled: Ohm's Law (V = I × R)
  </text>
  <text x="400" y="66" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">
    Adjust Voltage (↑/↓) &amp; Resistance (←/→) • Sub-4 KB Pure AST Vector Invariant
  </text>

  <!-- Circuit Wire Loop -->
  <rect x="140" y="110" width="520" height="260" rx="24" fill="none" stroke="#334155" stroke-width="12"/>
  <rect id="active-wire" x="140" y="110" width="520" height="260" rx="24" fill="none" stroke="url(#phet-wire)" stroke-width="4" stroke-dasharray="16 12"/>

  <!-- Battery (Voltage Source) -->
  <g id="battery-unit" transform="translate(90, 200)" style="cursor: pointer;"
     data-pedagogical="ohms-battery"
     data-pedagogical-title="Variable DC Voltage Source"
     data-pedagogical-eq="V = I × R (Volts)"
     data-pedagogical-desc="Click or use Up/Down Arrow keys to adjust electromotive potential difference across the circuit.">
    <rect width="100" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <rect x="35" y="-12" width="30" height="12" rx="3" fill="#60a5fa"/>
    <text id="phet-volt-txt" x="50" y="44" fill="#38bdf8" font-size="18" font-weight="900" text-anchor="middle" font-family="monospace">12.0 V</text>
    <text x="50" y="64" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">VOLTAGE (V)</text>
  </g>

  <!-- Resistor Unit -->
  <g id="resistor-unit" transform="translate(360, 92)" style="cursor: pointer;"
     data-pedagogical="ohms-resistor"
     data-pedagogical-title="Carbon-Film Precision Resistor"
     data-pedagogical-eq="R = ρL / A (Ohms Ω)"
     data-pedagogical-desc="Color bands encode ohmic value. Increasing resistance reduces current I inversely.">
    <rect width="80" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <line x1="20" y1="6" x2="20" y2="30" stroke="#ef4444" stroke-width="4"/>
    <line x1="34" y1="6" x2="34" y2="30" stroke="#10b981" stroke-width="4"/>
    <line x1="48" y1="6" x2="48" y2="30" stroke="#f59e0b" stroke-width="4"/>
    <line x1="62" y1="6" x2="62" y2="30" stroke="#eab308" stroke-width="4"/>
    <text id="phet-res-txt" x="40" y="-10" fill="#facc15" font-size="14" font-weight="900" text-anchor="middle" font-family="monospace">4.0 Ω</text>
  </g>

  <!-- Lightbulb / Load -->
  <g id="lightbulb" transform="translate(620, 205)"
     data-pedagogical="ohms-load"
     data-pedagogical-title="Resistive Lamp Load"
     data-pedagogical-eq="P = V × I (Watts)"
     data-pedagogical-desc="Radiant brightness scales with electrical power dissipated across the filament.">
    <circle id="phet-bulb-halo" cx="40" cy="35" r="32" fill="rgba(250, 204, 21, 0.25)" stroke="#facc15" stroke-width="3" filter="url(#phet-glow)"/>
    <path d="M 28 35 Q 40 15 52 35" fill="none" stroke="#fef08a" stroke-width="3"/>
    <text id="phet-power-txt" x="40" y="85" fill="#fde08a" font-size="12" font-weight="800" text-anchor="middle">36.0 W</text>
  </g>

  <!-- Dynamic Current Display Readout -->
  <g transform="translate(230, 396)">
    <rect width="340" height="58" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="170" y="23" fill="#86efac" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">OHM'S LAW CURRENT (I = V / R)</text>
    <text id="current-readout" x="170" y="46" fill="#22c55e" font-size="19" font-weight="900" text-anchor="middle" font-family="monospace">
      I = 3.00 Amperes (36.0 W)
    </text>
  </g>
</svg>