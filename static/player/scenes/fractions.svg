<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="frac-stage-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- 3D Glassmorphic Blue Slice 1 (Half Circle) -->
    <radialGradient id="frac-blue-half" cx="48%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.95" />
    </radialGradient>

    <!-- 3D Glassmorphic Quarter A (Top Quarter) -->
    <radialGradient id="frac-blue-qa" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#1d4ed8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.95" />
    </radialGradient>

    <!-- 3D Glassmorphic Quarter B (Bottom Quarter) -->
    <radialGradient id="frac-blue-qb" cx="40%" cy="65%" r="75%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#2563eb" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#1e40af" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#172554" stop-opacity="0.95" />
    </radialGradient>

    <!-- 3D Glassmorphic Emerald Slice (Green Quarter) -->
    <radialGradient id="frac-emerald-gem" cx="30%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.95" />
    </radialGradient>

    <!-- Intense Sci-Fi Neon Laser Bloom Filter -->
    <filter id="frac-laser-bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blurWide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blurTight" />
      <feMerge>
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Laser Dot Focal Glare Filter -->
    <filter id="frac-glare-filter" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="flare" />
      <feMerge>
        <feMergeNode in="flare" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Crisp Drop Shadow for Typography -->
    <filter id="frac-text-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Frosted HUD Card Shadow -->
    <filter id="frac-hud-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Glass HUD Border Gradient -->
    <linearGradient id="frac-hud-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Frosted HUD Background Gradient -->
    <linearGradient id="frac-hud-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="800" height="480" fill="url(#frac-stage-glow)" />

  <!-- Holographic Reticle Grid &amp; Circular Compass -->
  <circle cx="400" cy="240" r="150" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 9" opacity="0.6" />
  <circle id="frac-guide" cx="400" cy="240" r="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" opacity="0.45" />
  <circle cx="400" cy="240" r="140" fill="#0f172a" fill-opacity="0.4" />
  <!-- Compass crosshairs -->
  <line x1="250" y1="240" x2="550" y2="240" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.5" />
  <line x1="400" y1="90" x2="400" y2="390" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.5" />

  <!-- Original 1/2 Slice (Rendered as 3D Glossy Sapphire Gem) -->
  <path
    id="frac-slice1"
    d="M 400 100 A 140 140 0 0 1 400 380 Z"
    fill="url(#frac-blue-half)"
    stroke="#93c5fd"
    stroke-width="2.5"
    opacity="0.8"
  />
  <text
    id="frac-slice1-txt"
    x="465"
    y="248"
    fill="#ffffff"
    font-size="26"
    font-weight="800"
    text-anchor="middle"
    filter="url(#frac-text-shadow)"
    letter-spacing="1"
  >
    1/2
  </text>

  <!-- Equivalence Slices (Two 1/4 pieces creating 2/4) -->
  <path
    id="frac-qa"
    d="M 400 100 A 140 140 0 0 1 540 240 L 400 240 Z"
    fill="url(#frac-blue-qa)"
    stroke="#bfdbfe"
    stroke-width="2"
    opacity="0"
  />
  <text
    id="frac-qa-txt"
    x="455"
    y="198"
    fill="#ffffff"
    font-size="20"
    font-weight="800"
    text-anchor="middle"
    filter="url(#frac-text-shadow)"
    opacity="0"
  >
    1/4
  </text>

  <path
    id="frac-qb"
    d="M 400 240 L 540 240 A 140 140 0 0 1 400 380 Z"
    fill="url(#frac-blue-qb)"
    stroke="#93c5fd"
    stroke-width="2"
    opacity="0"
  />
  <text
    id="frac-qb-txt"
    x="455"
    y="298"
    fill="#ffffff"
    font-size="20"
    font-weight="800"
    text-anchor="middle"
    filter="url(#frac-text-shadow)"
    opacity="0"
  >
    1/4
  </text>

  <!-- Green Emerald Quarter Slice (1/4 to add) -->
  <path
    id="frac-qgreen"
    d="M 220 240 L 80 240 A 140 140 0 0 1 220 100 Z"
    fill="url(#frac-emerald-gem)"
    stroke="#6ee7b7"
    stroke-width="2.5"
  />
  <text
    id="frac-qgreen-txt"
    x="165"
    y="195"
    fill="#ffffff"
    font-size="22"
    font-weight="800"
    text-anchor="middle"
    filter="url(#frac-text-shadow)"
  >
    1/4
  </text>

  <!-- High-Energy Equivalence Cutting Laser Beam -->
  <line
    id="frac-laser-line"
    x1="395"
    y1="240"
    x2="400"
    y2="240"
    stroke="#f43f5e"
    stroke-width="4.5"
    stroke-linecap="round"
    filter="url(#frac-laser-bloom)"
    opacity="0"
  />

  <!-- Laser Cutting Focal Point Glare Spark -->
  <circle
    id="frac-laser-dot"
    cx="400"
    cy="240"
    r="7"
    fill="#ffffff"
    stroke="#fb7185"
    stroke-width="3"
    filter="url(#frac-glare-filter)"
    opacity="0"
  />

  <!-- Top Formula HUD Pill (Frosted Glassmorphism) -->
  <g filter="url(#frac-hud-shadow)">
    <rect
      x="200"
      y="22"
      width="400"
      height="46"
      rx="23"
      fill="url(#frac-hud-bg)"
      stroke="url(#frac-hud-border)"
      stroke-width="1.5"
    />
    <text
      id="frac-math-txt"
      x="400"
      y="51"
      fill="#38bdf8"
      font-size="19"
      font-weight="800"
      text-anchor="middle"
      letter-spacing="0.5"
      filter="url(#frac-text-shadow)"
    >
      1/2 + 1/4 = ?
    </text>
  </g>
</svg>
