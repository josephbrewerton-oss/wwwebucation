<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="crimson-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="wall-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="calvary-sky" cx="68%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(153, 27, 27, 0.45)" />
      <stop offset="45%" stop-color="rgba(30, 27, 75, 0.6)" />
      <stop offset="100%" stop-color="#070a13" />
    </radialGradient>
    <radialGradient id="easter-dawn" cx="72%" cy="32%" r="40%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.85)" />
      <stop offset="40%" stop-color="rgba(234, 179, 8, 0.45)" />
      <stop offset="80%" stop-color="rgba(234, 88, 12, 0.15)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="candle-radiance" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="rgba(234, 179, 8, 0.4)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Deep Sacred Jerusalem Sky Backdrop -->
  <rect x="0" y="0" width="800" height="480" fill="#070a13" />
  <rect x="0" y="0" width="800" height="480" fill="url(#calvary-sky)" />

  <!-- Stars & Sacred Atmosphere -->
  <g opacity="0.35">
    <circle cx="120" cy="45" r="1" fill="#fff" />
    <circle cx="210" cy="70" r="1.5" fill="#fef08a" />
    <circle cx="340" cy="35" r="1" fill="#fff" />
    <circle cx="480" cy="60" r="1.2" fill="#fff" />
    <circle cx="620" cy="40" r="1.8" fill="#fef08a" />
    <circle cx="750" cy="55" r="1" fill="#fff" />
  </g>

  <!-- Distant Jerusalem Old City Walls & Temple Mount Silhouette -->
  <path d="M 0 260 L 40 250 L 40 230 L 60 230 L 60 250 L 100 245 L 100 220 L 125 220 L 125 245 L 180 250 L 220 235 L 240 235 L 240 255 L 310 260 L 360 240 L 380 240 L 400 265 L 490 270 L 800 280 L 800 480 L 0 480 Z" fill="#0c1322" />
  <path d="M 0 310 Q 150 280 320 300 Q 480 320 620 280 Q 720 250 800 260 L 800 480 L 0 480 Z" fill="#111827" />

  <!-- Mount Calvary (Golgotha Hill) Silhouette -->
  <path d="M 460 320 Q 550 210 610 200 Q 670 215 720 300 Q 760 330 800 340 L 800 480 L 460 480 Z" fill="#181f2f" stroke="#334155" stroke-width="1.5" />

  <!-- Easter Dawn Sunburst Aura (Animated at t >= 0.96) -->
  <circle id="easter-halo-sun" cx="610" cy="180" r="160" fill="url(#easter-dawn)" opacity="0" filter="url(#glow)" />

  <!-- Calvary Three Crosses on Golgotha -->
  <g id="calvary-crosses" opacity="0.9">
    <!-- Left Thief Cross -->
    <line x1="560" y1="230" x2="560" y2="155" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="548" y1="175" x2="572" y2="175" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

    <!-- Central Cross of Christ (The Holy Rood) -->
    <g filter="url(#glow)">
      <!-- Radiant Cross Aura -->
      <circle id="calvary-glow" cx="610" cy="140" r="50" fill="url(#candle-radiance)" opacity="0.3" />
      <line x1="610" y1="235" x2="610" y2="115" stroke="url(#gold-grad)" stroke-width="4.5" stroke-linecap="round" />
      <line x1="592" y1="145" x2="628" y2="145" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" />
      <!-- INRI Titulus Crucis -->
      <rect x="604" y="118" width="12" height="7" rx="1.5" fill="#fef08a" stroke="#a16207" stroke-width="0.8" />
    </g>

    <!-- Right Thief Cross -->
    <line x1="660" y1="235" x2="660" y2="160" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="648" y1="180" x2="672" y2="180" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- The Holy Sepulchre (Rock-Hewn Tomb) on the Right Slope -->
  <g class="ast-hotspot" data-target-t="0.94" data-label="Station XIV: Laid in the Tomb" style="cursor: pointer;">
    <!-- Cave Entrance -->
    <path d="M 710 330 Q 740 280 770 330 Z" fill="#020617" stroke="#475569" stroke-width="2" />
    <!-- Rolled Stone Disc -->
    <circle cx="718" cy="326" r="22" fill="#334155" stroke="#64748b" stroke-width="2" />
    <!-- Garden Olive Tree Branch -->
    <path d="M 770 330 Q 785 300 795 270" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
    <circle cx="792" cy="275" r="4" fill="#15803d" />
    <circle cx="785" cy="285" r="5" fill="#16a34a" />
  </g>

  <!-- The Praetorium / Roman Pilate Court on the Left -->
  <g class="ast-hotspot" data-target-t="0.02" data-label="Station I: Jesus is Condemned" style="cursor: pointer;">
    <rect x="25" y="240" width="85" height="110" rx="3" fill="url(#wall-stone)" stroke="#475569" stroke-width="2" />
    <!-- Roman Arch Entrance -->
    <path d="M 45 350 L 45 285 Q 67 265 90 285 L 90 350 Z" fill="#050811" stroke="#64748b" stroke-width="1.5" />
    <!-- Pilate Roman Inscription Plaque & SPQR Banner -->
    <rect x="42" y="248" width="50" height="12" rx="2" fill="#7f1d1d" stroke="#b91c1c" stroke-width="1" />
    <text x="67" y="257" fill="#fef08a" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle">S • P • Q • R</text>
    <!-- Stone Basin of Water (Pilate washing hands) -->
    <ellipse cx="67" cy="320" rx="14" ry="5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
    <ellipse cx="67" cy="319" rx="10" ry="3" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Winding Cobblestone Via Dolorosa Pilgrimage Route -->
  <path d="M 60 380 Q 140 350 220 330 T 360 280 T 520 240 T 610 235 T 730 330" fill="none" stroke="#2a3649" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 60 380 Q 140 350 220 330 T 360 280 T 520 240 T 610 235 T 730 330" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 60 380 Q 140 350 220 330 T 360 280 T 520 240 T 610 235 T 730 330" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.6" />

  <!-- 14 Station Waypoints with Traditional Roman Numerals & Vigil Candles -->
  <!-- Station I -->
  <g class="ast-hotspot" data-target-t="0.02" data-label="Station I: Jesus is Condemned" style="cursor: pointer;">
    <circle cx="75" cy="375" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="75" y="379" fill="#fef08a" font-size="9" font-weight="bold" font-family="serif" text-anchor="middle">I</text>
  </g>

  <!-- Station II -->
  <g class="ast-hotspot" data-target-t="0.09" data-label="Station II: Takes up His Cross" style="cursor: pointer;">
    <circle cx="125" cy="355" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="125" y="359" fill="#fef08a" font-size="8" font-weight="bold" font-family="serif" text-anchor="middle">II</text>
  </g>

  <!-- Station III -->
  <g class="ast-hotspot" data-target-t="0.16" data-label="Station III: Falls 1st Time" style="cursor: pointer;">
    <circle cx="175" cy="340" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="175" y="344" fill="#fef08a" font-size="7.5" font-weight="bold" font-family="serif" text-anchor="middle">III</text>
  </g>

  <!-- Station IV -->
  <g class="ast-hotspot" data-target-t="0.23" data-label="Station IV: Meets His Mother" style="cursor: pointer;">
    <circle cx="225" cy="325" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="225" y="329" fill="#fef08a" font-size="8" font-weight="bold" font-family="serif" text-anchor="middle">IV</text>
  </g>

  <!-- Station V -->
  <g class="ast-hotspot" data-target-t="0.30" data-label="Station V: Simon of Cyrene" style="cursor: pointer;">
    <circle cx="275" cy="305" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="275" y="309" fill="#fef08a" font-size="8" font-weight="bold" font-family="serif" text-anchor="middle">V</text>
  </g>

  <!-- Station VI -->
  <g class="ast-hotspot" data-target-t="0.37" data-label="Station VI: Veronica's Veil" style="cursor: pointer;">
    <circle cx="325" cy="290" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="325" y="294" fill="#fef08a" font-size="7.5" font-weight="bold" font-family="serif" text-anchor="middle">VI</text>
  </g>

  <!-- Station VII -->
  <g class="ast-hotspot" data-target-t="0.44" data-label="Station VII: Falls 2nd Time" style="cursor: pointer;">
    <circle cx="375" cy="275" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="375" y="279" fill="#fef08a" font-size="7" font-weight="bold" font-family="serif" text-anchor="middle">VII</text>
  </g>

  <!-- Station VIII -->
  <g class="ast-hotspot" data-target-t="0.51" data-label="Station VIII: Consoles Women" style="cursor: pointer;">
    <circle cx="425" cy="260" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="425" y="264" fill="#fef08a" font-size="6.5" font-weight="bold" font-family="serif" text-anchor="middle">VIII</text>
  </g>

  <!-- Station IX -->
  <g class="ast-hotspot" data-target-t="0.58" data-label="Station IX: Falls 3rd Time" style="cursor: pointer;">
    <circle cx="475" cy="250" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="475" y="254" fill="#fef08a" font-size="7.5" font-weight="bold" font-family="serif" text-anchor="middle">IX</text>
  </g>

  <!-- Station X -->
  <g class="ast-hotspot" data-target-t="0.65" data-label="Station X: Stripped of Garments" style="cursor: pointer;">
    <circle cx="525" cy="242" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="525" y="246" fill="#fef08a" font-size="8" font-weight="bold" font-family="serif" text-anchor="middle">X</text>
  </g>

  <!-- Station XI -->
  <g class="ast-hotspot" data-target-t="0.72" data-label="Station XI: Nailed to Cross" style="cursor: pointer;">
    <circle cx="565" cy="235" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="565" y="239" fill="#fef08a" font-size="7.5" font-weight="bold" font-family="serif" text-anchor="middle">XI</text>
  </g>

  <!-- Station XII -->
  <g class="ast-hotspot" data-target-t="0.80" data-label="Station XII: Dies on the Cross" style="cursor: pointer;">
    <circle cx="610" cy="225" r="14" fill="#450a0a" stroke="url(#gold-grad)" stroke-width="2" filter="url(#soft-glow)" />
    <text x="610" y="230" fill="#fef08a" font-size="8" font-weight="bold" font-family="serif" text-anchor="middle">XII</text>
  </g>

  <!-- Station XIII -->
  <g class="ast-hotspot" data-target-t="0.87" data-label="Station XIII: Taken Down (Pietà)" style="cursor: pointer;">
    <circle cx="660" cy="245" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="660" y="249" fill="#fef08a" font-size="7" font-weight="bold" font-family="serif" text-anchor="middle">XIII</text>
  </g>

  <!-- Station XIV -->
  <g class="ast-hotspot" data-target-t="0.93" data-label="Station XIV: Laid in Tomb" style="cursor: pointer;">
    <circle cx="715" cy="285" r="12" fill="#1e293b" stroke="url(#gold-grad)" stroke-width="1.5" />
    <text x="715" y="289" fill="#fef08a" font-size="7" font-weight="bold" font-family="serif" text-anchor="middle">XIV</text>
  </g>

  <!-- Devotional Vigil Candle with Living Flame -->
  <g id="devotional-candle" transform="translate(48, 410)">
    <!-- Red Votive Glass -->
    <rect x="0" y="8" width="16" height="22" rx="3" fill="#b91c1c" stroke="#f87171" stroke-width="1" opacity="0.9" />
    <line x1="2" y1="12" x2="14" y2="12" stroke="#fca5a5" stroke-width="0.8" opacity="0.7" />
    <!-- Candle Wick -->
    <line x1="8" y1="8" x2="8" y2="4" stroke="#1e293b" stroke-width="1" />
    <!-- Dynamic Flame (Animated in reactive bindings) -->
    <circle id="candle-flicker-flame" cx="8" cy="3" r="5" fill="url(#candle-radiance)" filter="url(#glow)" />
  </g>

  <!-- Draggable Pilgrim Cross Beacon (Pointer Capture & Motion Guide) -->
  <g id="pilgrim-beacon-group">
    <!-- Glow aura -->
    <circle id="pilgrim-cross-beacon" cx="75" cy="375" r="18" fill="rgba(234, 179, 8, 0.25)" stroke="#eab308" stroke-width="2" filter="url(#glow)" style="cursor: grab;" />
    <!-- Golden Cross Marker Icon -->
    <path d="M 75 365 L 75 385 M 68 371 L 82 371" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Lower HUD Plaque: Catholic Station Detail & Reverent Subtitle -->
  <g id="station-hud-card" transform="translate(110, 400)">
    <rect x="0" y="0" width="670" height="70" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5" opacity="0.96" />
    <!-- Golden Accent Top Border -->
    <line x1="0" y1="0" x2="670" y2="0" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />

    <!-- Station Roman Number & Title -->
    <text id="station-hud-num" x="16" y="22" fill="#eab308" font-size="10" font-weight="800" font-family="sans-serif" letter-spacing="1">STATION I</text>
    <text id="station-hud-title" x="110" y="22" fill="#f8fafc" font-size="13" font-weight="700" font-family="sans-serif">Jesus is Condemned to Death</text>

    <!-- Traditional Latin Inscription -->
    <text id="station-hud-latin" x="16" y="40" fill="#94a3b8" font-size="11" font-style="italic" font-family="serif">Iesus condemnatur ad mortem • Adoramus te Christe</text>

    <!-- Devotional Catechetical Rule / Description -->
    <text id="station-hud-desc" x="16" y="58" fill="#cbd5e1" font-size="10.5" font-family="sans-serif">Pilate washes his hands; the innocent Christ accepts the sentence for our redemption.</text>
  </g>
</svg>
