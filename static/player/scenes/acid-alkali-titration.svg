<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <defs>
    <linearGradient id="glass-tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#090d16"/>
  <rect x="0" y="0" width="800" height="480" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="400" y="34" fill="#f8fafc" font-size="19" font-weight="800" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Acid–Alkali Titration (25.0 cm³ 0.10 M HCl + 0.10 M NaOH)
  </text>
  <text x="400" y="54" fill="#94a3b8" font-size="11.5" font-weight="600" text-anchor="middle">
    KS4 GCSE Chemistry · Phenolphthalein End-Point · Live pH Titration Curve &amp; Ion Neutralisation Ledger
  </text>

  <!-- Left Titration Stand Apparatus -->
  <rect x="30" y="76" width="375" height="310" rx="12" fill="#0b1120" stroke="#334155" stroke-width="2"/>

  <!-- Retort Stand Pole & Base -->
  <rect x="60" y="352" width="140" height="10" rx="3" fill="#475569"/>
  <rect x="74" y="92" width="8" height="260" rx="2" fill="#64748b"/>
  <rect x="78" y="138" width="54" height="6" rx="2" fill="#94a3b8"/>

  <!-- Graduated Burette (0 to 50 cm3) -->
  <rect x="130" y="90" width="22" height="148" rx="3" fill="url(#glass-tube)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect id="burette-liquid" x="132" y="92" width="18" height="142" fill="#38bdf8" opacity="0.6"/>
  <!-- Stopcock Valve + Tip -->
  <rect x="137" y="238" width="8" height="18" fill="#cbd5e1"/>
  <rect x="126" y="242" width="30" height="7" rx="2" fill="#f59e0b"/>
  <!-- Falling Drop -->
  <circle id="burette-drop" cx="141" cy="264" r="3.5" fill="#38bdf8" opacity="0.9"/>

  <!-- Conical Flask with Indicator Liquid -->
  <path d="M 122 276 L 160 276 L 188 346 L 94 346 Z" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <polygon id="flask-solution" points="109,310 173,310 185,344 97,344" fill="#cbd5e1" opacity="0.72"/>

  <!-- Quick Burette Control Buttons directly on stage -->
  <g transform="translate(46, 272)">
    <g id="btn-drop-1" style="cursor:pointer;">
      <rect width="58" height="24" rx="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="29" y="16" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">+1.0 cm³</text>
    </g>
    <g id="btn-drop-02" transform="translate(0, 30)" style="cursor:pointer;">
      <rect width="58" height="24" rx="5" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
      <text x="29" y="16" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">+0.2 cm³</text>
    </g>
  </g>

  <!-- Live Readout Card inside Left Panel -->
  <g transform="translate(212, 92)">
    <rect width="178" height="260" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="89" y="22" fill="#94a3b8" font-size="10" font-weight="800" text-anchor="middle">DIGITAL pH METER</text>

    <rect x="16" y="34" width="146" height="52" rx="6" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <text id="ph-readout" x="89" y="67" fill="#38bdf8" font-size="24" font-weight="900" text-anchor="middle" font-family="monospace">1.00</text>

    <text x="14" y="110" fill="#94a3b8" font-size="10" font-weight="700">NaOH Added:</text>
    <text id="vol-added-readout" x="164" y="110" fill="#f8fafc" font-size="11.5" font-weight="800" text-anchor="end" font-family="monospace">0.0 cm³</text>

    <text x="14" y="136" fill="#94a3b8" font-size="10" font-weight="700">Flask Target:</text>
    <text x="164" y="136" fill="#cbd5e1" font-size="10.5" font-weight="700" text-anchor="end" font-family="monospace">25.0 cm³ HCl</text>

    <line x1="14" y1="152" x2="164" y2="152" stroke="#1e293b" stroke-width="1.5"/>

    <text x="89" y="172" fill="#94a3b8" font-size="9.5" font-weight="800" text-anchor="middle">PHENOLPHTHALEIN</text>
    <text id="indicator-label" x="89" y="192" fill="#e2e8f0" font-size="12" font-weight="800" text-anchor="middle">Colourless (Acidic)</text>

    <text x="89" y="222" fill="#94a3b8" font-size="9.5" font-weight="800" text-anchor="middle">SOLUTION REGIME</text>
    <text id="regime-label" x="89" y="242" fill="#f87171" font-size="11.5" font-weight="800" text-anchor="middle">Excess H⁺ Ions</text>
  </g>

  <!-- Right Panel: Live pH Titration Curve (:scope) -->
  <rect x="420" y="76" width="350" height="240" rx="12" fill="#0b1120" stroke="#334155" stroke-width="2"/>
  <text x="595" y="96" fill="#e2e8f0" font-size="12" font-weight="800" text-anchor="middle">
    Live Titration Curve (pH vs Volume NaOH)
  </text>

  <!-- Scope Coordinate Grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="455" y1="114" x2="750" y2="114"/>
    <line x1="455" y1="154" x2="750" y2="154"/>
    <line x1="455" y1="194" x2="750" y2="194"/>
    <line x1="455" y1="234" x2="750" y2="234"/>
    <line x1="514" y1="114" x2="514" y2="274"/>
    <line x1="573" y1="114" x2="573" y2="274"/>
    <line x1="602.5" y1="114" x2="602.5" y2="274" stroke="#475569" stroke-dasharray="4 3"/>
    <line x1="632" y1="114" x2="632" y2="274"/>
    <line x1="691" y1="114" x2="691" y2="274"/>
  </g>
  <line x1="455" y1="194" x2="750" y2="194" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="455" y1="114" x2="455" y2="274" stroke="#64748b" stroke-width="1.5"/>
  <line x1="455" y1="274" x2="750" y2="274" stroke="#64748b" stroke-width="1.5"/>

  <text x="448" y="118" fill="#94a3b8" font-size="9" text-anchor="end" font-family="monospace">14</text>
  <text x="448" y="198" fill="#4ade80" font-size="9" text-anchor="end" font-family="monospace">7</text>
  <text x="448" y="278" fill="#94a3b8" font-size="9" text-anchor="end" font-family="monospace">0</text>
  <text x="602" y="294" fill="#94a3b8" font-size="9.5" text-anchor="middle">Volume NaOH Added (0 – 50 cm³)</text>
  <text x="434" y="194" fill="#94a3b8" font-size="9.5" text-anchor="middle" transform="rotate(-90 434 194)">pH</text>

  <!-- Live Oscilloscope Curve -->
  <polyline id="titration-scope-line" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points=""/>
  <circle id="titration-cursor" cx="455" cy="262" r="4.5" fill="#facc15" stroke="#090d16" stroke-width="1.5"/>

  <!-- Conservation Ledger Group (:ledger) -->
  <rect x="420" y="328" width="350" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <g id="titration-ledger"></g>

  <!-- Bottom Equation Bar -->
  <g transform="translate(30, 400)">
    <rect width="740" height="56" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="22" fill="#38bdf8" font-size="11" font-weight="800">NEUTRALISATION STOICHIOMETRY (1:1 MOLAR RATIO):</text>
    <text x="20" y="42" fill="#e2e8f0" font-size="12.5" font-weight="700" font-family="monospace">
      HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)  ·  Equivalence at V(NaOH) = 25.0 cm³, pH = 7.00
    </text>
  </g>
</svg>
