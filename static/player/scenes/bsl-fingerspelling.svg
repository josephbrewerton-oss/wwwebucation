<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <radialGradient id="bsl-bg-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="vowel-a-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="800" height="480" fill="url(#bsl-bg-glow)" />

  <!-- 3D Spatial Floor Grid -->
  <g id="spatial-grid" stroke="rgba(255,255,255,0.07)" stroke-width="1.2">
    <ellipse cx="400" cy="360" rx="280" ry="60" fill="none" stroke-dasharray="5,5" />
    <ellipse cx="400" cy="360" rx="200" ry="42" fill="none" />
    <line x1="120" y1="360" x2="680" y2="360" />
    <line x1="400" y1="300" x2="400" y2="420" />
  </g>

  <!-- Title & Active Sign Status Bar -->
  <g transform="translate(400, 48)">
    <rect x="-220" y="-16" width="440" height="32" rx="8" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" />
    <text id="vowel-indicator-label" x="0" y="5" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="0.5">
      ACTIVE SIGN: Vowel A (Thumb Tap)
    </text>
  </g>

  <!-- Vowel Reference Map Badges (A - E - I - O - U) -->
  <g id="vowel-badges" transform="translate(400, 240)" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">
    <!-- A: Thumb -->
    <g transform="translate(-170, -10)">
      <circle cx="0" cy="0" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">A</text>
      <text x="0" y="26" fill="#94a3b8" font-size="9">Thumb</text>
    </g>
    <!-- E: Index -->
    <g transform="translate(-135, -110)">
      <circle cx="0" cy="0" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">E</text>
      <text x="0" y="26" fill="#94a3b8" font-size="9">Index</text>
    </g>
    <!-- I: Middle -->
    <g transform="translate(-65, -145)">
      <circle cx="0" cy="0" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">I</text>
      <text x="0" y="26" fill="#94a3b8" font-size="9">Middle</text>
    </g>
    <!-- O: Ring -->
    <g transform="translate(15, -110)">
      <circle cx="0" cy="0" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">O</text>
      <text x="0" y="26" fill="#94a3b8" font-size="9">Ring</text>
    </g>
    <!-- U: Pinky -->
    <g transform="translate(70, -60)">
      <circle cx="0" cy="0" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="4" fill="#ffffff">U</text>
      <text x="0" y="26" fill="#94a3b8" font-size="9">Pinky</text>
    </g>
  </g>

  <!-- 3D Hand Skeletal Stage Container -->
  <g id="hand-3d-root">
    <!-- Non-Dominant Base Hand Skeleton (Blue) -->
    <g id="base-hand" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round">
      <line id="bone-thumb" x1="350" y1="270" x2="305" y2="250" />
      <line id="bone-index" x1="350" y1="270" x2="325" y2="200" />
      <line id="bone-middle" x1="350" y1="270" x2="350" y2="190" />
      <line id="bone-ring" x1="350" y1="270" x2="372" y2="198" />
      <line id="bone-pinky" x1="350" y1="270" x2="390" y2="215" />
      
      <!-- Wrist & Forearm connection -->
      <line x1="340" y1="320" x2="350" y2="270" stroke="#0284c7" stroke-width="7" />

      <!-- Nodes -->
      <circle id="base-wrist" cx="340" cy="320" r="15" fill="#0369a1" />
      <circle id="base-palm" cx="350" cy="270" r="24" fill="#0284c7" opacity="0.85" />
      <circle id="base-thumb-tip" cx="305" cy="250" r="11" fill="#38bdf8" />
      <circle id="base-index-tip" cx="325" cy="200" r="10" fill="#38bdf8" />
      <circle id="base-middle-tip" cx="350" cy="190" r="10" fill="#38bdf8" />
      <circle id="base-ring-tip" cx="372" cy="198" r="10" fill="#38bdf8" />
      <circle id="base-pinky-tip" cx="390" cy="215" r="9" fill="#38bdf8" />
    </g>

    <!-- Active Touch Pulse Glow -->
    <circle id="active-vowel-glow" cx="305" cy="250" r="28" fill="url(#vowel-a-glow)" opacity="0.75" pointer-events="none" />

    <!-- Dominant Pointer Hand ("The Pen" - Amber/Gold) -->
    <g id="pointer-hand" stroke="#f59e0b" stroke-width="5" stroke-linecap="round">
      <line id="dom-pointer-bone" x1="460" y1="265" x2="305" y2="250" />
      <line x1="510" y1="320" x2="460" y2="265" stroke="#d97706" stroke-width="7" />

      <!-- Dominant Nodes -->
      <circle id="dom-wrist" cx="510" cy="320" r="15" fill="#b45309" />
      <circle id="dom-knuckle" cx="460" cy="265" r="20" fill="#d97706" />
      <circle id="dom-pointer-tip" cx="305" cy="250" r="12" fill="#fbbf24" filter="url(#glow-drop)" />
    </g>
  </g>

  <!-- Interactive 3D Perspective Helper Badge -->
  <g transform="translate(400, 445)">
    <rect x="-240" y="-14" width="480" height="28" rx="7" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">
      🖐️ Drag dominant hand or use 3D Orbit slider to view Signer POV vs Receiver POV
    </text>
  </g>
</svg>
