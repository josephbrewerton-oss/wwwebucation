<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <defs>
    <linearGradient id="ph-spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="28%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="72%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glass-beaker-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#090d16"/>

  <!-- Header -->
  <text x="400" y="34" fill="#f8fafc" font-size="20" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
    Acid-Base Titration Lab &amp; Universal Indicator pH Scale
  </text>
  <text x="400" y="54" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">
    KS3/KS4 Chemistry: Hydronium [H₃O⁺] vs Hydroxide [OH⁻] Logarithmic Equilibrium
  </text>

  <!-- Overhead Reagent Burette Nozzles & Live Streams -->
  <g transform="translate(220, 70)">
    <rect x="0" y="0" width="24" height="34" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="8" y="34" width="8" height="12" rx="2" fill="#475569"/>
    <text x="12" y="21" fill="#fca5a5" font-size="9" font-weight="900" text-anchor="middle">HCl</text>
    <line id="acid-stream" x1="12" y1="46" x2="12" y2="215" stroke="#ef4444" stroke-width="4" stroke-dasharray="6 4" opacity="0"/>
  </g>
  <g transform="translate(336, 70)">
    <rect x="0" y="0" width="28" height="34" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="10" y="34" width="8" height="12" rx="2" fill="#475569"/>
    <text x="14" y="21" fill="#d8b4fe" font-size="8.5" font-weight="900" text-anchor="middle">NaOH</text>
    <line id="base-stream" x1="14" y1="46" x2="14" y2="215" stroke="#a855f7" stroke-width="4" stroke-dasharray="6 4" opacity="0"/>
  </g>

  <!-- Borosilicate Reaction Beaker (Negative-Space Compound Vessel) -->
  <g id="beaker-vessel" transform="translate(160, 122)"
     data-pedagogical="ab-beaker"
     data-pedagogical-title="Borosilicate Titration Beaker"
     data-pedagogical-eq="H₃O⁺(aq) + OH⁻(aq) ⇌ 2H₂O(l)"
     data-pedagogical-desc="Universal indicator shifts from red (strong acid, pH &lt; 3) through emerald green (neutral equivalence point, pH 7.0) to violet (strong alkali, pH &gt; 11).">
    <!-- Dynamic Titrant Solution -->
    <rect id="beaker-fluid" x="8" y="88" width="244" height="144" rx="10" fill="#22c55e" opacity="0.72"/>

    <!-- Compound Negative-Space Beaker Wall (evenodd single-path rim & base) -->
    <path id="beaker-outline" fill-rule="evenodd" fill="url(#glass-beaker-sheen)" stroke="#94a3b8" stroke-width="1"
          d="M -6 0 L 266 0 L 266 8 L 260 8 L 260 220 C 260 236, 246 244, 228 244 L 32 244 C 14 244, 0 236, 0 220 L 0 8 L -6 8 Z
             M 8 8 L 8 218 C 8 229, 17 235, 32 235 L 228 235 C 243 235, 252 229, 252 218 L 252 8 Z"/>

    <!-- Volumetric Graduation Ticks -->
    <g stroke="#cbd5e1" stroke-width="1.5" opacity="0.6">
      <line x1="14" y1="60" x2="34" y2="60"/>
      <line x1="14" y1="115" x2="34" y2="115"/>
      <line x1="14" y1="170" x2="34" y2="170"/>
    </g>
    <text x="40" y="64" fill="#cbd5e1" font-size="9" font-weight="700" opacity="0.75">300 mL</text>
    <text x="40" y="119" fill="#cbd5e1" font-size="9" font-weight="700" opacity="0.75">200 mL</text>
    <text x="40" y="174" fill="#cbd5e1" font-size="9" font-weight="700" opacity="0.75">100 mL</text>

    <!-- Solution Classification & Ion Balance Readouts -->
    <text id="fluid-label" x="130" y="148" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
      Neutral Water (pH 7.0)
    </text>
    <text id="ion-ratio-label" x="130" y="170" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle" opacity="0.9" font-family="monospace">
      [H₃O⁺] = [OH⁻] • 0.0 mL Added
    </text>
  </g>

  <!-- Draggable Digital pH Sensor Meter -->
  <g id="ph-probe" transform="translate(475, 108)"
     data-pedagogical="ab-probe"
     data-pedagogical-title="Potentiometric Digital pH Probe"
     data-pedagogical-eq="pH = -log₁₀[H₃O⁺]"
     data-pedagogical-desc="Each 1.0 unit change on the pH scale represents a tenfold (10×) change in hydronium ion concentration.">
    <!-- Immersion Electrode Stem -->
    <line x1="-18" y1="60" x2="-68" y2="150" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-68" cy="150" r="6" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.5"/>

    <rect width="265" height="126" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="18" y="16" width="229" height="54" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
    <text id="ph-val" x="132" y="53" fill="#38bdf8" font-size="30" font-weight="900" text-anchor="middle" font-family="monospace">
      pH 7.0
    </text>
    <text x="132" y="90" fill="#94a3b8" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">
      DIGITAL pH ELECTRODE (DRAG ME)
    </text>
    <text id="titrant-volume-txt" x="132" y="110" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">
      Net Titrant: 0.0 mL (Equivalence)
    </text>
  </g>

  <!-- Direct Press-and-Hold Burette Control Deck -->
  <g id="titration-controls" transform="translate(475, 256)">
    <rect width="265" height="108" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="132" y="22" fill="#cbd5e1" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.6">
      PRESS &amp; HOLD REAGENT DISPENSERS
    </text>

    <!-- Hold +Acid Button -->
    <g id="btn-add-acid" transform="translate(12, 32)" style="cursor: pointer;">
      <rect width="116" height="34" rx="7" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="58" y="21" fill="#fecaca" font-size="11" font-weight="900" text-anchor="middle">🧪 Hold +Acid</text>
    </g>

    <!-- Hold +Base Button -->
    <g id="btn-add-base" transform="translate(137, 32)" style="cursor: pointer;">
      <rect width="116" height="34" rx="7" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
      <text x="58" y="21" fill="#e9d5ff" font-size="11" font-weight="900" text-anchor="middle">🧪 Hold +Alkali</text>
    </g>

    <!-- Neutralize / Equivalence Reset Button -->
    <g id="btn-neutralize" transform="translate(12, 72)" style="cursor: pointer;">
      <rect width="241" height="26" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
      <text x="120" y="17" fill="#bbf7d0" font-size="10.5" font-weight="800" text-anchor="middle">⚖️ Reset to Neutral Equivalence (pH 7.0)</text>
    </g>
  </g>

  <!-- Universal Indicator Spectrum Bar & Live Marker -->
  <g transform="translate(120, 398)"
     data-pedagogical="ab-spectrum"
     data-pedagogical-title="Sörensen Logarithmic pH Scale (0–14)"
     data-pedagogical-eq="K_w = [H₃O⁺][OH⁻] = 1.0 × 10⁻¹⁴ (at 25°C)"
     data-pedagogical-desc="Acids have pH &lt; 7 ([H₃O⁺] &gt; [OH⁻]), neutral water has pH = 7, and alkalis have pH &gt; 7 ([OH⁻] &gt; [H₃O⁺]).">
    <rect width="560" height="20" rx="10" fill="url(#ph-spectrum)" stroke="#334155" stroke-width="1.5"/>

    <!-- Live Sliding pH Indicator Marker -->
    <g id="ph-indicator-marker" transform="translate(280, 0)">
      <polygon points="0,-2 -7,-12 7,-12" fill="#f8fafc" stroke="#090d16" stroke-width="1.2"/>
      <rect x="-3" y="-1" width="6" height="22" rx="2" fill="#ffffff" stroke="#090d16" stroke-width="1.2"/>
    </g>

    <text x="4" y="38" fill="#ef4444" font-size="11.5" font-weight="800">Strong Acid (pH 0)</text>
    <text x="280" y="38" fill="#22c55e" font-size="11.5" font-weight="800" text-anchor="middle">Neutral Equivalence (pH 7)</text>
    <text x="556" y="38" fill="#c084fc" font-size="11.5" font-weight="800" text-anchor="end">Strong Alkali (pH 14)</text>
  </g>
</svg>