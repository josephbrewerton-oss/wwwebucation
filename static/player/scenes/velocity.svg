<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Lab Grid -->
    <radialGradient id="vel-bg-glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Track Neon Gradient -->
    <linearGradient id="vel-track-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Graph Screen Gradient -->
    <linearGradient id="vel-screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Velocity Vector Arrow Marker -->
    <marker id="vel-arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>

    <!-- Glow Bloom Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern for Graph -->
    <pattern id="vel-grid-pat" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Ambient Lab Backdrop -->
  <rect width="800" height="480" fill="url(#vel-bg-glow)" />

  <!-- Top Title &amp; Telemetry Header -->
  <g transform="translate(160, 20)">
    <rect width="480" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <text x="240" y="27" fill="#f8fafc" font-size="15" font-weight="800" text-anchor="middle" font-family="sans-serif">
      <tspan fill="#38bdf8">Kinematics</tspan>: Distance s = ∫v·dt | <tspan fill="#10b981">v = ds/dt</tspan> | a = dv/dt
    </text>
  </g>

  <!-- Physical Motion Vector Test Track -->
  <g id="track-section">
    <!-- Laser Track Base -->
    <line id="vel-track" x1="120" y1="130" x2="680" y2="130" stroke="url(#vel-track-grad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

    <!-- Metric Graduation Ticks &amp; Labels -->
    <g stroke="#64748b" stroke-width="2" font-family="sans-serif" font-size="11" font-weight="700">
      <line x1="120" y1="120" x2="120" y2="140" stroke="#38bdf8" stroke-width="2.5" />
      <text x="120" y="158" fill="#38bdf8" text-anchor="middle">0m (Start)</text>

      <line x1="260" y1="124" x2="260" y2="136" />
      <text x="260" y="158" fill="#94a3b8" text-anchor="middle">25m</text>

      <line x1="400" y1="122" x2="400" y2="138" stroke="#38bdf8" stroke-width="2" />
      <text x="400" y="158" fill="#e2e8f0" text-anchor="middle">50m</text>

      <line x1="540" y1="124" x2="540" y2="136" />
      <text x="540" y="158" fill="#94a3b8" text-anchor="middle">75m</text>

      <line x1="680" y1="120" x2="680" y2="140" stroke="#818cf8" stroke-width="2.5" />
      <text x="680" y="158" fill="#818cf8" text-anchor="middle">100m (Finish)</text>
    </g>

    <!-- Velocity Vector Arrow Indicator -->
    <line id="vel-arrow-line" x1="120" y1="105" x2="160" y2="105" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" marker-end="url(#vel-arrow-head)" filter="url(#glow)" />

    <!-- Vehicle Probe Particle -->
    <circle id="vel-particle" cx="120" cy="130" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    <circle cx="120" cy="130" r="4" fill="#ffffff" />
  </g>

  <!-- Oscilloscope Distance-Time Cartesian Telemetry Box -->
  <g transform="translate(180, 200)">
    <!-- Monitor Bezel -->
    <rect width="440" height="230" rx="12" fill="url(#vel-screen-grad)" stroke="#334155" stroke-width="2" />
    <!-- Oscilloscope Grid Screen -->
    <rect x="40" y="25" width="360" height="165" fill="#030712" stroke="#1e293b" rx="6" />
    <rect x="40" y="25" width="360" height="165" fill="url(#vel-grid-pat)" rx="6" />

    <!-- Theoretical Parabolic S-Curve Guide -->
    <path d="M 60 170 Q 200 165 300 90 T 380 45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" opacity="0.4" />

    <!-- Axes -->
    <line x1="60" y1="170" x2="380" y2="170" stroke="#475569" stroke-width="2.5" />
    <line x1="60" y1="170" x2="60" y2="35" stroke="#475569" stroke-width="2.5" />

    <!-- Axis Labels -->
    <text x="50" y="45" fill="#38bdf8" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="end">s (m)</text>
    <text x="385" y="165" fill="#38bdf8" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="start">t (s)</text>
    <text x="60" y="185" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">0</text>
    <text x="220" y="185" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">Time Elapsed (s)</text>
    <text x="380" y="185" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">10s</text>

    <!-- Dynamic Telemetry Dot -->
    <circle id="vel-graph-dot" cx="60" cy="170" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />

    <!-- Screen Header Badge -->
    <rect x="135" y="8" width="170" height="20" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="220" y="22" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">
      DISTANCE-TIME GRAPH: s(t)
    </text>
  </g>
</svg>
