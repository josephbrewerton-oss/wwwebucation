<svg id="stage-svg" viewBox="0 0 800 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#090d16;">
  <defs>
    <radialGradient id="pp-bg" cx="44%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#172540"/>
      <stop offset="60%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="pp-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="38%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pp-gantry" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="pp-brass-pivot" cx="45%" cy="42%" r="55%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="pp-bob-sphere" cx="46%" cy="44%" r="58%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="28%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#172554"/>
    </radialGradient>
    <linearGradient id="pp-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <g id="pp-bolt">
      <circle cx="0" cy="0" r="3.5" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>
      <line x1="-2" y1="0" x2="2" y2="0" stroke="#334155" stroke-width="1"/>
    </g>
  </defs>

  <!-- Lab Backdrop & Floor Reference -->
  <rect width="800" height="480" fill="url(#pp-bg)" aria-hidden="true"/>
  <rect x="0" y="388" width="800" height="92" fill="#070c18" aria-hidden="true"/>
  <line x1="0" y1="388" x2="800" y2="388" stroke="#1e293b" stroke-width="2" aria-hidden="true"/>

  <!-- Header -->
  <text x="400" y="38" fill="#f8fafc" font-size="20.5" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">
    PhET Distilled: Pendulum Harmonic Oscillator
  </text>
  <text x="400" y="61" fill="#94a3b8" font-size="12.5" text-anchor="middle" font-family="system-ui, sans-serif">
    Simple Harmonic Motion &amp; Period Invariance: T = 2π√(L / g)
  </text>

  <!-- Gantry Frame & Precision Protractor Arc -->
  <g aria-hidden="true">
    <!-- Vertical Gantry Struts -->
    <rect x="278" y="92" width="12" height="296" rx="2" fill="url(#pp-gantry)" stroke="#0f172a" stroke-width="1"/>
    <rect x="510" y="92" width="12" height="296" rx="2" fill="url(#pp-gantry)" stroke="#0f172a" stroke-width="1"/>
    <rect x="260" y="380" width="280" height="10" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <!-- Vertical Plumb Equilibrium Reference -->
    <line x1="400" y1="96" x2="400" y2="378" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.32"/>
    <!-- Precision Protractor Arc (±35° around pivot 400,96) -->
    <path d="M 332 192 A 118 118 0 0 0 468 192" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4"/>
    <path d="M 344 176 A 98 98 0 0 0 456 176" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 4"/>
    <g stroke="#64748b" stroke-width="1.5" stroke-linecap="round">
      <line x1="400" y1="208" x2="400" y2="218" stroke="#38bdf8"/>
      <line x1="370" y1="204" x2="367" y2="213"/>
      <line x1="430" y1="204" x2="433" y2="213"/>
      <line x1="342" y1="191" x2="337" y2="199"/>
      <line x1="458" y1="191" x2="463" y2="199"/>
    </g>
    <text x="334" y="213" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">−30°</text>
    <text x="400" y="229" fill="#38bdf8" font-size="9.5" font-weight="800" text-anchor="middle">0°</text>
    <text x="466" y="213" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">+30°</text>
    <!-- Brushed Steel Crossbeam -->
    <rect x="272" y="84" width="256" height="16" rx="4" fill="url(#pp-steel)" stroke="#0f172a" stroke-width="1.2"/>
    <use href="#pp-bolt" x="284" y="92"/>
    <use href="#pp-bolt" x="516" y="92"/>
    <rect x="378" y="86" width="44" height="16" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Oscillating String & Specular 3D Bob -->
  <g id="pendulum-arm" style="cursor: grab;"
     role="button" tabindex="0" aria-label="Interactive pendulum arm and bob"
     data-pedagogical="pendulum-bob"
     data-pedagogical-title="Simple Gravity Pendulum"
     data-pedagogical-eq="T = 2π√(L / g)  (Independent of Mass m)"
     data-pedagogical-desc="Gravitational restoring force (-mg sin θ) accelerates the bob proportionally to mass m, so mass cancels out of the period equation.">
    <line x1="400" y1="96" x2="400" y2="306" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" id="string-line"/>
    <circle cx="400" cy="306" r="24" fill="url(#pp-bob-sphere)" stroke="#93c5fd" stroke-width="2" id="bob-circle"/>
    <text id="bob-mass-txt" x="400" y="311" fill="#ffffff" font-size="11.5" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">1.5 kg</text>
  </g>

  <!-- Brass Pivot Bearing Pin (Layered above string top) -->
  <circle cx="400" cy="96" r="8" fill="url(#pp-brass-pivot)" stroke="#451a03" stroke-width="1.4" aria-hidden="true"/>
  <circle cx="400" cy="96" r="2.5" fill="#fef9c3" aria-hidden="true"/>

  <!-- Energy & Period Telemetry Instrument Card -->
  <g transform="translate(550, 126)"
     data-pedagogical="pendulum-energy"
     data-pedagogical-title="Mechanical Energy Conservation"
     data-pedagogical-eq="E_total = KE + GPE = Constant"
     data-pedagogical-desc="Gravitational potential energy peaks at extreme swing angles, converting into kinetic energy at the bottom equilibrium point.">
    <rect x="4" y="6" width="224" height="172" rx="12" fill="#020617" opacity="0.6" aria-hidden="true"/>
    <rect width="224" height="172" rx="12" fill="url(#pp-card)" stroke="#334155" stroke-width="1.6"/>
    <rect x="10" y="3" width="204" height="2" rx="1" fill="#38bdf8" opacity="0.4" aria-hidden="true"/>
    <text x="112" y="25" fill="#cbd5e1" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.9" font-family="system-ui, sans-serif">HARMONIC TELEMETRY</text>
    <line x1="16" y1="34" x2="208" y2="34" stroke="#334155" stroke-width="1" aria-hidden="true"/>
    <text id="ke-val-txt" x="18" y="58" fill="#38bdf8" font-size="12" font-weight="800" font-family="monospace">Kinetic (KE): 7.5 J</text>
    <text id="pe-val-txt" x="18" y="84" fill="#facc15" font-size="12" font-weight="800" font-family="monospace">Potential (PE): 7.5 J</text>
    <text id="total-e-txt" x="18" y="112" fill="#4ade80" font-size="12" font-weight="900" font-family="monospace">Total E: 15.0 J</text>
    <line x1="16" y1="128" x2="208" y2="128" stroke="#334155" stroke-width="1.2" aria-hidden="true"/>
    <text id="period-readout-txt" x="112" y="152" fill="#f8fafc" font-size="13.5" font-weight="900" text-anchor="middle" font-family="monospace">Period T = 2.01 s</text>
  </g>

  <!-- Invariant Equation Footer -->
  <g aria-hidden="true">
    <rect x="44" y="408" width="712" height="40" rx="9" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.4"/>
  </g>
  <text id="pendulum-invariant-banner" x="400" y="433" fill="#38bdf8" font-size="13.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">
    Invariant: Mass (1.5 kg) does not change period T — only Length (1.0 m) and Gravity (9.8 m/s²) matter!
  </text>
</svg>